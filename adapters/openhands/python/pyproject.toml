[project]
name = "bc-openhands-adapter"
version = "0.1.0"
description = "Thin JSON-RPC/stdio adapter between the boundedcode control plane and the OpenHands Software Agent SDK"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly; upgrades follow docs/licensing/policy.md.
    "openhands-sdk==1.51.0",
    "openhands-tools==1.51.0",
]

[project.scripts]
bc-openhands-adapter = "bc_openhands.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bc_openhands"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# lmnr (Laminar tracing, pulled in by openhands-sdk) depends on
# lmnr-claude-code-proxy, which is licensed "LicenseRef-Proprietary". It is only
# imported by Laminar's Claude-agent instrumentation, which this adapter never
# enables. Exclude it so the environment contains no proprietary code.
# See docs/licensing/upstream-license-matrix.md.
override-dependencies = ["lmnr-claude-code-proxy; sys_platform == 'never'"]
