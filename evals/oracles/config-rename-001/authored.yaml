    "internal/config/oracle_deploy_files_test.go": "package config\n\nimport (\n\t\"io/fs\"\n\t\"os\"\n\t\"path/filepath\"\n\t\"regexp\"\n\t\"strings\"\n\t\"testing\"\n)\n\nvar oracleOldNameRe = regexp.MustCompile(`\\bDB_URL\\b`)\n\n// oracleRepoRoot walks up from the working directory to the directory holding go.mod.\nfunc oracleRepoRoot(t *testing.T) string {\n\tt.Helper()\n\tdir, err := os.Getwd()\n\tif err != nil {\n\t\tt.Fatalf(\"getwd: %v\", err)\n\t}\n\tfor {\n\t\tif _, err := os.Stat(filepath.Join(dir, \"go.mod\")); err == nil {\n\t\t\treturn dir\n\t\t}\n\t\tparent := filepath.Dir(dir)\n\t\tif parent == dir {\n\t\t\tt.Fatalf(\"go.mod not found above working directory\")\n\t\t}\n\t\tdir = parent\n\t}\n}\n\nfunc oracleReadRepoFile(t *testing.T, name string) string {\n\tt.Helper()\n\tb, err := os.ReadFile(filepath.Join(oracleRepoRoot(t), name))\n\tif err != nil {\n\t\tt.Fatalf(\"read %s: %v\", name, err)\n\t}\n\treturn string(b)\n}\n\nfunc oracleIndent(line string) int {\n\treturn len(line) - len(strings.TrimLeft(line, \" \"))\n}\n\nfunc oracleUnquote(s string) string {\n\ts = strings.TrimSpace(s)\n\tif i := strings.Index(s, \" #\"); i >= 0 {\n\t\ts = strings.TrimSpace(s[:i])\n\t}\n\tif len(s) >= 2 && (s[0] == '\"' && s[len(s)-1] == '\"' || s[0] == '\\'' && s[len(s)-1] == '\\'') {\n\t\treturn s[1 : len(s)-1]\n\t}\n\treturn s\n}\n\n// oracleYAMLBlock returns the lines nested under the first key matching name\n// that appears within lines at exactly the given indent.\nfunc oracleYAMLBlock(lines []string, indent int, name string) ([]string, bool) {\n\tfor i, l := range lines {\n\t\ttrim := strings.TrimSpace(l)\n\t\tif trim == \"\" || strings.HasPrefix(trim, \"#\") {\n\t\t\tcontinue\n\t\t}\n\t\tif oracleIndent(l) != indent || !(trim == name+\":\" || strings.HasPrefix(trim, name+\": #\")) {\n\t\t\tcontinue\n\t\t}\n\t\tvar out []string\n\t\tfor _, c := range lines[i+1:] {\n\t\t\tct := strings.TrimSpace(c)\n\t\t\tif ct == \"\" || strings.HasPrefix(ct, \"#\") {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif oracleIndent(c) <= indent && !(oracleIndent(c) == indent && strings.HasPrefix(ct, \"- \")) {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tout = append(out, c)\n\t\t}\n\t\treturn out, true\n\t}\n\treturn nil, false\n}\n\nfunc oracleChildIndent(lines []string) int {\n\tfor _, l := range lines {\n\t\tif strings.TrimSpace(l) != \"\" {\n\t\t\treturn oracleIndent(l)\n\t\t}\n\t}\n\treturn -1\n}\n\n// oracleComposeEnv returns the environment of a docker-compose service,\n// accepting both the mapping and the list (\"- KEY=value\") forms.\nfunc oracleComposeEnv(t *testing.T, compose, service string) map[string]string {\n\tt.Helper()\n\tlines := strings.Split(strings.ReplaceAll(compose, \"\\r\\n\", \"\\n\"), \"\\n\")\n\tservices, ok := oracleYAMLBlock(lines, 0, \"services\")\n\tif !ok {\n\t\tt.Fatalf(\"docker-compose.yml: no top-level services key\")\n\t}\n\tsvc, ok := oracleYAMLBlock(services, oracleChildIndent(services), service)\n\tif !ok {\n\t\tt.Fatalf(\"docker-compose.yml: no %q service\", service)\n\t}\n\tenvLines, ok := oracleYAMLBlock(svc, oracleChildIndent(svc), \"environment\")\n\tif !ok {\n\t\tt.Fatalf(\"docker-compose.yml: %q service has no environment block\", service)\n\t}\n\tenv := map[string]string{}\n\tfor _, l := range envLines {\n\t\ttrim := strings.TrimSpace(l)\n\t\tif strings.HasPrefix(trim, \"- \") {\n\t\t\titem := oracleUnquote(strings.TrimPrefix(trim, \"- \"))\n\t\t\tk, v, _ := strings.Cut(item, \"=\")\n\t\t\tenv[strings.TrimSpace(k)] = v\n\t\t\tcontinue\n\t\t}\n\t\tk, v, ok := strings.Cut(trim, \":\")\n\t\tif !ok {\n\t\t\tcontinue\n\t\t}\n\t\tenv[oracleUnquote(k)] = oracleUnquote(v)\n\t}\n\treturn env\n}\n\nfunc TestOracleComposeSetsDatabaseURL(t *testing.T) {\n\tenv := oracleComposeEnv(t, oracleReadRepoFile(t, \"docker-compose.yml\"), \"api\")\n\tv, ok := env[\"DATABASE_URL\"]\n\tif !ok {\n\t\tt.Fatalf(\"docker-compose.yml: api environment does not set DATABASE_URL; got %v\", env)\n\t}\n\tif v != \"postgres://db/svc\" {\n\t\tt.Fatalf(\"docker-compose.yml: api DATABASE_URL = %q, want %q\", v, \"postgres://db/svc\")\n\t}\n}\n\nfunc TestOracleComposeNoLongerSetsDBURL(t *testing.T) {\n\tcompose := oracleReadRepoFile(t, \"docker-compose.yml\")\n\tif oracleOldNameRe.MatchString(compose) {\n\t\tt.Fatalf(\"docker-compose.yml still mentions DB_URL:\\n%s\", compose)\n\t}\n\tenv := oracleComposeEnv(t, compose, \"api\")\n\tif _, ok := env[\"DB_URL\"]; ok {\n\t\tt.Fatalf(\"docker-compose.yml: api environment still sets DB_URL\")\n\t}\n}\n\nfunc TestOracleComposePreservesOtherSettings(t *testing.T) {\n\tcompose := oracleReadRepoFile(t, \"docker-compose.yml\")\n\tenv := oracleComposeEnv(t, compose, \"api\")\n\tif got := env[\"LISTEN_ADDR\"]; got != \":8080\" {\n\t\tt.Fatalf(\"docker-compose.yml: api LISTEN_ADDR = %q, want %q\", got, \":8080\")\n\t}\n\tif !regexp.MustCompile(`(?m)^\\s+image:\\s*[\"']?postgres:17[\"']?\\s*$`).MatchString(compose) {\n\t\tt.Fatalf(\"docker-compose.yml: db service image postgres:17 missing:\\n%s\", compose)\n\t}\n\tif !regexp.MustCompile(`(?m)^\\s+build:\\s*\\.\\s*$`).MatchString(compose) {\n\t\tt.Fatalf(\"docker-compose.yml: api service build: . missing:\\n%s\", compose)\n\t}\n}\n\n// oracleDockerfileFinalEnv returns ENV variables declared in the last build stage.\nfunc oracleDockerfileFinalEnv(dockerfile string) map[string]string {\n\ttext := strings.ReplaceAll(dockerfile, \"\\\\\\r\\n\", \" \")\n\ttext = strings.ReplaceAll(text, \"\\\\\\n\", \" \")\n\tenv := map[string]string{}\n\tfor _, raw := range strings.Split(text, \"\\n\") {\n\t\tline := strings.TrimSpace(raw)\n\t\tfields := strings.Fields(line)\n\t\tif len(fields) == 0 {\n\t\t\tcontinue\n\t\t}\n\t\tswitch strings.ToUpper(fields[0]) {\n\t\tcase \"FROM\":\n\t\t\tenv = map[string]string{}\n\t\tcase \"ENV\":\n\t\t\trest := strings.TrimSpace(line[len(fields[0]):])\n\t\t\tif len(fields) >= 2 && !strings.Contains(fields[1], \"=\") {\n\t\t\t\t// Legacy form: ENV KEY value...\n\t\t\t\tk := fields[1]\n\t\t\t\tenv[k] = oracleUnquote(strings.TrimSpace(rest[len(k):]))\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tfor _, kv := range oracleSplitEnvPairs(rest) {\n\t\t\t\tk, v, _ := strings.Cut(kv, \"=\")\n\t\t\t\tenv[k] = oracleUnquote(v)\n\t\t\t}\n\t\t}\n\t}\n\treturn env\n}\n\n// oracleSplitEnvPairs splits \"A=1 B=\\\"x y\\\"\" into pairs, honouring quotes.\nfunc oracleSplitEnvPairs(s string) []string {\n\tvar out []string\n\tvar cur strings.Builder\n\tvar quote byte\n\tfor i := 0; i < len(s); i++ {\n\t\tc := s[i]\n\t\tswitch {\n\t\tcase quote != 0:\n\t\t\tcur.WriteByte(c)\n\t\t\tif c == quote {\n\t\t\t\tquote = 0\n\t\t\t}\n\t\tcase c == '\"' || c == '\\'':\n\t\t\tquote = c\n\t\t\tcur.WriteByte(c)\n\t\tcase c == ' ' || c == '\\t':\n\t\t\tif cur.Len() > 0 {\n\t\t\t\tout = append(out, cur.String())\n\t\t\t\tcur.Reset()\n\t\t\t}\n\t\tdefault:\n\t\t\tcur.WriteByte(c)\n\t\t}\n\t}\n\tif cur.Len() > 0 {\n\t\tout = append(out, cur.String())\n\t}\n\treturn out\n}\n\nfunc TestOracleDockerfileDeclaresDatabaseURL(t *testing.T) {\n\tenv := oracleDockerfileFinalEnv(oracleReadRepoFile(t, \"Dockerfile\"))\n\tv, ok := env[\"DATABASE_URL\"]\n\tif !ok {\n\t\tt.Fatalf(\"Dockerfile: final stage does not declare ENV DATABASE_URL; got %v\", env)\n\t}\n\tif v != \"\" {\n\t\tt.Fatalf(\"Dockerfile: DATABASE_URL default = %q, want empty (only the name should change)\", v)\n\t}\n}\n\nfunc TestOracleDockerfileNoLongerDeclaresDBURL(t *testing.T) {\n\tdf := oracleReadRepoFile(t, \"Dockerfile\")\n\tif oracleOldNameRe.MatchString(df) {\n\t\tt.Fatalf(\"Dockerfile still mentions DB_URL:\\n%s\", df)\n\t}\n\tif _, ok := oracleDockerfileFinalEnv(df)[\"DB_URL\"]; ok {\n\t\tt.Fatalf(\"Dockerfile: final stage still declares DB_URL\")\n\t}\n}\n\nfunc TestOracleDockerfilePreservesOtherSettings(t *testing.T) {\n\tdf := oracleReadRepoFile(t, \"Dockerfile\")\n\tenv := oracleDockerfileFinalEnv(df)\n\tif got, ok := env[\"LISTEN_ADDR\"]; !ok || got != \":8080\" {\n\t\tt.Fatalf(\"Dockerfile: LISTEN_ADDR = %q (present=%v), want %q\", got, ok, \":8080\")\n\t}\n\tfor _, want := range []string{\n\t\t\"FROM golang:1.26 AS build\",\n\t\t\"RUN go build -o /out/svc ./...\",\n\t\t\"FROM debian:bookworm-slim\",\n\t\t\"COPY --from=build /out/svc /usr/local/bin/svc\",\n\t} {\n\t\tif !strings.Contains(df, want) {\n\t\t\tt.Errorf(\"Dockerfile: missing %q\", want)\n\t\t}\n\t}\n}\n\nfunc TestOracleInternalSourcesUseNewName(t *testing.T) {\n\troot := filepath.Join(oracleRepoRoot(t), \"internal\")\n\tsawNew := false\n\terr := filepath.WalkDir(root, func(path string, d fs.DirEntry, err error) error {\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\t\tif d.IsDir() || !strings.HasSuffix(path, \".go\") || strings.HasSuffix(path, \"_test.go\") {\n\t\t\treturn nil\n\t\t}\n\t\tb, err := os.ReadFile(path)\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\t\tsrc := string(b)\n\t\tif oracleOldNameRe.MatchString(src) {\n\t\t\trel, _ := filepath.Rel(root, path)\n\t\t\tt.Errorf(\"internal/%s still references DB_URL\", rel)\n\t\t}\n\t\tif strings.Contains(src, `\"DATABASE_URL\"`) {\n\t\t\tsawNew = true\n\t\t}\n\t\treturn nil\n\t})\n\tif err != nil {\n\t\tt.Fatalf(\"walk internal: %v\", err)\n\t}\n\tif !sawNew {\n\t\tt.Errorf(\"no non-test Go file under internal/ references \\\"DATABASE_URL\\\"\")\n\t}\n}\n",
    "internal/config/oracle_database_url_test.go": "package config\n\nimport (\n\t\"os\"\n\t\"testing\"\n)\n\n// oracleUnsetenv clears key for the duration of the test and restores it afterwards.\nfunc oracleUnsetenv(t *testing.T, key string) {\n\tt.Helper()\n\tt.Setenv(key, \"\")\n\tif err := os.Unsetenv(key); err != nil {\n\t\tt.Fatalf(\"unsetenv %s: %v\", key, err)\n\t}\n}\n\nfunc oracleClearEnv(t *testing.T) {\n\tt.Helper()\n\tfor _, k := range []string{\"DATABASE_URL\", \"DB_URL\", \"LISTEN_ADDR\"} {\n\t\toracleUnsetenv(t, k)\n\t}\n}\n\nfunc TestOracleLoadReadsDatabaseURL(t *testing.T) {\n\toracleClearEnv(t)\n\tt.Setenv(\"DATABASE_URL\", \"postgres://db/svc\")\n\n\tcfg := Load()\n\tif cfg.DatabaseURL != \"postgres://db/svc\" {\n\t\tt.Fatalf(\"Load().DatabaseURL = %q, want %q (read from DATABASE_URL)\", cfg.DatabaseURL, \"postgres://db/svc\")\n\t}\n}\n\nfunc TestOracleLoadDatabaseURLPreservesValueVerbatim(t *testing.T) {\n\toracleClearEnv(t)\n\tconst v = \"postgres://user:p%40ss@host:5432/db?sslmode=disable&x= y \"\n\tt.Setenv(\"DATABASE_URL\", v)\n\n\tif got := Load().DatabaseURL; got != v {\n\t\tt.Fatalf(\"Load().DatabaseURL = %q, want %q\", got, v)\n\t}\n}\n\nfunc TestOracleLoadIgnoresOldDBURL(t *testing.T) {\n\toracleClearEnv(t)\n\tt.Setenv(\"DB_URL\", \"postgres://old/svc\")\n\n\tif got := Load().DatabaseURL; got != \"\" {\n\t\tt.Fatalf(\"Load().DatabaseURL = %q with only DB_URL set; DB_URL should no longer be read\", got)\n\t}\n}\n\nfunc TestOracleLoadPrefersDatabaseURLOverDBURL(t *testing.T) {\n\toracleClearEnv(t)\n\tt.Setenv(\"DB_URL\", \"postgres://old/svc\")\n\tt.Setenv(\"DATABASE_URL\", \"postgres://new/svc\")\n\n\tif got := Load().DatabaseURL; got != \"postgres://new/svc\" {\n\t\tt.Fatalf(\"Load().DatabaseURL = %q, want %q\", got, \"postgres://new/svc\")\n\t}\n}\n\nfunc TestOracleLoadDatabaseURLEmptyWhenUnset(t *testing.T) {\n\toracleClearEnv(t)\n\n\tcfg := Load()\n\tif cfg.DatabaseURL != \"\" {\n\t\tt.Fatalf(\"Load().DatabaseURL = %q with nothing set, want empty\", cfg.DatabaseURL)\n\t}\n\tif cfg.ListenAddr != \"\" {\n\t\tt.Fatalf(\"Load().ListenAddr = %q with nothing set, want empty\", cfg.ListenAddr)\n\t}\n}\n\nfunc TestOracleLoadListenAddrUnchanged(t *testing.T) {\n\toracleClearEnv(t)\n\tt.Setenv(\"LISTEN_ADDR\", \":9090\")\n\n\tcfg := Load()\n\tif cfg.ListenAddr != \":9090\" {\n\t\tt.Fatalf(\"Load().ListenAddr = %q, want %q\", cfg.ListenAddr, \":9090\")\n\t}\n\tif cfg.DatabaseURL != \"\" {\n\t\tt.Fatalf(\"Load().DatabaseURL = %q, want empty (LISTEN_ADDR must not leak into it)\", cfg.DatabaseURL)\n\t}\n}\n\nfunc TestOracleLoadBothFieldsIndependent(t *testing.T) {\n\toracleClearEnv(t)\n\tt.Setenv(\"DATABASE_URL\", \"postgres://db/svc\")\n\tt.Setenv(\"LISTEN_ADDR\", \":8080\")\n\n\twant := Config{DatabaseURL: \"postgres://db/svc\", ListenAddr: \":8080\"}\n\tif got := Load(); got != want {\n\t\tt.Fatalf(\"Load() = %+v, want %+v\", got, want)\n\t}\n}\n"
