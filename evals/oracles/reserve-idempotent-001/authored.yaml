   "files": {
    "internal/inventory/oracle_reserve_test.go": "package inventory\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"reflect\"\n\t\"sync\"\n\t\"testing\"\n\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/store\"\n)\n\nconst (\n\toracleSKU      domain.SKU = \"AB-1234\"\n\toracleOtherSKU domain.SKU = \"CD-5678\"\n)\n\n// oracleSetup builds a store with two orderable SKUs, ten units of each on\n// hand, and an inventory service over it.\nfunc oracleSetup(t *testing.T) (*Service, *store.Memory) {\n\tt.Helper()\n\tmem := store.NewMemory()\n\tctx := context.Background()\n\tfor _, sku := range []domain.SKU{oracleSKU, oracleOtherSKU} {\n\t\titem := domain.Item{\n\t\t\tSKU: sku, Name: \"Widget \" + string(sku), Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(500, domain.GBP), WeightGram: 250,\n\t\t}\n\t\tif err := mem.PutItem(ctx, item); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif err := mem.PutStock(ctx, store.Stock{SKU: sku, OnHand: 10}); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\treturn New(mem, mem), mem\n}\n\nvar (\n\toracleContextType = reflect.TypeOf((*context.Context)(nil)).Elem()\n\toracleSKUType     = reflect.TypeOf(domain.SKU(\"\"))\n\toracleErrorType   = reflect.TypeOf((*error)(nil)).Elem()\n)\n\n// oracleArgs fills values for Reserve's inputs by type, so the tests do not\n// depend on the parameter order or on whether the order identifier is passed\n// on its own or inside a request struct.\ntype oracleArgs struct {\n\tctx     context.Context\n\tkey     domain.OrderID\n\tsku     domain.SKU\n\tqty     int\n\tusedKey bool\n}\n\nfunc (a *oracleArgs) value(t *testing.T, typ reflect.Type) reflect.Value {\n\tt.Helper()\n\tswitch {\n\tcase typ == oracleContextType:\n\t\treturn reflect.ValueOf(a.ctx)\n\tcase typ == oracleSKUType:\n\t\treturn reflect.ValueOf(a.sku)\n\tcase typ.Kind() == reflect.Int:\n\t\treturn reflect.ValueOf(a.qty).Convert(typ)\n\tcase typ.Kind() == reflect.String:\n\t\ta.usedKey = true\n\t\treturn reflect.ValueOf(a.key).Convert(typ)\n\tcase typ.Kind() == reflect.Struct:\n\t\tv := reflect.New(typ).Elem()\n\t\tfor i := 0; i < typ.NumField(); i++ {\n\t\t\tf := typ.Field(i)\n\t\t\tif !f.IsExported() {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tv.Field(i).Set(a.value(t, f.Type))\n\t\t}\n\t\treturn v\n\tcase typ.Kind() == reflect.Pointer && typ.Elem().Kind() == reflect.Struct:\n\t\tp := reflect.New(typ.Elem())\n\t\tp.Elem().Set(a.value(t, typ.Elem()))\n\t\treturn p\n\t}\n\tt.Fatalf(\"Reserve takes a parameter of type %s that the tests do not know how to fill\", typ)\n\treturn reflect.Value{}\n}\n\n// oracleReserver checks svc.Reserve's signature and returns a function that\n// calls it for a given order. When requireKey is set the test fails if Reserve\n// has no way to be told which order is asking. The returned function is safe\n// to call from other goroutines: every check that can fail happens here.\nfunc oracleReserver(t *testing.T, svc *Service, requireKey bool) func(key domain.OrderID, sku domain.SKU, qty int) error {\n\tt.Helper()\n\tm := reflect.ValueOf(svc).MethodByName(\"Reserve\")\n\tif !m.IsValid() {\n\t\tt.Fatal(\"inventory.Service has no Reserve method\")\n\t}\n\tmt := m.Type()\n\tn := mt.NumIn()\n\tif mt.IsVariadic() {\n\t\tn--\n\t}\n\tbuild := func(a *oracleArgs) []reflect.Value {\n\t\tvar in []reflect.Value\n\t\tfor i := 0; i < n; i++ {\n\t\t\tin = append(in, a.value(t, mt.In(i)))\n\t\t}\n\t\treturn in\n\t}\n\tprobe := &oracleArgs{ctx: context.Background()}\n\tbuild(probe)\n\tif requireKey && !probe.usedKey {\n\t\tt.Fatalf(\"Reserve%s has no parameter identifying the order, so it cannot tell a repeat from a new reservation\", mt)\n\t}\n\tif mt.NumOut() == 0 || mt.Out(mt.NumOut()-1) != oracleErrorType {\n\t\tt.Fatalf(\"Reserve%s does not return an error last\", mt)\n\t}\n\treturn func(key domain.OrderID, sku domain.SKU, qty int) error {\n\t\tout := m.Call(build(&oracleArgs{ctx: context.Background(), key: key, sku: sku, qty: qty}))\n\t\terr, _ := out[len(out)-1].Interface().(error)\n\t\treturn err\n\t}\n}\n\n// oracleReserve calls svc.Reserve once for the given order.\nfunc oracleReserve(t *testing.T, svc *Service, requireKey bool, key domain.OrderID, sku domain.SKU, qty int) error {\n\tt.Helper()\n\treturn oracleReserver(t, svc, requireKey)(key, sku, qty)\n}\n\nfunc oracleAvailable(t *testing.T, svc *Service, sku domain.SKU) int {\n\tt.Helper()\n\tn, err := svc.Available(context.Background(), sku)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn n\n}\n\nfunc oracleWantAvailable(t *testing.T, svc *Service, sku domain.SKU, want int) {\n\tt.Helper()\n\tif got := oracleAvailable(t, svc, sku); got != want {\n\t\tt.Fatalf(\"available %s = %d, want %d\", sku, got, want)\n\t}\n}\n\n// --- Behaviour the change adds ---\n\nfunc TestOracleReserveRepeatForSameOrderTakesNoMoreStock(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tfor i := 0; i < 3; i++ {\n\t\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 3); err != nil {\n\t\t\tt.Fatalf(\"attempt %d: %v\", i+1, err)\n\t\t}\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 7)\n}\n\nfunc TestOracleReserveRepeatLeavesStoredReservationUnchanged(t *testing.T) {\n\tsvc, mem := oracleSetup(t)\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 4); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 4); err != nil {\n\t\tt.Fatalf(\"repeat: %v\", err)\n\t}\n\tst, err := mem.GetStock(context.Background(), oracleSKU)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif st.OnHand != 10 || st.Reserved != 4 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 10 and 4\", st.OnHand, st.Reserved)\n\t}\n}\n\nfunc TestOracleReserveRepeatDoesNotBlockAnotherOrder(t *testing.T) {\n\t// The reported bug: a retried order takes the stock a later customer needs.\n\tsvc, _ := oracleSetup(t)\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 6); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 6); err != nil {\n\t\tt.Fatalf(\"repeat: %v\", err)\n\t}\n\tif err := oracleReserve(t, svc, true, \"o2\", oracleSKU, 4); err != nil {\n\t\tt.Fatalf(\"second customer refused after a repeat: %v\", err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 0)\n}\n\nfunc TestOracleReserveRepeatInterleavedWithOtherOrders(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tsteps := []struct {\n\t\tkey domain.OrderID\n\t\tqty int\n\t}{{\"o1\", 3}, {\"o2\", 4}, {\"o1\", 3}, {\"o2\", 4}, {\"o1\", 3}}\n\tfor _, s := range steps {\n\t\tif err := oracleReserve(t, svc, true, s.key, oracleSKU, s.qty); err != nil {\n\t\t\tt.Fatalf(\"%s: %v\", s.key, err)\n\t\t}\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 3)\n}\n\nfunc TestOracleReserveSameOrderDifferentSKUsBothReserved(t *testing.T) {\n\t// A multi-line order reserves once per line; a key that ignores the SKU\n\t// would wrongly treat the second line as a repeat of the first.\n\tsvc, _ := oracleSetup(t)\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 2); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleOtherSKU, 5); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 8)\n\toracleWantAvailable(t, svc, oracleOtherSKU, 5)\n\n\t// And repeating both lines changes nothing.\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 2); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleOtherSKU, 5); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 8)\n\toracleWantAvailable(t, svc, oracleOtherSKU, 5)\n}\n\nfunc TestOracleReserveDifferentOrdersEachTakeStock(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 3); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := oracleReserve(t, svc, true, \"o2\", oracleSKU, 3); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 4)\n}\n\nfunc TestOracleReserveFailedAttemptIsNotRememberedAsDone(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tctx := context.Background()\n\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 15); !errors.Is(err, ErrInsufficientStock) {\n\t\tt.Fatalf(\"first attempt: got %v, want ErrInsufficientStock\", err)\n\t}\n\t// A repeat of a refused reservation must still be refused, not reported as\n\t// already held.\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 15); !errors.Is(err, ErrInsufficientStock) {\n\t\tt.Fatalf(\"repeat of refused attempt: got %v, want ErrInsufficientStock\", err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 10)\n\n\t// Once stock arrives the same order can reserve for real.\n\tif err := svc.Receive(ctx, oracleSKU, 10); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 15); err != nil {\n\t\tt.Fatalf(\"after restock: %v\", err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 5)\n}\n\nfunc TestOracleReserveInvalidQuantityIsNotRememberedAsDone(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 0); err == nil {\n\t\tt.Fatal(\"zero quantity accepted\")\n\t}\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 3); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 7)\n}\n\nfunc TestOracleReserveConcurrentRepeatsTakeStockOnce(t *testing.T) {\n\t// The gateway retries while the first request is still in flight, so the\n\t// repeats can overlap with the original.\n\tfor round := 0; round < 50; round++ {\n\t\tsvc, _ := oracleSetup(t)\n\t\treserve := oracleReserver(t, svc, true)\n\t\tconst n = 16\n\t\tvar (\n\t\t\twg    sync.WaitGroup\n\t\t\tstart = make(chan struct{})\n\t\t\terrs  = make([]error, n)\n\t\t)\n\t\tfor i := 0; i < n; i++ {\n\t\t\twg.Add(1)\n\t\t\tgo func(i int) {\n\t\t\t\tdefer wg.Done()\n\t\t\t\t<-start\n\t\t\t\terrs[i] = reserve(\"o1\", oracleSKU, 3)\n\t\t\t}(i)\n\t\t}\n\t\tclose(start)\n\t\twg.Wait()\n\t\tok := 0\n\t\tfor _, err := range errs {\n\t\t\tif err == nil {\n\t\t\t\tok++\n\t\t\t}\n\t\t}\n\t\tif ok == 0 {\n\t\t\tt.Fatalf(\"round %d: every concurrent attempt failed: %v\", round, errs[0])\n\t\t}\n\t\tif got := oracleAvailable(t, svc, oracleSKU); got != 7 {\n\t\t\tt.Fatalf(\"round %d: available = %d after %d overlapping repeats, want 7\", round, got, n)\n\t\t}\n\t}\n}\n\nfunc TestOracleReserveRepeatRecognisedAcrossServiceInstances(t *testing.T) {\n\t// The service keeps no state of its own beyond the store, so a retry that\n\t// lands on another instance (or after a restart) must still be recognised.\n\tsvc, mem := oracleSetup(t)\n\tif err := oracleReserve(t, svc, true, \"o1\", oracleSKU, 3); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tother := New(mem, mem)\n\tif err := oracleReserve(t, other, true, \"o1\", oracleSKU, 3); err != nil {\n\t\tt.Fatalf(\"repeat on another instance: %v\", err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 7)\n}\n\n// --- Existing behaviour the change must keep ---\n\nfunc TestOracleReserveReducesAvailable(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tif err := oracleReserve(t, svc, false, \"o1\", oracleSKU, 3); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 7)\n\toracleWantAvailable(t, svc, oracleOtherSKU, 10)\n}\n\nfunc TestOracleReserveDistinctOrdersAccumulate(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tfor i, key := range []domain.OrderID{\"o1\", \"o2\", \"o3\"} {\n\t\tif err := oracleReserve(t, svc, false, key, oracleSKU, 3); err != nil {\n\t\t\tt.Fatalf(\"order %d: %v\", i+1, err)\n\t\t}\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 1)\n\tif err := oracleReserve(t, svc, false, \"o4\", oracleSKU, 2); !errors.Is(err, ErrInsufficientStock) {\n\t\tt.Fatalf(\"got %v, want ErrInsufficientStock\", err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 1)\n}\n\nfunc TestOracleReserveExactlyAllAvailable(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tif err := oracleReserve(t, svc, false, \"o1\", oracleSKU, 10); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 0)\n\tif err := oracleReserve(t, svc, false, \"o2\", oracleSKU, 1); !errors.Is(err, ErrInsufficientStock) {\n\t\tt.Fatalf(\"got %v, want ErrInsufficientStock\", err)\n\t}\n}\n\nfunc TestOracleReserveShortLeavesStockUntouched(t *testing.T) {\n\tsvc, mem := oracleSetup(t)\n\terr := oracleReserve(t, svc, false, \"o1\", oracleSKU, 11)\n\tif !errors.Is(err, ErrInsufficientStock) {\n\t\tt.Fatalf(\"got %v, want ErrInsufficientStock\", err)\n\t}\n\tst, err := mem.GetStock(context.Background(), oracleSKU)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif st.OnHand != 10 || st.Reserved != 0 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 10 and 0\", st.OnHand, st.Reserved)\n\t}\n}\n\nfunc TestOracleReserveRejectsNonPositiveQuantity(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tfor _, q := range []int{0, -1, -5} {\n\t\tif err := oracleReserve(t, svc, false, \"o1\", oracleSKU, q); err == nil {\n\t\t\tt.Fatalf(\"quantity %d accepted\", q)\n\t\t}\n\t\tif errors.Is(oracleReserve(t, svc, false, \"o1\", oracleSKU, q), ErrInsufficientStock) {\n\t\t\tt.Fatalf(\"quantity %d reported as insufficient stock rather than invalid\", q)\n\t\t}\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 10)\n}\n\nfunc TestOracleReserveUnknownSKUIsNotFound(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\terr := oracleReserve(t, svc, false, \"o1\", \"ZZ-0000\", 1)\n\tif !errors.Is(err, store.ErrNotFound) {\n\t\tt.Fatalf(\"got %v, want store.ErrNotFound\", err)\n\t}\n}\n\nfunc TestOracleReleaseReturnsReservedStock(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tctx := context.Background()\n\tif err := oracleReserve(t, svc, false, \"o1\", oracleSKU, 4); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.Release(ctx, oracleSKU, 4); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantAvailable(t, svc, oracleSKU, 10)\n\tif err := oracleReserve(t, svc, false, \"o2\", oracleSKU, 10); err != nil {\n\t\tt.Fatalf(\"released stock not reservable by another order: %v\", err)\n\t}\n}\n\nfunc TestOracleAvailableUnknownSKUIsZero(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tn, err := svc.Available(context.Background(), \"ZZ-0000\")\n\tif err != nil || n != 0 {\n\t\tt.Fatalf(\"got %d, %v; want 0, nil\", n, err)\n\t}\n}\n\nfunc TestOracleReorderReportUnaffectedByReservationKeys(t *testing.T) {\n\tsvc, _ := oracleSetup(t)\n\tif err := oracleReserve(t, svc, false, \"o1\", oracleSKU, 8); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgot, err := svc.ReorderReport(context.Background(), 5)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(got) != 1 || got[0] != oracleSKU {\n\t\tt.Fatalf(\"reorder report = %v, want [%s]\", got, oracleSKU)\n\t}\n}\n"
   },
   "argv": [
