   "files": {
    "internal/orders/oracle_place_retry_test.go": "package orders\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"sync\"\n\t\"testing\"\n\n\t\"example.com/warehouse/internal/audit\"\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/inventory\"\n\t\"example.com/warehouse/internal/notify\"\n\t\"example.com/warehouse/internal/pricing\"\n\t\"example.com/warehouse/internal/shipping\"\n\t\"example.com/warehouse/internal/store\"\n)\n\nconst (\n\toracleSKU      domain.SKU = \"AB-1234\"\n\toracleOtherSKU domain.SKU = \"CD-5678\"\n)\n\n// oracleNewService builds an order service over a store holding twenty units\n// of each of two SKUs.\nfunc oracleNewService(t *testing.T) (*Service, *store.Memory) {\n\tt.Helper()\n\tmem := store.NewMemory()\n\tctx := context.Background()\n\tfor _, sku := range []domain.SKU{oracleSKU, oracleOtherSKU} {\n\t\tif err := mem.PutItem(ctx, domain.Item{\n\t\t\tSKU: sku, Name: \"Widget \" + string(sku), Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(1000, domain.GBP), WeightGram: 500,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 50},\n\t\t}); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif err := mem.PutStock(ctx, store.Stock{SKU: sku, OnHand: 20}); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\treturn oracleServiceOver(mem), mem\n}\n\nfunc oracleServiceOver(mem *store.Memory) *Service {\n\treturn New(mem, mem, inventory.New(mem, mem),\n\t\tpricing.New(mem, 2000),\n\t\tshipping.New(mem, shipping.DefaultZones()...),\n\t\taudit.NewMemoryLog(),\n\t\tnotify.New(notify.NewRecorder()),\n\t)\n}\n\nfunc oracleRequest(id domain.OrderID, lines ...RequestLine) PlaceRequest {\n\treturn PlaceRequest{\n\t\tOrderID: id, CustomerID: \"c-\" + string(id), Currency: domain.GBP, CountryCode: \"GB\",\n\t\tLines: lines,\n\t}\n}\n\nfunc oracleStock(t *testing.T, mem *store.Memory, sku domain.SKU) store.Stock {\n\tt.Helper()\n\tst, err := mem.GetStock(context.Background(), sku)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn st\n}\n\nfunc oracleWantReserved(t *testing.T, mem *store.Memory, sku domain.SKU, want int) {\n\tt.Helper()\n\tif got := oracleStock(t, mem, sku).Reserved; got != want {\n\t\tt.Fatalf(\"reserved %s = %d, want %d\", sku, got, want)\n\t}\n}\n\n// --- Behaviour the change adds ---\n\nfunc TestOraclePlaceRetryReservesOnce(t *testing.T) {\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\treq := oracleRequest(\"o1\", RequestLine{SKU: oracleSKU, Quantity: 2})\n\tfor i := 0; i < 3; i++ {\n\t\torder, _, err := svc.Place(ctx, req)\n\t\tif err != nil {\n\t\t\tt.Fatalf(\"attempt %d: %v\", i+1, err)\n\t\t}\n\t\tif order.ID != \"o1\" || order.State != domain.StateReserved {\n\t\t\tt.Fatalf(\"attempt %d: order %s in state %s, want o1 reserved\", i+1, order.ID, order.State)\n\t\t}\n\t\tif len(order.Lines) != 1 || order.Lines[0].Quantity != 2 {\n\t\t\tt.Fatalf(\"attempt %d: lines = %+v, want one line of 2\", i+1, order.Lines)\n\t\t}\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 2)\n}\n\nfunc TestOraclePlaceRetryDoesNotStarveNextCustomer(t *testing.T) {\n\t// The reported incident: twenty on hand, the first order wants twelve and\n\t// is retried, and the next customer asking for eight is told we are out.\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\tfirst := oracleRequest(\"o1\", RequestLine{SKU: oracleSKU, Quantity: 12})\n\tif _, _, err := svc.Place(ctx, first); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif _, _, err := svc.Place(ctx, first); err != nil {\n\t\tt.Fatalf(\"gateway retry: %v\", err)\n\t}\n\tsecond := oracleRequest(\"o2\", RequestLine{SKU: oracleSKU, Quantity: 8})\n\tif _, _, err := svc.Place(ctx, second); err != nil {\n\t\tt.Fatalf(\"next customer refused: %v\", err)\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif st.Reserved != 20 || st.Available() != 0 {\n\t\tt.Fatalf(\"reserved %d available %d, want 20 and 0\", st.Reserved, st.Available())\n\t}\n}\n\nfunc TestOraclePlaceRetryMultiLineReservesEachLineOnce(t *testing.T) {\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\treq := oracleRequest(\"o1\",\n\t\tRequestLine{SKU: oracleSKU, Quantity: 2},\n\t\tRequestLine{SKU: oracleOtherSKU, Quantity: 5},\n\t)\n\tif _, _, err := svc.Place(ctx, req); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 2)\n\toracleWantReserved(t, mem, oracleOtherSKU, 5)\n\tif _, _, err := svc.Place(ctx, req); err != nil {\n\t\tt.Fatalf(\"retry: %v\", err)\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 2)\n\toracleWantReserved(t, mem, oracleOtherSKU, 5)\n}\n\nfunc TestOraclePlaceRetryWithRepeatedSKULinesKeepsTotal(t *testing.T) {\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\treq := oracleRequest(\"o1\",\n\t\tRequestLine{SKU: oracleSKU, Quantity: 2},\n\t\tRequestLine{SKU: oracleSKU, Quantity: 3},\n\t)\n\tif _, _, err := svc.Place(ctx, req); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 5)\n\tif _, _, err := svc.Place(ctx, req); err != nil {\n\t\tt.Fatalf(\"retry: %v\", err)\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 5)\n}\n\nfunc TestOraclePlaceRetryThenCancelReleasesEverything(t *testing.T) {\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\treq := oracleRequest(\"o1\", RequestLine{SKU: oracleSKU, Quantity: 4})\n\tfor i := 0; i < 2; i++ {\n\t\tif _, _, err := svc.Place(ctx, req); err != nil {\n\t\t\tt.Fatalf(\"attempt %d: %v\", i+1, err)\n\t\t}\n\t}\n\tif err := svc.Cancel(ctx, \"o1\", \"changed mind\"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif st.Reserved != 0 || st.Available() != 20 {\n\t\tt.Fatalf(\"after cancel: reserved %d available %d, want 0 and 20\", st.Reserved, st.Available())\n\t}\n}\n\nfunc TestOraclePlaceRetryThenShipLeavesNothingReserved(t *testing.T) {\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\treq := oracleRequest(\"o1\", RequestLine{SKU: oracleSKU, Quantity: 2})\n\tfor i := 0; i < 2; i++ {\n\t\tif _, _, err := svc.Place(ctx, req); err != nil {\n\t\t\tt.Fatalf(\"attempt %d: %v\", i+1, err)\n\t\t}\n\t}\n\tif err := svc.MarkPaid(ctx, \"o1\"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.Pack(ctx, \"o1\"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.Ship(ctx, \"o1\", \"TRACK123\"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif st.OnHand != 18 || st.Reserved != 0 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 18 and 0\", st.OnHand, st.Reserved)\n\t}\n}\n\nfunc TestOraclePlaceRetryOnAnotherInstanceReservesOnce(t *testing.T) {\n\t// Retries may land on a different replica sharing the same store.\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\treq := oracleRequest(\"o1\", RequestLine{SKU: oracleSKU, Quantity: 3})\n\tif _, _, err := svc.Place(ctx, req); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif _, _, err := oracleServiceOver(mem).Place(ctx, req); err != nil {\n\t\tt.Fatalf(\"retry on another instance: %v\", err)\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 3)\n}\n\nfunc TestOraclePlaceRetryOfShortOrderDoesNotAccumulate(t *testing.T) {\n\t// The first line reserves, the second is short. Retrying must not keep\n\t// piling reservations onto the first line.\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\treq := oracleRequest(\"o1\",\n\t\tRequestLine{SKU: oracleSKU, Quantity: 2},\n\t\tRequestLine{SKU: oracleOtherSKU, Quantity: 99},\n\t)\n\tfor i := 0; i < 3; i++ {\n\t\tif _, _, err := svc.Place(ctx, req); !errors.Is(err, inventory.ErrInsufficientStock) {\n\t\t\tt.Fatalf(\"attempt %d: got %v, want ErrInsufficientStock\", i+1, err)\n\t\t}\n\t}\n\tif got := oracleStock(t, mem, oracleSKU).Reserved; got != 0 && got != 2 {\n\t\tt.Fatalf(\"reserved %s = %d after retried failures, want at most one order's worth\", oracleSKU, got)\n\t}\n\toracleWantReserved(t, mem, oracleOtherSKU, 0)\n}\n\nfunc TestOraclePlaceConcurrentRetriesReserveOnce(t *testing.T) {\n\t// A slow response makes the gateway retry while the original is still\n\t// running, so the attempts overlap.\n\tfor round := 0; round < 30; round++ {\n\t\tsvc, mem := oracleNewService(t)\n\t\treq := oracleRequest(\"o1\", RequestLine{SKU: oracleSKU, Quantity: 2})\n\t\tconst n = 12\n\t\tvar (\n\t\t\twg    sync.WaitGroup\n\t\t\tstart = make(chan struct{})\n\t\t\terrs  = make([]error, n)\n\t\t)\n\t\tfor i := 0; i < n; i++ {\n\t\t\twg.Add(1)\n\t\t\tgo func(i int) {\n\t\t\t\tdefer wg.Done()\n\t\t\t\t<-start\n\t\t\t\t_, _, errs[i] = svc.Place(context.Background(), req)\n\t\t\t}(i)\n\t\t}\n\t\tclose(start)\n\t\twg.Wait()\n\t\tok := 0\n\t\tfor _, err := range errs {\n\t\t\tif err == nil {\n\t\t\t\tok++\n\t\t\t}\n\t\t}\n\t\tif ok == 0 {\n\t\t\tt.Fatalf(\"round %d: every overlapping attempt failed: %v\", round, errs[0])\n\t\t}\n\t\tif got := oracleStock(t, mem, oracleSKU).Reserved; got != 2 {\n\t\t\tt.Fatalf(\"round %d: reserved = %d after %d overlapping attempts, want 2\", round, got, n)\n\t\t}\n\t}\n}\n\n// --- Existing behaviour the change must keep ---\n\nfunc TestOraclePlaceDistinctOrdersEachReserve(t *testing.T) {\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\tfor _, id := range []domain.OrderID{\"o1\", \"o2\", \"o3\"} {\n\t\tif _, _, err := svc.Place(ctx, oracleRequest(id, RequestLine{SKU: oracleSKU, Quantity: 3})); err != nil {\n\t\t\tt.Fatalf(\"%s: %v\", id, err)\n\t\t}\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 9)\n}\n\nfunc TestOraclePlaceSameCustomerDistinctOrdersEachReserve(t *testing.T) {\n\t// Two genuine orders with identical contents are not repeats of each other.\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\ta := oracleRequest(\"o1\", RequestLine{SKU: oracleSKU, Quantity: 3})\n\tb := oracleRequest(\"o2\", RequestLine{SKU: oracleSKU, Quantity: 3})\n\tb.CustomerID = a.CustomerID\n\tfor _, req := range []PlaceRequest{a, b} {\n\t\tif _, _, err := svc.Place(ctx, req); err != nil {\n\t\t\tt.Fatalf(\"%s: %v\", req.OrderID, err)\n\t\t}\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 6)\n}\n\nfunc TestOraclePlaceMultiLineReservesEachSKU(t *testing.T) {\n\tsvc, mem := oracleNewService(t)\n\treq := oracleRequest(\"o1\",\n\t\tRequestLine{SKU: oracleSKU, Quantity: 2},\n\t\tRequestLine{SKU: oracleOtherSKU, Quantity: 5},\n\t)\n\tif _, _, err := svc.Place(context.Background(), req); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 2)\n\toracleWantReserved(t, mem, oracleOtherSKU, 5)\n}\n\nfunc TestOraclePlaceRepeatedSKULinesReserveTheirSum(t *testing.T) {\n\tsvc, mem := oracleNewService(t)\n\treq := oracleRequest(\"o1\",\n\t\tRequestLine{SKU: oracleSKU, Quantity: 2},\n\t\tRequestLine{SKU: oracleSKU, Quantity: 3},\n\t)\n\tif _, _, err := svc.Place(context.Background(), req); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 5)\n}\n\nfunc TestOraclePlaceShortIsInsufficientStockAndNotStored(t *testing.T) {\n\tsvc, _ := oracleNewService(t)\n\tctx := context.Background()\n\treq := oracleRequest(\"o1\", RequestLine{SKU: oracleSKU, Quantity: 21})\n\tif _, _, err := svc.Place(ctx, req); !errors.Is(err, inventory.ErrInsufficientStock) {\n\t\tt.Fatalf(\"got %v, want ErrInsufficientStock\", err)\n\t}\n\tif err := svc.Cancel(ctx, \"o1\", \"never placed\"); !errors.Is(err, store.ErrNotFound) {\n\t\tt.Fatalf(\"cancel of unplaced order: got %v, want store.ErrNotFound\", err)\n\t}\n}\n\nfunc TestOraclePlaceUnknownSKUReservesNothing(t *testing.T) {\n\tsvc, mem := oracleNewService(t)\n\treq := oracleRequest(\"o1\",\n\t\tRequestLine{SKU: oracleSKU, Quantity: 2},\n\t\tRequestLine{SKU: \"ZZ-0000\", Quantity: 1},\n\t)\n\tif _, _, err := svc.Place(context.Background(), req); !errors.Is(err, store.ErrNotFound) {\n\t\tt.Fatalf(\"got %v, want store.ErrNotFound\", err)\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 0)\n}\n\nfunc TestOraclePlaceEmptyOrderRejected(t *testing.T) {\n\tsvc, _ := oracleNewService(t)\n\tif _, _, err := svc.Place(context.Background(), oracleRequest(\"o1\")); !errors.Is(err, ErrEmptyOrder) {\n\t\tt.Fatalf(\"got %v, want ErrEmptyOrder\", err)\n\t}\n}\n\nfunc TestOraclePlaceStoresReservedOrder(t *testing.T) {\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\tif _, _, err := svc.Place(ctx, oracleRequest(\"o1\", RequestLine{SKU: oracleSKU, Quantity: 2})); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgot, err := mem.GetOrder(ctx, \"o1\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif got.State != domain.StateReserved || got.CustomerID != \"c-o1\" || len(got.Lines) != 1 {\n\t\tt.Fatalf(\"stored order = %+v\", got)\n\t}\n}\n\nfunc TestOracleCancelAfterSinglePlaceReleases(t *testing.T) {\n\tsvc, mem := oracleNewService(t)\n\tctx := context.Background()\n\tif _, _, err := svc.Place(ctx, oracleRequest(\"o1\", RequestLine{SKU: oracleSKU, Quantity: 6})); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif _, _, err := svc.Place(ctx, oracleRequest(\"o2\", RequestLine{SKU: oracleSKU, Quantity: 4})); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.Cancel(ctx, \"o1\", \"changed mind\"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleWantReserved(t, mem, oracleSKU, 4)\n}\n"
   },
