  {
   "id": "authored-internal-store",
   "files": {
    "internal/store/oracle_memory_test.go": "package store\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"sync\"\n\t\"testing\"\n\n\t\"example.com/warehouse/internal/domain\"\n)\n\nfunc TestOracleMemoryGetStockMissingIsNotFound(t *testing.T) {\n\tm := NewMemory()\n\tif _, err := m.GetStock(context.Background(), \"ZZ-0000\"); !errors.Is(err, ErrNotFound) {\n\t\tt.Fatalf(\"got %v, want ErrNotFound\", err)\n\t}\n}\n\nfunc TestOracleMemoryPutStockVersions(t *testing.T) {\n\tm := NewMemory()\n\tctx := context.Background()\n\tif err := m.PutStock(ctx, Stock{SKU: \"AB-1234\", OnHand: 10}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tst, err := m.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif st.OnHand != 10 || st.Reserved != 0 || st.Version != 1 {\n\t\tt.Fatalf(\"got %+v, want on hand 10, reserved 0, version 1\", st)\n\t}\n\n\tst.Reserved = 3\n\tif err := m.PutStock(ctx, st); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgot, err := m.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif got.Reserved != 3 || got.Version != 2 {\n\t\tt.Fatalf(\"got %+v, want reserved 3 version 2\", got)\n\t}\n}\n\nfunc TestOracleMemoryPutStockRejectsStaleWrite(t *testing.T) {\n\tm := NewMemory()\n\tctx := context.Background()\n\tif err := m.PutStock(ctx, Stock{SKU: \"AB-1234\", OnHand: 10}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\ta, _ := m.GetStock(ctx, \"AB-1234\")\n\tb, _ := m.GetStock(ctx, \"AB-1234\")\n\ta.Reserved = 4\n\tif err := m.PutStock(ctx, a); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tb.Reserved = 7\n\tif err := m.PutStock(ctx, b); !errors.Is(err, ErrConflict) {\n\t\tt.Fatalf(\"stale write: got %v, want ErrConflict\", err)\n\t}\n\tgot, _ := m.GetStock(ctx, \"AB-1234\")\n\tif got.Reserved != 4 {\n\t\tt.Fatalf(\"reserved = %d after rejected stale write, want 4\", got.Reserved)\n\t}\n}\n\nfunc TestOracleMemoryConcurrentReadModifyWriteLosesNoUpdate(t *testing.T) {\n\tm := NewMemory()\n\tctx := context.Background()\n\tif err := m.PutStock(ctx, Stock{SKU: \"AB-1234\", OnHand: 1000}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tconst n = 64\n\tvar (\n\t\twg    sync.WaitGroup\n\t\tmu    sync.Mutex\n\t\twrote int\n\t\tstart = make(chan struct{})\n\t)\n\tfor i := 0; i < n; i++ {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\t<-start\n\t\t\tst, err := m.GetStock(ctx, \"AB-1234\")\n\t\t\tif err != nil {\n\t\t\t\treturn\n\t\t\t}\n\t\t\tst.Reserved++\n\t\t\tif m.PutStock(ctx, st) == nil {\n\t\t\t\tmu.Lock()\n\t\t\t\twrote++\n\t\t\t\tmu.Unlock()\n\t\t\t}\n\t\t}()\n\t}\n\tclose(start)\n\twg.Wait()\n\tgot, _ := m.GetStock(ctx, \"AB-1234\")\n\tif got.Reserved != wrote {\n\t\tt.Fatalf(\"reserved = %d but %d writes succeeded\", got.Reserved, wrote)\n\t}\n}\n\nfunc TestOracleMemoryListStockSorted(t *testing.T) {\n\tm := NewMemory()\n\tctx := context.Background()\n\tfor _, sku := range []domain.SKU{\"CD-5678\", \"AB-1234\", \"EF-9012\"} {\n\t\tif err := m.PutStock(ctx, Stock{SKU: sku, OnHand: 1}); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\trows, err := m.ListStock(ctx)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\twant := []domain.SKU{\"AB-1234\", \"CD-5678\", \"EF-9012\"}\n\tif len(rows) != len(want) {\n\t\tt.Fatalf(\"got %d rows, want %d\", len(rows), len(want))\n\t}\n\tfor i, r := range rows {\n\t\tif r.SKU != want[i] {\n\t\t\tt.Fatalf(\"row %d = %s, want %s\", i, r.SKU, want[i])\n\t\t}\n\t}\n}\n\nfunc TestOracleMemoryOrdersRoundTrip(t *testing.T) {\n\tm := NewMemory()\n\tctx := context.Background()\n\tif _, err := m.GetOrder(ctx, \"o1\"); !errors.Is(err, ErrNotFound) {\n\t\tt.Fatalf(\"missing order: got %v, want ErrNotFound\", err)\n\t}\n\tfor _, o := range []domain.Order{\n\t\t{ID: \"o2\", State: domain.StateReserved},\n\t\t{ID: \"o1\", State: domain.StateReserved},\n\t\t{ID: \"o3\", State: domain.StateCancelled},\n\t} {\n\t\tif err := m.PutOrder(ctx, o); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\t// Writing the same order again replaces it rather than duplicating it.\n\tif err := m.PutOrder(ctx, domain.Order{ID: \"o1\", State: domain.StateReserved}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgot, err := m.ListOrdersByState(ctx, domain.StateReserved)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(got) != 2 || got[0].ID != \"o1\" || got[1].ID != \"o2\" {\n\t\tt.Fatalf(\"reserved orders = %+v, want o1 then o2\", got)\n\t}\n}\n\nfunc TestOracleStockAvailable(t *testing.T) {\n\tif got := (Stock{OnHand: 10, Reserved: 3}).Available(); got != 7 {\n\t\tt.Fatalf(\"available = %d, want 7\", got)\n\t}\n}\n"
   },
