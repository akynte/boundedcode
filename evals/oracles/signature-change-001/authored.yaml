    "internal/billing/oracle_total_test.go": "package billing\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\n// The tests call Total through reflection so that this file compiles against\n// both the old and the new signature; each test then fails on its own with a\n// clear message instead of the whole package failing to build.\n\nfunc oracleIsInt(k reflect.Kind) bool {\n\tswitch k {\n\tcase reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64:\n\t\treturn true\n\t}\n\treturn false\n}\n\n// oracleTotal calls Total(lines, code) and requires the new signature:\n// func([]Line, <string-kind>) (<int-kind>, <string-kind>).\nfunc oracleTotal(t *testing.T, lines []Line, code string) (int, string) {\n\tt.Helper()\n\tfv := reflect.ValueOf(Total)\n\tft := fv.Type()\n\tif ft.NumIn() != 2 || ft.NumOut() != 2 {\n\t\tt.Fatalf(\"Total has signature %v; want func([]Line, currency) (pence, currency)\", ft)\n\t}\n\tif ft.In(0) != reflect.TypeOf([]Line(nil)) {\n\t\tt.Fatalf(\"Total's first parameter is %v; want []Line\", ft.In(0))\n\t}\n\tif ft.In(1).Kind() != reflect.String {\n\t\tt.Fatalf(\"Total's second parameter is %v; want a string currency code\", ft.In(1))\n\t}\n\tif !oracleIsInt(ft.Out(0).Kind()) {\n\t\tt.Fatalf(\"Total's first result is %v; want an integer number of pence\", ft.Out(0))\n\t}\n\tif ft.Out(1).Kind() != reflect.String {\n\t\tt.Fatalf(\"Total's second result is %v; want a string currency code\", ft.Out(1))\n\t}\n\tout := fv.Call([]reflect.Value{\n\t\treflect.ValueOf(lines),\n\t\treflect.ValueOf(code).Convert(ft.In(1)),\n\t})\n\treturn int(out[0].Int()), out[1].String()\n}\n\n// oracleSum returns the pence total from Total with either the old or the new\n// signature, so existing-behaviour tests pass before and after the change.\nfunc oracleSum(t *testing.T, lines []Line) int {\n\tt.Helper()\n\tfv := reflect.ValueOf(Total)\n\tft := fv.Type()\n\targs := []reflect.Value{reflect.ValueOf(lines)}\n\tswitch ft.NumIn() {\n\tcase 1:\n\tcase 2:\n\t\tif ft.In(1).Kind() != reflect.String {\n\t\t\tt.Fatalf(\"Total's second parameter is %v; want a string currency code\", ft.In(1))\n\t\t}\n\t\targs = append(args, reflect.ValueOf(\"GBP\").Convert(ft.In(1)))\n\tdefault:\n\t\tt.Fatalf(\"Total has unexpected signature %v\", ft)\n\t}\n\tif ft.NumOut() < 1 || !oracleIsInt(ft.Out(0).Kind()) {\n\t\tt.Fatalf(\"Total has unexpected signature %v\", ft)\n\t}\n\treturn int(fv.Call(args)[0].Int())\n}\n\nfunc TestOracleTotalSignature(t *testing.T) {\n\tft := reflect.TypeOf(Total)\n\tif ft.NumIn() != 2 || ft.NumOut() != 2 {\n\t\tt.Fatalf(\"Total has signature %v; want func([]Line, currency) (pence, currency)\", ft)\n\t}\n\tif ft.In(0) != reflect.TypeOf([]Line(nil)) {\n\t\tt.Errorf(\"first parameter is %v; want []Line\", ft.In(0))\n\t}\n\tif ft.In(1).Kind() != reflect.String {\n\t\tt.Errorf(\"second parameter is %v; want a string currency code\", ft.In(1))\n\t}\n\tif !oracleIsInt(ft.Out(0).Kind()) {\n\t\tt.Errorf(\"first result is %v; want integer pence\", ft.Out(0))\n\t}\n\tif ft.Out(1).Kind() != reflect.String {\n\t\tt.Errorf(\"second result is %v; want a string currency code\", ft.Out(1))\n\t}\n}\n\nfunc TestOracleTotalReturnsPenceAndCurrency(t *testing.T) {\n\tlines := []Line{\n\t\t{Description: \"widget\", PenceEach: 100, Quantity: 2},\n\t\t{Description: \"gadget\", PenceEach: 50, Quantity: 1},\n\t}\n\tpence, code := oracleTotal(t, lines, \"GBP\")\n\tif pence != 250 {\n\t\tt.Errorf(\"Total(lines, \\\"GBP\\\") pence = %d; want 250\", pence)\n\t}\n\tif code != \"GBP\" {\n\t\tt.Errorf(\"Total(lines, \\\"GBP\\\") currency = %q; want \\\"GBP\\\"\", code)\n\t}\n}\n\nfunc TestOracleTotalEchoesGivenCurrency(t *testing.T) {\n\tlines := []Line{{PenceEach: 199, Quantity: 3}, {PenceEach: 1, Quantity: 7}}\n\tfor _, want := range []string{\"GBP\", \"EUR\", \"USD\", \"JPY\", \"CHF\"} {\n\t\tpence, got := oracleTotal(t, lines, want)\n\t\tif got != want {\n\t\t\tt.Errorf(\"Total(lines, %q) currency = %q; want %q\", want, got, want)\n\t\t}\n\t\tif pence != 604 {\n\t\t\tt.Errorf(\"Total(lines, %q) pence = %d; want 604 (amount must not depend on currency)\", want, pence)\n\t\t}\n\t}\n}\n\nfunc TestOracleTotalAmountIndependentOfCurrency(t *testing.T) {\n\tlines := []Line{{PenceEach: 12345, Quantity: 4}, {PenceEach: 55, Quantity: 10}}\n\tbase, _ := oracleTotal(t, lines, \"GBP\")\n\tfor _, code := range []string{\"EUR\", \"USD\", \"JPY\"} {\n\t\tif got, _ := oracleTotal(t, lines, code); got != base {\n\t\t\tt.Errorf(\"Total(lines, %q) = %d; Total(lines, \\\"GBP\\\") = %d; want equal\", code, got, base)\n\t\t}\n\t}\n}\n\nfunc TestOracleTotalEmptyLinesKeepsCurrency(t *testing.T) {\n\tfor _, lines := range [][]Line{nil, {}} {\n\t\tpence, code := oracleTotal(t, lines, \"EUR\")\n\t\tif pence != 0 {\n\t\t\tt.Errorf(\"Total(%#v, \\\"EUR\\\") pence = %d; want 0\", lines, pence)\n\t\t}\n\t\tif code != \"EUR\" {\n\t\t\tt.Errorf(\"Total(%#v, \\\"EUR\\\") currency = %q; want \\\"EUR\\\"\", lines, code)\n\t\t}\n\t}\n}\n\nfunc TestOracleTotalDoesNotMutateLines(t *testing.T) {\n\tlines := []Line{{Description: \"a\", PenceEach: 10, Quantity: 3}, {Description: \"b\", PenceEach: 7, Quantity: 2}}\n\twant := append([]Line(nil), lines...)\n\toracleTotal(t, lines, \"USD\")\n\tif !reflect.DeepEqual(lines, want) {\n\t\tt.Errorf(\"Total modified its input: got %#v; want %#v\", lines, want)\n\t}\n}\n\n// Existing behaviour: the pence arithmetic must be unchanged.\n\nfunc TestOracleTotalSumsPenceTimesQuantity(t *testing.T) {\n\tcases := []struct {\n\t\tname  string\n\t\tlines []Line\n\t\twant  int\n\t}{\n\t\t{\"nil\", nil, 0},\n\t\t{\"empty\", []Line{}, 0},\n\t\t{\"single\", []Line{{PenceEach: 999, Quantity: 1}}, 999},\n\t\t{\"quantity multiplies\", []Line{{PenceEach: 25, Quantity: 4}}, 100},\n\t\t{\"zero quantity\", []Line{{PenceEach: 500, Quantity: 0}, {PenceEach: 3, Quantity: 3}}, 9},\n\t\t{\"zero price\", []Line{{PenceEach: 0, Quantity: 10}}, 0},\n\t\t{\"several\", []Line{{PenceEach: 100, Quantity: 2}, {PenceEach: 50, Quantity: 1}, {PenceEach: 1, Quantity: 1}}, 251},\n\t\t{\"credit line\", []Line{{PenceEach: 1000, Quantity: 1}, {PenceEach: -250, Quantity: 2}}, 500},\n\t\t{\"large\", []Line{{PenceEach: 1_000_000, Quantity: 1_000}}, 1_000_000_000},\n\t}\n\tfor _, c := range cases {\n\t\tt.Run(c.name, func(t *testing.T) {\n\t\t\tif got := oracleSum(t, c.lines); got != c.want {\n\t\t\t\tt.Errorf(\"total = %d; want %d\", got, c.want)\n\t\t\t}\n\t\t})\n\t}\n}\n"
   },
