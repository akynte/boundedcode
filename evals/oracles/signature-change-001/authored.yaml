    "internal/report/oracle_monthly_test.go": "package report\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n\n\t\"example.com/billing/internal/billing\"\n)\n\n// oracleMonthly calls Monthly through reflection so the test works whether or\n// not the caller update gave Monthly a currency parameter. It returns the\n// integer pence sum, which must be Monthly's first result.\nfunc oracleMonthly(t *testing.T, invoices [][]billing.Line, code string) int64 {\n\tt.Helper()\n\tfv := reflect.ValueOf(Monthly)\n\tft := fv.Type()\n\tif ft.NumIn() < 1 || ft.In(0) != reflect.TypeOf([][]billing.Line(nil)) {\n\t\tt.Fatalf(\"Monthly has signature %v; want first parameter [][]billing.Line\", ft)\n\t}\n\targs := []reflect.Value{reflect.ValueOf(invoices)}\n\tswitch ft.NumIn() {\n\tcase 1:\n\tcase 2:\n\t\tif ft.In(1).Kind() != reflect.String {\n\t\t\tt.Fatalf(\"Monthly's second parameter is %v; want a string currency code\", ft.In(1))\n\t\t}\n\t\targs = append(args, reflect.ValueOf(code).Convert(ft.In(1)))\n\tdefault:\n\t\tt.Fatalf(\"Monthly has unexpected signature %v\", ft)\n\t}\n\tif ft.NumOut() < 1 {\n\t\tt.Fatalf(\"Monthly has signature %v; want it to return a pence sum\", ft)\n\t}\n\tswitch ft.Out(0).Kind() {\n\tcase reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64:\n\tdefault:\n\t\tt.Fatalf(\"Monthly's first result is %v; want integer pence\", ft.Out(0))\n\t}\n\tout := fv.Call(args)\n\tfor _, extra := range out[1:] {\n\t\tif err, ok := extra.Interface().(error); ok && err != nil {\n\t\t\tt.Fatalf(\"Monthly returned error: %v\", err)\n\t\t}\n\t}\n\treturn out[0].Int()\n}\n\nfunc TestOracleMonthlySumsInvoiceTotals(t *testing.T) {\n\tinvoices := [][]billing.Line{\n\t\t{{PenceEach: 100, Quantity: 2}, {PenceEach: 50, Quantity: 1}},\n\t\t{{PenceEach: 1999, Quantity: 1}},\n\t\t{},\n\t\t{{PenceEach: 5, Quantity: 10}, {PenceEach: -20, Quantity: 1}},\n\t}\n\tif got := oracleMonthly(t, invoices, \"GBP\"); got != 250+1999+0+30 {\n\t\tt.Errorf(\"Monthly = %d; want %d\", got, 250+1999+0+30)\n\t}\n}\n\nfunc TestOracleMonthlyNoInvoices(t *testing.T) {\n\tfor _, inv := range [][][]billing.Line{nil, {}} {\n\t\tif got := oracleMonthly(t, inv, \"GBP\"); got != 0 {\n\t\t\tt.Errorf(\"Monthly(%#v) = %d; want 0\", inv, got)\n\t\t}\n\t}\n}\n\nfunc TestOracleMonthlySingleInvoiceMatchesTotal(t *testing.T) {\n\tinvoices := [][]billing.Line{{{PenceEach: 42, Quantity: 3}}}\n\tif got := oracleMonthly(t, invoices, \"EUR\"); got != 126 {\n\t\tt.Errorf(\"Monthly = %d; want 126\", got)\n\t}\n}\n"
   },
