    "internal/api/oracle_invoice_test.go": "package api\n\nimport (\n\t\"encoding/json\"\n\t\"reflect\"\n\t\"testing\"\n\n\t\"example.com/billing/internal/billing\"\n)\n\n// oracleBuild calls Build through reflection so the test works whether or not\n// the caller update gave Build a currency parameter. It returns the response\n// value and its JSON encoding.\nfunc oracleBuild(t *testing.T, lines []billing.Line, code string) (reflect.Value, map[string]any) {\n\tt.Helper()\n\tfv := reflect.ValueOf(Build)\n\tft := fv.Type()\n\tif ft.NumIn() < 1 || ft.In(0) != reflect.TypeOf([]billing.Line(nil)) {\n\t\tt.Fatalf(\"Build has signature %v; want first parameter []billing.Line\", ft)\n\t}\n\targs := []reflect.Value{reflect.ValueOf(lines)}\n\tswitch ft.NumIn() {\n\tcase 1:\n\tcase 2:\n\t\tif ft.In(1).Kind() != reflect.String {\n\t\t\tt.Fatalf(\"Build's second parameter is %v; want a string currency code\", ft.In(1))\n\t\t}\n\t\targs = append(args, reflect.ValueOf(code).Convert(ft.In(1)))\n\tdefault:\n\t\tt.Fatalf(\"Build has unexpected signature %v\", ft)\n\t}\n\tif ft.NumOut() < 1 {\n\t\tt.Fatalf(\"Build has signature %v; want it to return a response\", ft)\n\t}\n\tout := fv.Call(args)\n\tfor _, extra := range out[1:] {\n\t\tif err, ok := extra.Interface().(error); ok && err != nil {\n\t\t\tt.Fatalf(\"Build returned error: %v\", err)\n\t\t}\n\t}\n\tresp := out[0]\n\tfor resp.Kind() == reflect.Pointer {\n\t\tif resp.IsNil() {\n\t\t\tt.Fatalf(\"Build returned nil response\")\n\t\t}\n\t\tresp = resp.Elem()\n\t}\n\tif resp.Kind() != reflect.Struct {\n\t\tt.Fatalf(\"Build returned %v; want a struct response\", resp.Type())\n\t}\n\traw, err := json.Marshal(resp.Interface())\n\tif err != nil {\n\t\tt.Fatalf(\"marshal response: %v\", err)\n\t}\n\tvar m map[string]any\n\tif err := json.Unmarshal(raw, &m); err != nil {\n\t\tt.Fatalf(\"unmarshal response %s: %v\", raw, err)\n\t}\n\treturn resp, m\n}\n\nfunc TestOracleBuildTotalPence(t *testing.T) {\n\tlines := []billing.Line{\n\t\t{Description: \"widget\", PenceEach: 100, Quantity: 2},\n\t\t{Description: \"gadget\", PenceEach: 50, Quantity: 1},\n\t}\n\tresp, m := oracleBuild(t, lines, \"GBP\")\n\tf := resp.FieldByName(\"TotalPence\")\n\tif !f.IsValid() {\n\t\tt.Fatalf(\"response %v has no TotalPence field\", resp.Type())\n\t}\n\tif got := f.Int(); got != 250 {\n\t\tt.Errorf(\"TotalPence = %d; want 250\", got)\n\t}\n\tv, ok := m[\"total_pence\"]\n\tif !ok {\n\t\tt.Fatalf(\"JSON response %v has no \\\"total_pence\\\" key\", m)\n\t}\n\tif n, ok := v.(float64); !ok || n != 250 {\n\t\tt.Errorf(\"JSON total_pence = %v; want 250\", v)\n\t}\n}\n\nfunc TestOracleBuildEmpty(t *testing.T) {\n\tresp, m := oracleBuild(t, nil, \"GBP\")\n\tif got := resp.FieldByName(\"TotalPence\"); !got.IsValid() || got.Int() != 0 {\n\t\tt.Errorf(\"TotalPence for no lines = %v; want 0\", got)\n\t}\n\tif v := m[\"total_pence\"]; v != float64(0) {\n\t\tt.Errorf(\"JSON total_pence for no lines = %v; want 0\", v)\n\t}\n}\n\nfunc TestOracleBuildTotalIndependentOfCurrency(t *testing.T) {\n\tlines := []billing.Line{{PenceEach: 333, Quantity: 3}, {PenceEach: -9, Quantity: 1}}\n\tfor _, code := range []string{\"GBP\", \"EUR\", \"USD\"} {\n\t\tresp, m := oracleBuild(t, lines, code)\n\t\tif got := resp.FieldByName(\"TotalPence\"); !got.IsValid() || got.Int() != 990 {\n\t\t\tt.Errorf(\"currency %s: TotalPence = %v; want 990\", code, got)\n\t\t}\n\t\tif v := m[\"total_pence\"]; v != float64(990) {\n\t\t\tt.Errorf(\"currency %s: JSON total_pence = %v; want 990\", code, v)\n\t\t}\n\t}\n}\n"
   },
   "argv": [
