    "internal/store/oracle_damaged_test.go": "package store\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"reflect\"\n\t\"testing\"\n)\n\n// The Damaged field is reached through reflection so that this file compiles\n// before the field exists; tests of existing behaviour can then still run.\n\nfunc oracleDamaged(t *testing.T, st Stock) int {\n\tt.Helper()\n\tf := reflect.ValueOf(st).FieldByName(\"Damaged\")\n\tif !f.IsValid() {\n\t\tt.Fatalf(\"store.Stock has no Damaged field\")\n\t}\n\tswitch f.Kind() {\n\tcase reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64:\n\t\treturn int(f.Int())\n\t}\n\tt.Fatalf(\"store.Stock.Damaged has kind %s, want an integer\", f.Kind())\n\treturn 0\n}\n\nfunc oracleWithDamaged(t *testing.T, st Stock, n int) Stock {\n\tt.Helper()\n\tf := reflect.ValueOf(&st).Elem().FieldByName(\"Damaged\")\n\tif !f.IsValid() {\n\t\tt.Fatalf(\"store.Stock has no Damaged field\")\n\t}\n\tswitch f.Kind() {\n\tcase reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64:\n\t\tf.SetInt(int64(n))\n\tdefault:\n\t\tt.Fatalf(\"store.Stock.Damaged has kind %s, want an integer\", f.Kind())\n\t}\n\treturn st\n}\n\nfunc TestOracleAvailableExcludesDamaged(t *testing.T) {\n\tcases := []struct {\n\t\tonHand, reserved, damaged, want int\n\t}{\n\t\t{10, 0, 0, 10},\n\t\t{10, 0, 3, 7},\n\t\t{10, 4, 3, 3},\n\t\t{10, 4, 6, 0},\n\t\t{5, 0, 5, 0},\n\t}\n\tfor _, c := range cases {\n\t\tst := oracleWithDamaged(t, Stock{SKU: \"AB-1234\", OnHand: c.onHand, Reserved: c.reserved}, c.damaged)\n\t\tif got := st.Available(); got != c.want {\n\t\t\tt.Errorf(\"on hand %d reserved %d damaged %d: Available() = %d, want %d\",\n\t\t\t\tc.onHand, c.reserved, c.damaged, got, c.want)\n\t\t}\n\t\tif st.OnHand != c.onHand {\n\t\t\tt.Errorf(\"OnHand changed to %d, want %d\", st.OnHand, c.onHand)\n\t\t}\n\t}\n}\n\nfunc TestOracleMemoryRoundTripsDamaged(t *testing.T) {\n\tctx := context.Background()\n\tmem := NewMemory()\n\tst := oracleWithDamaged(t, Stock{SKU: \"AB-1234\", OnHand: 10, Reserved: 2}, 3)\n\tif err := mem.PutStock(ctx, st); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgot, err := mem.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif d := oracleDamaged(t, got); d != 3 {\n\t\tt.Fatalf(\"damaged = %d after round trip, want 3\", d)\n\t}\n\tif got.OnHand != 10 || got.Reserved != 2 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 10 and 2\", got.OnHand, got.Reserved)\n\t}\n\tif got.Available() != 5 {\n\t\tt.Fatalf(\"available = %d, want 5\", got.Available())\n\t}\n\n\trows, err := mem.ListStock(ctx)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(rows) != 1 {\n\t\tt.Fatalf(\"ListStock returned %d rows, want 1\", len(rows))\n\t}\n\tif d := oracleDamaged(t, rows[0]); d != 3 {\n\t\tt.Fatalf(\"ListStock damaged = %d, want 3\", d)\n\t}\n\n\t// An update carrying the current version keeps the new damaged figure.\n\tgot = oracleWithDamaged(t, got, 1)\n\tif err := mem.PutStock(ctx, got); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tagain, err := mem.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif d := oracleDamaged(t, again); d != 1 {\n\t\tt.Fatalf(\"damaged = %d after update, want 1\", d)\n\t}\n}\n\nfunc TestOracleAvailableWithoutDamage(t *testing.T) {\n\tst := Stock{SKU: \"AB-1234\", OnHand: 10, Reserved: 4}\n\tif got := st.Available(); got != 6 {\n\t\tt.Fatalf(\"Available() = %d, want 6\", got)\n\t}\n}\n\nfunc TestOracleMemoryVersionConflict(t *testing.T) {\n\tctx := context.Background()\n\tmem := NewMemory()\n\tif err := mem.PutStock(ctx, Stock{SKU: \"AB-1234\", OnHand: 10}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tstale, err := mem.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tfresh := stale\n\tfresh.Reserved = 1\n\tif err := mem.PutStock(ctx, fresh); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tstale.Reserved = 5\n\tif err := mem.PutStock(ctx, stale); !errors.Is(err, ErrConflict) {\n\t\tt.Fatalf(\"stale write: got %v, want ErrConflict\", err)\n\t}\n\tgot, err := mem.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif got.Reserved != 1 || got.OnHand != 10 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 10 and 1\", got.OnHand, got.Reserved)\n\t}\n}\n\nfunc TestOracleMemoryGetStockMissing(t *testing.T) {\n\tmem := NewMemory()\n\tif _, err := mem.GetStock(context.Background(), \"ZZ-9999\"); !errors.Is(err, ErrNotFound) {\n\t\tt.Fatalf(\"got %v, want ErrNotFound\", err)\n\t}\n}\n"
