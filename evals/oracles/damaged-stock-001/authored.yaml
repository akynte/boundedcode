   "files": {
    "internal/inventory/oracle_damaged_test.go": "package inventory\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"reflect\"\n\t\"testing\"\n\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/store\"\n)\n\n// The new Damaged field and SetDamaged method are reached through reflection\n// so that this file compiles before they exist; tests of existing behaviour\n// can then still run.\n\nconst oracleSKU domain.SKU = \"AB-1234\"\n\nfunc oracleDamaged(t *testing.T, st store.Stock) int {\n\tt.Helper()\n\tf := reflect.ValueOf(st).FieldByName(\"Damaged\")\n\tif !f.IsValid() {\n\t\tt.Fatalf(\"store.Stock has no Damaged field\")\n\t}\n\tswitch f.Kind() {\n\tcase reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64:\n\t\treturn int(f.Int())\n\t}\n\tt.Fatalf(\"store.Stock.Damaged has kind %s, want an integer\", f.Kind())\n\treturn 0\n}\n\n// oracleSetDamaged calls (*Service).SetDamaged(ctx, sku, count) error.\nfunc oracleSetDamaged(t *testing.T, svc *Service, ctx context.Context, sku domain.SKU, n int) error {\n\tt.Helper()\n\tm := reflect.ValueOf(svc).MethodByName(\"SetDamaged\")\n\tif !m.IsValid() {\n\t\tt.Fatalf(\"inventory.Service has no SetDamaged method\")\n\t}\n\tmt := m.Type()\n\tif mt.NumIn() != 3 || mt.NumOut() != 1 {\n\t\tt.Fatalf(\"SetDamaged has signature %s, want func(context.Context, domain.SKU, int) error\", mt)\n\t}\n\terrType := reflect.TypeOf((*error)(nil)).Elem()\n\tif !mt.Out(0).Implements(errType) {\n\t\tt.Fatalf(\"SetDamaged returns %s, want error\", mt.Out(0))\n\t}\n\tskuV := reflect.ValueOf(sku)\n\tif !skuV.Type().ConvertibleTo(mt.In(1)) {\n\t\tt.Fatalf(\"SetDamaged second parameter is %s, want domain.SKU\", mt.In(1))\n\t}\n\tnV := reflect.ValueOf(n)\n\tif !nV.Type().ConvertibleTo(mt.In(2)) {\n\t\tt.Fatalf(\"SetDamaged third parameter is %s, want int\", mt.In(2))\n\t}\n\tout := m.Call([]reflect.Value{reflect.ValueOf(ctx), skuV.Convert(mt.In(1)), nV.Convert(mt.In(2))})\n\tif out[0].IsNil() {\n\t\treturn nil\n\t}\n\treturn out[0].Interface().(error)\n}\n\nfunc oracleSetup(t *testing.T, onHand int) (*Service, *store.Memory) {\n\tt.Helper()\n\tmem := store.NewMemory()\n\tctx := context.Background()\n\tfor _, item := range []domain.Item{\n\t\t{SKU: oracleSKU, Name: \"Widget\", Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(500, domain.GBP), WeightGram: 250},\n\t\t{SKU: \"CD-5678\", Name: \"Gadget\", Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(700, domain.GBP), WeightGram: 300},\n\t\t{SKU: \"EF-9012\", Name: \"Old thing\", Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(900, domain.GBP), WeightGram: 300, Discontinued: true},\n\t} {\n\t\tif err := mem.PutItem(ctx, item); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tif err := mem.PutStock(ctx, store.Stock{SKU: oracleSKU, OnHand: onHand}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn New(mem, mem), mem\n}\n\nfunc oracleStock(t *testing.T, mem *store.Memory, sku domain.SKU) store.Stock {\n\tt.Helper()\n\tst, err := mem.GetStock(context.Background(), sku)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn st\n}\n\nfunc oracleAvailable(t *testing.T, svc *Service, sku domain.SKU) int {\n\tt.Helper()\n\tn, err := svc.Available(context.Background(), sku)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn n\n}\n\n// --- new behaviour ---\n\nfunc TestOracleSetDamagedRecordsCountAndKeepsOnHand(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := svc.Reserve(ctx, oracleSKU, 2); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 3); err != nil {\n\t\tt.Fatalf(\"SetDamaged: %v\", err)\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif d := oracleDamaged(t, st); d != 3 {\n\t\tt.Fatalf(\"damaged = %d, want 3\", d)\n\t}\n\tif st.OnHand != 10 {\n\t\tt.Fatalf(\"on hand = %d, want 10: damaged units are still on the premises\", st.OnHand)\n\t}\n\tif st.Reserved != 2 {\n\t\tt.Fatalf(\"reserved = %d, want 2\", st.Reserved)\n\t}\n\tif got := oracleAvailable(t, svc, oracleSKU); got != 5 {\n\t\tt.Fatalf(\"available = %d, want 5 (10 on hand - 2 reserved - 3 damaged)\", got)\n\t}\n}\n\nfunc TestOracleSetDamagedWritesAbsoluteCount(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 3); err != nil {\n\t\tt.Fatalf(\"SetDamaged(3): %v\", err)\n\t}\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 1); err != nil {\n\t\tt.Fatalf(\"SetDamaged(1): %v\", err)\n\t}\n\tif d := oracleDamaged(t, oracleStock(t, mem, oracleSKU)); d != 1 {\n\t\tt.Fatalf(\"damaged = %d after setting 3 then 1, want 1\", d)\n\t}\n\tif got := oracleAvailable(t, svc, oracleSKU); got != 9 {\n\t\tt.Fatalf(\"available = %d, want 9\", got)\n\t}\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 0); err != nil {\n\t\tt.Fatalf(\"SetDamaged(0): %v\", err)\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif d := oracleDamaged(t, st); d != 0 {\n\t\tt.Fatalf(\"damaged = %d after clearing, want 0\", d)\n\t}\n\tif st.OnHand != 10 {\n\t\tt.Fatalf(\"on hand = %d, want 10\", st.OnHand)\n\t}\n\tif got := oracleAvailable(t, svc, oracleSKU); got != 10 {\n\t\tt.Fatalf(\"available = %d after clearing damage, want 10\", got)\n\t}\n}\n\nfunc TestOracleSetDamagedRejectsNegative(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 2); err != nil {\n\t\tt.Fatalf(\"SetDamaged(2): %v\", err)\n\t}\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, -1); err == nil {\n\t\tt.Fatal(\"SetDamaged(-1) succeeded, want an error\")\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif d := oracleDamaged(t, st); d != 2 {\n\t\tt.Fatalf(\"damaged = %d after rejected write, want 2\", d)\n\t}\n\tif st.OnHand != 10 || st.Reserved != 0 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 10 and 0\", st.OnHand, st.Reserved)\n\t}\n}\n\nfunc TestOracleSetDamagedRejectsMoreThanOnHand(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 11); err == nil {\n\t\tt.Fatal(\"SetDamaged(11) with 10 on hand succeeded, want an error\")\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif d := oracleDamaged(t, st); d != 0 {\n\t\tt.Fatalf(\"damaged = %d after rejected write, want 0\", d)\n\t}\n\tif st.OnHand != 10 {\n\t\tt.Fatalf(\"on hand = %d, want 10\", st.OnHand)\n\t}\n\tif got := oracleAvailable(t, svc, oracleSKU); got != 10 {\n\t\tt.Fatalf(\"available = %d, want 10\", got)\n\t}\n\t// Every unit on hand may be damaged.\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 10); err != nil {\n\t\tt.Fatalf(\"SetDamaged(10) with 10 on hand: %v\", err)\n\t}\n\tif got := oracleAvailable(t, svc, oracleSKU); got != 0 {\n\t\tt.Fatalf(\"available = %d with everything damaged, want 0\", got)\n\t}\n}\n\nfunc TestOracleSetDamagedUnknownSKU(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := oracleSetDamaged(t, svc, ctx, \"ZZ-9999\", 1); err == nil {\n\t\tt.Fatal(\"SetDamaged on a SKU with no stock succeeded, want an error\")\n\t}\n\tif st, err := mem.GetStock(ctx, \"ZZ-9999\"); err == nil && oracleDamaged(t, st) > st.OnHand {\n\t\tt.Fatalf(\"stock row created with damaged %d > on hand %d\", oracleDamaged(t, st), st.OnHand)\n\t}\n}\n\n// Damage recorded against units already promised to orders must never leave\n// the service promising more: either the write is refused, or it is accepted\n// and nothing further can be reserved.\nfunc TestOracleSetDamagedOverlappingReservations(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := svc.Reserve(ctx, oracleSKU, 5); err != nil {\n\t\tt.Fatal(err)\n\t}\n\terr := oracleSetDamaged(t, svc, ctx, oracleSKU, 8)\n\tst := oracleStock(t, mem, oracleSKU)\n\tif st.OnHand != 10 || st.Reserved != 5 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 10 and 5\", st.OnHand, st.Reserved)\n\t}\n\tif err != nil {\n\t\tif d := oracleDamaged(t, st); d != 0 {\n\t\t\tt.Fatalf(\"SetDamaged failed (%v) but damaged = %d, want 0\", err, d)\n\t\t}\n\t\tif got := oracleAvailable(t, svc, oracleSKU); got != 5 {\n\t\t\tt.Fatalf(\"available = %d, want 5\", got)\n\t\t}\n\t\treturn\n\t}\n\tif d := oracleDamaged(t, st); d != 8 {\n\t\tt.Fatalf(\"damaged = %d, want 8\", d)\n\t}\n\tif got := oracleAvailable(t, svc, oracleSKU); got > 0 {\n\t\tt.Fatalf(\"available = %d with 5 reserved and 8 of 10 damaged, want none\", got)\n\t}\n\tif err := svc.Reserve(ctx, oracleSKU, 1); !errors.Is(err, ErrInsufficientStock) {\n\t\tt.Fatalf(\"Reserve(1): got %v, want ErrInsufficientStock\", err)\n\t}\n}\n\nfunc TestOracleReserveIgnoresDamagedUnits(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 4); err != nil {\n\t\tt.Fatalf(\"SetDamaged: %v\", err)\n\t}\n\tif err := svc.Reserve(ctx, oracleSKU, 7); !errors.Is(err, ErrInsufficientStock) {\n\t\tt.Fatalf(\"Reserve(7) with 6 sellable: got %v, want ErrInsufficientStock\", err)\n\t}\n\tif st := oracleStock(t, mem, oracleSKU); st.Reserved != 0 {\n\t\tt.Fatalf(\"reserved = %d after refused reservation, want 0\", st.Reserved)\n\t}\n\tif err := svc.Reserve(ctx, oracleSKU, 6); err != nil {\n\t\tt.Fatalf(\"Reserve(6) with 6 sellable: %v\", err)\n\t}\n\tif got := oracleAvailable(t, svc, oracleSKU); got != 0 {\n\t\tt.Fatalf(\"available = %d, want 0\", got)\n\t}\n\tif err := svc.Reserve(ctx, oracleSKU, 1); !errors.Is(err, ErrInsufficientStock) {\n\t\tt.Fatalf(\"Reserve(1) with nothing sellable: got %v, want ErrInsufficientStock\", err)\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif st.OnHand != 10 || st.Reserved != 6 || oracleDamaged(t, st) != 4 {\n\t\tt.Fatalf(\"on hand %d reserved %d damaged %d, want 10, 6, 4\",\n\t\t\tst.OnHand, st.Reserved, oracleDamaged(t, st))\n\t}\n}\n\nfunc TestOracleReleaseKeepsDamaged(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 2); err != nil {\n\t\tt.Fatalf(\"SetDamaged: %v\", err)\n\t}\n\tif err := svc.Reserve(ctx, oracleSKU, 3); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.Release(ctx, oracleSKU, 3); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif st.OnHand != 10 || st.Reserved != 0 || oracleDamaged(t, st) != 2 {\n\t\tt.Fatalf(\"on hand %d reserved %d damaged %d, want 10, 0, 2\",\n\t\t\tst.OnHand, st.Reserved, oracleDamaged(t, st))\n\t}\n\tif got := oracleAvailable(t, svc, oracleSKU); got != 8 {\n\t\tt.Fatalf(\"available = %d, want 8\", got)\n\t}\n}\n\nfunc TestOracleConsumeKeepsDamaged(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 2); err != nil {\n\t\tt.Fatalf(\"SetDamaged: %v\", err)\n\t}\n\tif err := svc.Reserve(ctx, oracleSKU, 3); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.Consume(ctx, oracleSKU, 3); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif st.OnHand != 7 || st.Reserved != 0 || oracleDamaged(t, st) != 2 {\n\t\tt.Fatalf(\"on hand %d reserved %d damaged %d, want 7, 0, 2\",\n\t\t\tst.OnHand, st.Reserved, oracleDamaged(t, st))\n\t}\n\tif got := oracleAvailable(t, svc, oracleSKU); got != 5 {\n\t\tt.Fatalf(\"available = %d, want 5\", got)\n\t}\n}\n\nfunc TestOracleReceiveKeepsDamaged(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 4); err != nil {\n\t\tt.Fatalf(\"SetDamaged: %v\", err)\n\t}\n\tif err := svc.Receive(ctx, oracleSKU, 5); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif st.OnHand != 15 || oracleDamaged(t, st) != 4 {\n\t\tt.Fatalf(\"on hand %d damaged %d, want 15 and 4\", st.OnHand, oracleDamaged(t, st))\n\t}\n\tif got := oracleAvailable(t, svc, oracleSKU); got != 11 {\n\t\tt.Fatalf(\"available = %d, want 11\", got)\n\t}\n}\n\nfunc TestOracleReorderReportCountsDamagedAsUnavailable(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := mem.PutStock(ctx, store.Stock{SKU: \"CD-5678\", OnHand: 10}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := oracleSetDamaged(t, svc, ctx, oracleSKU, 8); err != nil {\n\t\tt.Fatalf(\"SetDamaged: %v\", err)\n\t}\n\tgot, err := svc.ReorderReport(ctx, 5)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(got) != 1 || got[0] != oracleSKU {\n\t\tt.Fatalf(\"reorder report = %v, want [%s]: 8 of 10 are damaged\", got, oracleSKU)\n\t}\n}\n\n// --- existing behaviour ---\n\nfunc TestOracleAvailableUnknownSKUIsZero(t *testing.T) {\n\tsvc, _ := oracleSetup(t, 10)\n\tif got := oracleAvailable(t, svc, \"ZZ-9999\"); got != 0 {\n\t\tt.Fatalf(\"available = %d, want 0\", got)\n\t}\n}\n\nfunc TestOracleAvailableNetOfReservations(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := svc.Reserve(ctx, oracleSKU, 4); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif got := oracleAvailable(t, svc, oracleSKU); got != 6 {\n\t\tt.Fatalf(\"available = %d, want 6\", got)\n\t}\n\tif err := svc.Reserve(ctx, oracleSKU, 6); err != nil {\n\t\tt.Fatalf(\"Reserve(6) with 6 available: %v\", err)\n\t}\n\tif err := svc.Reserve(ctx, oracleSKU, 1); !errors.Is(err, ErrInsufficientStock) {\n\t\tt.Fatalf(\"got %v, want ErrInsufficientStock\", err)\n\t}\n\tif st := oracleStock(t, mem, oracleSKU); st.OnHand != 10 || st.Reserved != 10 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 10 and 10\", st.OnHand, st.Reserved)\n\t}\n}\n\nfunc TestOracleReserveRejectsNonPositive(t *testing.T) {\n\tsvc, _ := oracleSetup(t, 10)\n\tfor _, q := range []int{0, -1} {\n\t\tif err := svc.Reserve(context.Background(), oracleSKU, q); err == nil {\n\t\t\tt.Fatalf(\"Reserve(%d) succeeded, want an error\", q)\n\t\t}\n\t}\n}\n\nfunc TestOracleReserveUnknownSKUIsNotFound(t *testing.T) {\n\tsvc, _ := oracleSetup(t, 10)\n\tif err := svc.Reserve(context.Background(), \"ZZ-9999\", 1); !errors.Is(err, store.ErrNotFound) {\n\t\tt.Fatalf(\"got %v, want store.ErrNotFound\", err)\n\t}\n}\n\nfunc TestOracleReleaseClampsAtZero(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := svc.Reserve(ctx, oracleSKU, 2); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.Release(ctx, oracleSKU, 5); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tst := oracleStock(t, mem, oracleSKU)\n\tif st.Reserved != 0 || st.OnHand != 10 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 10 and 0\", st.OnHand, st.Reserved)\n\t}\n}\n\nfunc TestOracleReceiveCreatesAndAddsStock(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tif err := svc.Receive(ctx, \"CD-5678\", 4); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.Receive(ctx, oracleSKU, 5); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif st := oracleStock(t, mem, \"CD-5678\"); st.OnHand != 4 || st.Reserved != 0 {\n\t\tt.Fatalf(\"new row on hand %d reserved %d, want 4 and 0\", st.OnHand, st.Reserved)\n\t}\n\tif st := oracleStock(t, mem, oracleSKU); st.OnHand != 15 {\n\t\tt.Fatalf(\"on hand = %d, want 15\", st.OnHand)\n\t}\n\tif got := oracleAvailable(t, svc, \"CD-5678\"); got != 4 {\n\t\tt.Fatalf(\"available = %d, want 4\", got)\n\t}\n}\n\nfunc TestOracleReceiveRefusesDiscontinued(t *testing.T) {\n\tsvc, _ := oracleSetup(t, 10)\n\tif err := svc.Receive(context.Background(), \"EF-9012\", 1); err == nil {\n\t\tt.Fatal(\"receiving a discontinued item succeeded, want an error\")\n\t}\n}\n\nfunc TestOracleReorderReportExisting(t *testing.T) {\n\tsvc, mem := oracleSetup(t, 10)\n\tctx := context.Background()\n\tfor _, st := range []store.Stock{\n\t\t{SKU: \"CD-5678\", OnHand: 3},\n\t\t{SKU: \"EF-9012\", OnHand: 0},\n\t} {\n\t\tif err := mem.PutStock(ctx, st); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tif err := svc.Reserve(ctx, oracleSKU, 6); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgot, err := svc.ReorderReport(ctx, 5)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\twant := []domain.SKU{oracleSKU, \"CD-5678\"}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"reorder report = %v, want %v\", got, want)\n\t}\n\tgot, err = svc.ReorderReport(ctx, 3)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(got) != 0 {\n\t\tt.Fatalf(\"reorder report at threshold 3 = %v, want empty\", got)\n\t}\n}\n"
