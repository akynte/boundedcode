   "files": {
    "internal/api/oracle_damaged_test.go": "package api\n\nimport (\n\t\"bytes\"\n\t\"context\"\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n\t\"reflect\"\n\t\"testing\"\n\n\t\"example.com/warehouse/internal/audit\"\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/inventory\"\n\t\"example.com/warehouse/internal/notify\"\n\t\"example.com/warehouse/internal/orders\"\n\t\"example.com/warehouse/internal/pricing\"\n\t\"example.com/warehouse/internal/shipping\"\n\t\"example.com/warehouse/internal/store\"\n)\n\n// The new Damaged field and SetDamaged method are reached through reflection\n// so that this file compiles before they exist; tests of existing behaviour\n// can then still run.\n\nfunc oracleDamaged(t *testing.T, st store.Stock) int {\n\tt.Helper()\n\tf := reflect.ValueOf(st).FieldByName(\"Damaged\")\n\tif !f.IsValid() {\n\t\tt.Fatalf(\"store.Stock has no Damaged field\")\n\t}\n\tswitch f.Kind() {\n\tcase reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64:\n\t\treturn int(f.Int())\n\t}\n\tt.Fatalf(\"store.Stock.Damaged has kind %s, want an integer\", f.Kind())\n\treturn 0\n}\n\n// oracleSetDamaged calls (*inventory.Service).SetDamaged(ctx, sku, count) error.\nfunc oracleSetDamaged(t *testing.T, svc *inventory.Service, sku domain.SKU, n int) {\n\tt.Helper()\n\tm := reflect.ValueOf(svc).MethodByName(\"SetDamaged\")\n\tif !m.IsValid() {\n\t\tt.Fatalf(\"inventory.Service has no SetDamaged method\")\n\t}\n\tmt := m.Type()\n\tif mt.NumIn() != 3 || mt.NumOut() != 1 {\n\t\tt.Fatalf(\"SetDamaged has signature %s, want func(context.Context, domain.SKU, int) error\", mt)\n\t}\n\tskuV := reflect.ValueOf(sku)\n\tnV := reflect.ValueOf(n)\n\tif !skuV.Type().ConvertibleTo(mt.In(1)) || !nV.Type().ConvertibleTo(mt.In(2)) {\n\t\tt.Fatalf(\"SetDamaged has signature %s, want func(context.Context, domain.SKU, int) error\", mt)\n\t}\n\tout := m.Call([]reflect.Value{reflect.ValueOf(context.Background()),\n\t\tskuV.Convert(mt.In(1)), nV.Convert(mt.In(2))})\n\tif !out[0].IsNil() {\n\t\tt.Fatalf(\"SetDamaged(%s, %d): %v\", sku, n, out[0].Interface())\n\t}\n}\n\ntype oracleEnv struct {\n\tmem *store.Memory\n\tinv *inventory.Service\n\tsrv *httptest.Server\n}\n\nfunc oracleNewEnv(t *testing.T, onHand int) *oracleEnv {\n\tt.Helper()\n\tmem := store.NewMemory()\n\tctx := context.Background()\n\tif err := mem.PutItem(ctx, domain.Item{\n\t\tSKU: \"AB-1234\", Name: \"Widget\", Category: domain.CategoryGeneral,\n\t\tUnitPrice: domain.NewMoney(1000, domain.GBP), WeightGram: 500,\n\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 50},\n\t}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := mem.PutStock(ctx, store.Stock{SKU: \"AB-1234\", OnHand: onHand}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tinv := inventory.New(mem, mem)\n\tord := orders.New(mem, mem, inv,\n\t\tpricing.New(mem, 2000),\n\t\tshipping.New(mem, shipping.DefaultZones()...),\n\t\taudit.NewMemoryLog(),\n\t\tnotify.New(notify.NewRecorder()),\n\t)\n\tsrv := httptest.NewServer(NewServer(ord, inv, mem).Routes())\n\tt.Cleanup(srv.Close)\n\treturn &oracleEnv{mem: mem, inv: inv, srv: srv}\n}\n\nfunc (e *oracleEnv) stockAvailable(t *testing.T, sku string) (int, int) {\n\tt.Helper()\n\tresp, err := http.Get(e.srv.URL + \"/stock/\" + sku)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer resp.Body.Close()\n\tif resp.StatusCode != http.StatusOK {\n\t\treturn resp.StatusCode, 0\n\t}\n\tvar body map[string]any\n\tif err := json.NewDecoder(resp.Body).Decode(&body); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tn, ok := body[\"available\"].(float64)\n\tif !ok {\n\t\tt.Fatalf(\"GET /stock/%s body %v has no numeric available\", sku, body)\n\t}\n\tif body[\"sku\"] != sku {\n\t\tt.Fatalf(\"GET /stock/%s body sku = %v\", sku, body[\"sku\"])\n\t}\n\treturn resp.StatusCode, int(n)\n}\n\nfunc (e *oracleEnv) placeOrder(t *testing.T, id string, qty int) int {\n\tt.Helper()\n\tbody := fmt.Sprintf(`{\"order_id\":%q,\"customer_id\":\"c1\",\"currency\":\"GBP\",\"country_code\":\"GB\",`+\n\t\t`\"lines\":[{\"sku\":\"AB-1234\",\"quantity\":%d}]}`, id, qty)\n\tresp, err := http.Post(e.srv.URL+\"/orders\", \"application/json\", bytes.NewBufferString(body))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tresp.Body.Close()\n\treturn resp.StatusCode\n}\n\nfunc (e *oracleEnv) cancelOrder(t *testing.T, id string) int {\n\tt.Helper()\n\tresp, err := http.Post(e.srv.URL+\"/orders/\"+id+\"/cancel?reason=test\", \"\", nil)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tresp.Body.Close()\n\treturn resp.StatusCode\n}\n\nfunc (e *oracleEnv) stock(t *testing.T) store.Stock {\n\tt.Helper()\n\tst, err := e.mem.GetStock(context.Background(), \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn st\n}\n\n// --- new behaviour ---\n\nfunc TestOracleGetStockExcludesDamaged(t *testing.T) {\n\te := oracleNewEnv(t, 10)\n\toracleSetDamaged(t, e.inv, \"AB-1234\", 4)\n\tcode, avail := e.stockAvailable(t, \"AB-1234\")\n\tif code != http.StatusOK {\n\t\tt.Fatalf(\"status = %d, want 200\", code)\n\t}\n\tif avail != 6 {\n\t\tt.Fatalf(\"available = %d, want 6 (10 on hand, 4 damaged)\", avail)\n\t}\n\tif st := e.stock(t); st.OnHand != 10 {\n\t\tt.Fatalf(\"on hand = %d, want 10\", st.OnHand)\n\t}\n}\n\nfunc TestOraclePlaceOrderCannotBuyDamagedUnits(t *testing.T) {\n\te := oracleNewEnv(t, 10)\n\toracleSetDamaged(t, e.inv, \"AB-1234\", 4)\n\n\tif code := e.placeOrder(t, \"o1\", 7); code != http.StatusConflict {\n\t\tt.Fatalf(\"ordering 7 of 6 sellable: status = %d, want 409\", code)\n\t}\n\tif st := e.stock(t); st.Reserved != 0 {\n\t\tt.Fatalf(\"reserved = %d after refused order, want 0\", st.Reserved)\n\t}\n\tif code := e.placeOrder(t, \"o2\", 6); code != http.StatusCreated {\n\t\tt.Fatalf(\"ordering 6 of 6 sellable: status = %d, want 201\", code)\n\t}\n\tif _, avail := e.stockAvailable(t, \"AB-1234\"); avail != 0 {\n\t\tt.Fatalf(\"available = %d, want 0\", avail)\n\t}\n\tif code := e.placeOrder(t, \"o3\", 1); code != http.StatusConflict {\n\t\tt.Fatalf(\"ordering 1 with nothing sellable: status = %d, want 409\", code)\n\t}\n\n\tif code := e.cancelOrder(t, \"o2\"); code != http.StatusNoContent {\n\t\tt.Fatalf(\"cancel status = %d, want 204\", code)\n\t}\n\tif _, avail := e.stockAvailable(t, \"AB-1234\"); avail != 6 {\n\t\tt.Fatalf(\"available = %d after cancel, want 6 (damaged units stay unsellable)\", avail)\n\t}\n\tst := e.stock(t)\n\tif st.OnHand != 10 || st.Reserved != 0 || oracleDamaged(t, st) != 4 {\n\t\tt.Fatalf(\"on hand %d reserved %d damaged %d, want 10, 0, 4\",\n\t\t\tst.OnHand, st.Reserved, oracleDamaged(t, st))\n\t}\n}\n\n// --- existing behaviour ---\n\nfunc TestOracleGetStockExisting(t *testing.T) {\n\te := oracleNewEnv(t, 10)\n\tif code, avail := e.stockAvailable(t, \"AB-1234\"); code != http.StatusOK || avail != 10 {\n\t\tt.Fatalf(\"status %d available %d, want 200 and 10\", code, avail)\n\t}\n\tif code, avail := e.stockAvailable(t, \"ZZ-9999\"); code != http.StatusOK || avail != 0 {\n\t\tt.Fatalf(\"unknown SKU: status %d available %d, want 200 and 0\", code, avail)\n\t}\n\tif code, _ := e.stockAvailable(t, \"not-a-sku\"); code != http.StatusBadRequest {\n\t\tt.Fatalf(\"invalid SKU: status %d, want 400\", code)\n\t}\n}\n\nfunc TestOraclePlaceAndCancelExisting(t *testing.T) {\n\te := oracleNewEnv(t, 10)\n\tif code := e.placeOrder(t, \"o1\", 11); code != http.StatusConflict {\n\t\tt.Fatalf(\"ordering 11 of 10: status = %d, want 409\", code)\n\t}\n\tif code := e.placeOrder(t, \"o2\", 4); code != http.StatusCreated {\n\t\tt.Fatalf(\"ordering 4 of 10: status = %d, want 201\", code)\n\t}\n\tif _, avail := e.stockAvailable(t, \"AB-1234\"); avail != 6 {\n\t\tt.Fatalf(\"available = %d, want 6\", avail)\n\t}\n\tif code := e.cancelOrder(t, \"o2\"); code != http.StatusNoContent {\n\t\tt.Fatalf(\"cancel status = %d, want 204\", code)\n\t}\n\tif _, avail := e.stockAvailable(t, \"AB-1234\"); avail != 10 {\n\t\tt.Fatalf(\"available = %d after cancel, want 10\", avail)\n\t}\n\tif st := e.stock(t); st.OnHand != 10 || st.Reserved != 0 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 10 and 0\", st.OnHand, st.Reserved)\n\t}\n}\n"
   },
   "argv": [
    "go",
    "test",
    "-count=1",
    "-run",
    "^TestOracle",
    "./internal/api"
   ],
   "timeout_seconds": 300
