    "internal/worker/oracle_damaged_test.go": "package worker\n\nimport (\n\t\"context\"\n\t\"reflect\"\n\t\"testing\"\n\t\"time\"\n\n\t\"example.com/warehouse/internal/audit\"\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/inventory\"\n\t\"example.com/warehouse/internal/store\"\n)\n\n// The Damaged field is reached through reflection so that this file compiles\n// before it exists; tests of existing behaviour can then still run.\n\nfunc oracleDamaged(t *testing.T, st store.Stock) int {\n\tt.Helper()\n\tf := reflect.ValueOf(st).FieldByName(\"Damaged\")\n\tif !f.IsValid() {\n\t\tt.Fatalf(\"store.Stock has no Damaged field\")\n\t}\n\tswitch f.Kind() {\n\tcase reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64:\n\t\treturn int(f.Int())\n\t}\n\tt.Fatalf(\"store.Stock.Damaged has kind %s, want an integer\", f.Kind())\n\treturn 0\n}\n\nfunc oracleWithDamaged(t *testing.T, st store.Stock, n int) store.Stock {\n\tt.Helper()\n\tf := reflect.ValueOf(&st).Elem().FieldByName(\"Damaged\")\n\tif !f.IsValid() {\n\t\tt.Fatalf(\"store.Stock has no Damaged field\")\n\t}\n\tswitch f.Kind() {\n\tcase reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64:\n\t\tf.SetInt(int64(n))\n\tdefault:\n\t\tt.Fatalf(\"store.Stock.Damaged has kind %s, want an integer\", f.Kind())\n\t}\n\treturn st\n}\n\nfunc oracleWorld(t *testing.T) (*store.Memory, *inventory.Service, *audit.MemoryLog) {\n\tt.Helper()\n\tmem := store.NewMemory()\n\tctx := context.Background()\n\tfor _, item := range []domain.Item{\n\t\t{SKU: \"AB-1234\", Name: \"Widget\", Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(500, domain.GBP), WeightGram: 250},\n\t\t{SKU: \"CD-5678\", Name: \"Gadget\", Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(700, domain.GBP), WeightGram: 300},\n\t\t{SKU: \"EF-9012\", Name: \"Old thing\", Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(900, domain.GBP), WeightGram: 300, Discontinued: true},\n\t} {\n\t\tif err := mem.PutItem(ctx, item); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\treturn mem, inventory.New(mem, mem), audit.NewMemoryLog()\n}\n\nfunc oracleRestockSubjects(t *testing.T, log *audit.MemoryLog) []string {\n\tt.Helper()\n\tevents, err := log.Since(context.Background(), time.Time{})\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tvar out []string\n\tfor _, ev := range events {\n\t\tif ev.Action == \"restock.needed\" {\n\t\t\tout = append(out, ev.Subject)\n\t\t}\n\t}\n\treturn out\n}\n\nfunc oraclePutCancelled(t *testing.T, mem *store.Memory, id domain.OrderID, sku domain.SKU, qty int) {\n\tt.Helper()\n\tif err := mem.PutOrder(context.Background(), domain.Order{\n\t\tID: id, CustomerID: \"c1\", State: domain.StateCancelled, Currency: domain.GBP,\n\t\tLines: []domain.OrderLine{{SKU: sku, Quantity: qty, UnitPrice: domain.NewMoney(500, domain.GBP)}},\n\t}); err != nil {\n\t\tt.Fatal(err)\n\t}\n}\n\n// --- new behaviour ---\n\nfunc TestOracleRestockWatcherCountsDamagedAsUnavailable(t *testing.T) {\n\tmem, inv, log := oracleWorld(t)\n\tctx := context.Background()\n\tif err := mem.PutStock(ctx, oracleWithDamaged(t, store.Stock{SKU: \"AB-1234\", OnHand: 10}, 8)); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := mem.PutStock(ctx, store.Stock{SKU: \"CD-5678\", OnHand: 10}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tn, err := NewRestockWatcher(inv, log, 5).RunOnce(ctx)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif n != 1 {\n\t\tt.Fatalf(\"RunOnce = %d, want 1: 8 of AB-1234's 10 units are damaged\", n)\n\t}\n\tif got := oracleRestockSubjects(t, log); !reflect.DeepEqual(got, []string{\"AB-1234\"}) {\n\t\tt.Fatalf(\"restock.needed subjects = %v, want [AB-1234]\", got)\n\t}\n}\n\nfunc TestOracleReconcilerKeepsDamaged(t *testing.T) {\n\tmem, inv, log := oracleWorld(t)\n\tctx := context.Background()\n\tif err := mem.PutStock(ctx, oracleWithDamaged(t,\n\t\tstore.Stock{SKU: \"AB-1234\", OnHand: 10, Reserved: 3}, 2)); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toraclePutCancelled(t, mem, \"o1\", \"AB-1234\", 3)\n\n\trep, err := NewReconciler(mem, mem, inv, log).RunOnce(ctx)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif rep.ReservationsFreed != 3 {\n\t\tt.Fatalf(\"freed = %d, want 3\", rep.ReservationsFreed)\n\t}\n\tst, err := mem.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif st.OnHand != 10 || st.Reserved != 0 || oracleDamaged(t, st) != 2 {\n\t\tt.Fatalf(\"on hand %d reserved %d damaged %d, want 10, 0, 2\",\n\t\t\tst.OnHand, st.Reserved, oracleDamaged(t, st))\n\t}\n\tavail, err := inv.Available(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif avail != 8 {\n\t\tt.Fatalf(\"available = %d after reconcile, want 8\", avail)\n\t}\n}\n\n// --- existing behaviour ---\n\nfunc TestOracleRestockWatcherExisting(t *testing.T) {\n\tmem, inv, log := oracleWorld(t)\n\tctx := context.Background()\n\tfor _, st := range []store.Stock{\n\t\t{SKU: \"AB-1234\", OnHand: 10, Reserved: 7},\n\t\t{SKU: \"CD-5678\", OnHand: 10},\n\t\t{SKU: \"EF-9012\", OnHand: 1},\n\t} {\n\t\tif err := mem.PutStock(ctx, st); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tn, err := NewRestockWatcher(inv, log, 5).RunOnce(ctx)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif n != 1 {\n\t\tt.Fatalf(\"RunOnce = %d, want 1\", n)\n\t}\n\tif got := oracleRestockSubjects(t, log); !reflect.DeepEqual(got, []string{\"AB-1234\"}) {\n\t\tt.Fatalf(\"restock.needed subjects = %v, want [AB-1234]\", got)\n\t}\n}\n\nfunc TestOracleReconcilerFreesCancelledReservations(t *testing.T) {\n\tmem, inv, log := oracleWorld(t)\n\tctx := context.Background()\n\tif err := mem.PutStock(ctx, store.Stock{SKU: \"AB-1234\", OnHand: 10, Reserved: 4}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\toraclePutCancelled(t, mem, \"o1\", \"AB-1234\", 4)\n\toraclePutCancelled(t, mem, \"o2\", \"ZZ-9999\", 1)\n\n\trep, err := NewReconciler(mem, mem, inv, log).RunOnce(ctx)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif rep.OrdersExamined != 2 {\n\t\tt.Fatalf(\"examined = %d, want 2\", rep.OrdersExamined)\n\t}\n\tif rep.ReservationsFreed != 4 {\n\t\tt.Fatalf(\"freed = %d, want 4\", rep.ReservationsFreed)\n\t}\n\tif len(rep.Discrepancies) != 1 {\n\t\tt.Fatalf(\"discrepancies = %v, want one for the missing SKU\", rep.Discrepancies)\n\t}\n\tst, err := mem.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif st.OnHand != 10 || st.Reserved != 0 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 10 and 0\", st.OnHand, st.Reserved)\n\t}\n\tavail, err := inv.Available(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif avail != 10 {\n\t\tt.Fatalf(\"available = %d, want 10\", avail)\n\t}\n}\n"
   },
