   "id": "authored-internal-api",
   "files": {
    "internal/api/oracle_conflict_test.go": "package api_test\n\nimport (\n\t\"context\"\n\t\"encoding/json\"\n\t\"errors\"\n\t\"fmt\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n\t\"strings\"\n\t\"sync\"\n\t\"sync/atomic\"\n\t\"testing\"\n\t\"time\"\n\n\t\"example.com/warehouse/internal/api\"\n\t\"example.com/warehouse/internal/audit\"\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/inventory\"\n\t\"example.com/warehouse/internal/notify\"\n\t\"example.com/warehouse/internal/orders\"\n\t\"example.com/warehouse/internal/pricing\"\n\t\"example.com/warehouse/internal/shipping\"\n\t\"example.com/warehouse/internal/store\"\n)\n\nconst (\n\toracleSKU          = domain.SKU(\"AB-1234\")\n\toracleHazardousSKU = domain.SKU(\"HZ-0001\")\n)\n\n// oracleStock wraps the memory store so a test can intercept stock reads and\n// writes. Only the inventory service is given this wrapper.\ntype oracleStock struct {\n\t*store.Memory\n\tonGet func(ctx context.Context, sku domain.SKU) error\n\tonPut func(ctx context.Context, st store.Stock) error\n\tputs  atomic.Int64\n}\n\n// GetStock reads first and then calls the hook, so a hook that blocks holds\n// the caller with a snapshot already taken.\nfunc (s *oracleStock) GetStock(ctx context.Context, sku domain.SKU) (store.Stock, error) {\n\tst, err := s.Memory.GetStock(ctx, sku)\n\tif s.onGet != nil {\n\t\tif hookErr := s.onGet(ctx, sku); hookErr != nil {\n\t\t\treturn store.Stock{}, hookErr\n\t\t}\n\t}\n\treturn st, err\n}\n\nfunc (s *oracleStock) PutStock(ctx context.Context, st store.Stock) error {\n\ts.puts.Add(1)\n\tif s.onPut != nil {\n\t\tif err := s.onPut(ctx, st); err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n\treturn s.Memory.PutStock(ctx, st)\n}\n\ntype oracleEnv struct {\n\tmem     *store.Memory\n\tstock   *oracleStock\n\thandler http.Handler\n}\n\nfunc oracleSetup(t *testing.T, onHand int) *oracleEnv {\n\tt.Helper()\n\tctx := context.Background()\n\tmem := store.NewMemory()\n\tfor _, item := range []domain.Item{\n\t\t{\n\t\t\tSKU: oracleSKU, Name: \"Widget\", Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(1000, domain.GBP), WeightGram: 500,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 50},\n\t\t},\n\t\t{\n\t\t\tSKU: oracleHazardousSKU, Name: \"Solvent\", Category: domain.CategoryHazardous,\n\t\t\tUnitPrice: domain.NewMoney(500, domain.GBP), WeightGram: 1000,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 100},\n\t\t},\n\t} {\n\t\tif err := mem.PutItem(ctx, item); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tif err := mem.PutStock(ctx, store.Stock{SKU: oracleSKU, OnHand: onHand}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := mem.PutStock(ctx, store.Stock{SKU: oracleHazardousSKU, OnHand: 50}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tstock := &oracleStock{Memory: mem}\n\tinv := inventory.New(stock, mem)\n\tsvc := orders.New(mem, mem, inv,\n\t\tpricing.New(mem, 2000),\n\t\tshipping.New(mem, shipping.DefaultZones()...),\n\t\taudit.NewMemoryLog(),\n\t\tnotify.New(notify.NewRecorder()),\n\t)\n\treturn &oracleEnv{mem: mem, stock: stock, handler: api.NewServer(svc, inv, mem).Routes()}\n}\n\ntype oracleResult struct {\n\tstatus int\n\theader http.Header\n\tbody   string\n}\n\nfunc (r oracleResult) errorMessage(t *testing.T) string {\n\tt.Helper()\n\tvar body map[string]any\n\tif err := json.Unmarshal([]byte(r.body), &body); err != nil {\n\t\tt.Fatalf(\"response body is not a JSON object: %v (body %q)\", err, r.body)\n\t}\n\tmsg, ok := body[\"error\"].(string)\n\tif !ok {\n\t\tt.Fatalf(\"response body has no string \\\"error\\\" field: %q\", r.body)\n\t}\n\treturn msg\n}\n\nfunc (e *oracleEnv) do(method, path, body string) oracleResult {\n\tvar req *http.Request\n\tif body == \"\" {\n\t\treq = httptest.NewRequest(method, path, nil)\n\t} else {\n\t\treq = httptest.NewRequest(method, path, strings.NewReader(body))\n\t\treq.Header.Set(\"Content-Type\", \"application/json\")\n\t}\n\trec := httptest.NewRecorder()\n\te.handler.ServeHTTP(rec, req)\n\treturn oracleResult{status: rec.Code, header: rec.Header(), body: rec.Body.String()}\n}\n\nfunc oracleOrderBody(orderID, customer, currency, country string, sku domain.SKU, qty int) string {\n\treturn fmt.Sprintf(\n\t\t`{\"order_id\":%q,\"customer_id\":%q,\"currency\":%q,\"country_code\":%q,\"lines\":[{\"sku\":%q,\"quantity\":%d}]}`,\n\t\torderID, customer, currency, country, string(sku), qty)\n}\n\nfunc (e *oracleEnv) place(orderID, customer string, qty int) oracleResult {\n\treturn e.do(http.MethodPost, \"/orders\", oracleOrderBody(orderID, customer, \"GBP\", \"GB\", oracleSKU, qty))\n}\n\n// oracleAssertConflict checks the response a client should see when a\n// reservation lost a race: a 4xx that says so, not a 500 and not a claim that\n// the stock has run out.\nfunc oracleAssertConflict(t *testing.T, r oracleResult) {\n\tt.Helper()\n\tif r.status != http.StatusConflict {\n\t\tt.Fatalf(\"status = %d, want %d (409 Conflict); body %q\", r.status, http.StatusConflict, r.body)\n\t}\n\tif ct := r.header.Get(\"Content-Type\"); !strings.HasPrefix(ct, \"application/json\") {\n\t\tt.Errorf(\"Content-Type = %q, want application/json\", ct)\n\t}\n\tmsg := r.errorMessage(t)\n\tif strings.TrimSpace(msg) == \"\" {\n\t\tt.Errorf(\"error message is empty\")\n\t}\n\tif msg == \"internal error\" {\n\t\tt.Errorf(\"error message = %q; a lost race is not an internal error\", msg)\n\t}\n\tif msg == \"insufficient stock\" {\n\t\tt.Errorf(\"error message = %q; a lost race must be distinguishable from running out of stock, \"+\n\t\t\t\"because one is worth retrying and the other is not\", msg)\n\t}\n}\n\n// oracleBarrier makes the first n stock reads of a SKU wait for each other, so\n// n concurrent reservations all read the same version before any writes.\ntype oracleBarrier struct {\n\tmu       sync.Mutex\n\tn        int\n\tarrived  int\n\trelease  chan struct{}\n\ttimedOut atomic.Bool\n}\n\nfunc oracleNewBarrier(n int) *oracleBarrier {\n\treturn &oracleBarrier{n: n, release: make(chan struct{})}\n}\n\nfunc (b *oracleBarrier) wait() {\n\tb.mu.Lock()\n\tif b.arrived >= b.n {\n\t\tb.mu.Unlock()\n\t\treturn\n\t}\n\tb.arrived++\n\tif b.arrived == b.n {\n\t\tclose(b.release)\n\t}\n\tb.mu.Unlock()\n\tselect {\n\tcase <-b.release:\n\tcase <-time.After(3 * time.Second):\n\t\tb.timedOut.Store(true)\n\t}\n}\n\nfunc (e *oracleEnv) raceTwo(t *testing.T, bodies [2]string) [2]oracleResult {\n\tt.Helper()\n\tbarrier := oracleNewBarrier(2)\n\te.stock.onGet = func(_ context.Context, sku domain.SKU) error {\n\t\tif sku == oracleSKU {\n\t\t\tbarrier.wait()\n\t\t}\n\t\treturn nil\n\t}\n\tvar results [2]oracleResult\n\tvar wg sync.WaitGroup\n\tfor i := range bodies {\n\t\twg.Add(1)\n\t\tgo func(i int) {\n\t\t\tdefer wg.Done()\n\t\t\tresults[i] = e.do(http.MethodPost, \"/orders\", bodies[i])\n\t\t}(i)\n\t}\n\twg.Wait()\n\te.stock.onGet = nil\n\tif barrier.timedOut.Load() {\n\t\tt.Fatalf(\"the two reservations never ran concurrently; the handler must not serialise \" +\n\t\t\t\"requests to hide the race, it must report the conflict\")\n\t}\n\treturn results\n}\n\nfunc oracleSplit(t *testing.T, results [2]oracleResult) (winner, loser int) {\n\tt.Helper()\n\tswitch {\n\tcase results[0].status == http.StatusCreated && results[1].status != http.StatusCreated:\n\t\treturn 0, 1\n\tcase results[1].status == http.StatusCreated && results[0].status != http.StatusCreated:\n\t\treturn 1, 0\n\t}\n\tt.Fatalf(\"want exactly one 201, got %d (%q) and %d (%q)\",\n\t\tresults[0].status, results[0].body, results[1].status, results[1].body)\n\treturn 0, 0\n}\n\n// The scenario from the report: two customers race for the last unit.\nfunc TestOracleRaceForLastUnitReportsConflictNot500(t *testing.T) {\n\te := oracleSetup(t, 1)\n\tresults := e.raceTwo(t, [2]string{\n\t\toracleOrderBody(\"o-a\", \"alice\", \"GBP\", \"GB\", oracleSKU, 1),\n\t\toracleOrderBody(\"o-b\", \"bob\", \"GBP\", \"GB\", oracleSKU, 1),\n\t})\n\tfor i, r := range results {\n\t\tif r.status >= 500 {\n\t\t\tt.Errorf(\"request %d: status %d; a lost race is not a server error (body %q)\", i, r.status, r.body)\n\t\t}\n\t}\n\t_, loser := oracleSplit(t, results)\n\toracleAssertConflict(t, results[loser])\n\n\tst, err := e.mem.GetStock(context.Background(), oracleSKU)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif st.Reserved != 1 {\n\t\tt.Fatalf(\"reserved = %d after the race, want 1\", st.Reserved)\n\t}\n\n\t// Retrying now tells the loser the truth: the unit has gone.\n\tretry := e.place(\"o-retry\", \"retrier\", 1)\n\tif retry.status != http.StatusConflict || retry.errorMessage(t) != \"insufficient stock\" {\n\t\tt.Fatalf(\"retry after the race: status %d body %q, want 409 insufficient stock\", retry.status, retry.body)\n\t}\n}\n\n// When plenty is left, the loser of a race must not be told stock ran out,\n// and a retry must succeed.\nfunc TestOracleRaceWithStockLeftIsRetryable(t *testing.T) {\n\te := oracleSetup(t, 10)\n\tbodies := [2]string{\n\t\toracleOrderBody(\"o-a\", \"alice\", \"GBP\", \"GB\", oracleSKU, 1),\n\t\toracleOrderBody(\"o-b\", \"bob\", \"GBP\", \"GB\", oracleSKU, 1),\n\t}\n\tresults := e.raceTwo(t, bodies)\n\t_, loser := oracleSplit(t, results)\n\toracleAssertConflict(t, results[loser])\n\n\tretry := e.do(http.MethodPost, \"/orders\", bodies[loser])\n\tif retry.status != http.StatusCreated {\n\t\tt.Fatalf(\"retrying the losing request: status %d body %q, want 201\", retry.status, retry.body)\n\t}\n\tst, err := e.mem.GetStock(context.Background(), oracleSKU)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif st.Reserved != 2 {\n\t\tt.Fatalf(\"reserved = %d, want 2\", st.Reserved)\n\t}\n}\n\nfunc TestOracleStoreConflictOnPlaceIs409(t *testing.T) {\n\te := oracleSetup(t, 10)\n\te.stock.onPut = func(context.Context, store.Stock) error { return store.ErrConflict }\n\toracleAssertConflict(t, e.place(\"o1\", \"c1\", 1))\n}\n\n// A real database layer will wrap the sentinel; the mapping must use errors.Is.\nfunc TestOracleWrappedStoreConflictIs409(t *testing.T) {\n\te := oracleSetup(t, 10)\n\te.stock.onPut = func(context.Context, store.Stock) error {\n\t\treturn fmt.Errorf(\"postgres: update stock AB-1234: %w\", store.ErrConflict)\n\t}\n\toracleAssertConflict(t, e.place(\"o1\", \"c1\", 1))\n}\n\n// The API reports what happened; it does not quietly retry. The package owns\n// translation of errors only, and retrying Place would repeat side effects.\nfunc TestOracleConflictIsReportedNotRetriedByHandler(t *testing.T) {\n\te := oracleSetup(t, 10)\n\tvar failed atomic.Bool\n\te.stock.onPut = func(context.Context, store.Stock) error {\n\t\tif failed.CompareAndSwap(false, true) {\n\t\t\treturn store.ErrConflict\n\t\t}\n\t\treturn nil\n\t}\n\tr := e.place(\"o1\", \"c1\", 1)\n\toracleAssertConflict(t, r)\n\tif n := e.stock.puts.Load(); n != 1 {\n\t\tt.Fatalf(\"PutStock called %d times for one request, want 1\", n)\n\t}\n\tif _, err := e.mem.GetOrder(context.Background(), \"o1\"); !errors.Is(err, store.ErrNotFound) {\n\t\tt.Fatalf(\"order o1 was stored despite the conflict response (err %v)\", err)\n\t}\n}\n\n// Any endpoint that hits a version conflict should report it the same way.\nfunc TestOracleStoreConflictOnCancelIs409(t *testing.T) {\n\te := oracleSetup(t, 10)\n\tif r := e.place(\"o1\", \"c1\", 1); r.status != http.StatusCreated {\n\t\tt.Fatalf(\"place: %d %q\", r.status, r.body)\n\t}\n\te.stock.onPut = func(context.Context, store.Stock) error { return store.ErrConflict }\n\toracleAssertConflict(t, e.do(http.MethodPost, \"/orders/o1/cancel?reason=x\", \"\"))\n\n\t// Once the contention clears, the retry works.\n\te.stock.onPut = nil\n\tif r := e.do(http.MethodPost, \"/orders/o1/cancel?reason=x\", \"\"); r.status != http.StatusNoContent {\n\t\tt.Fatalf(\"cancel retry: %d %q, want 204\", r.status, r.body)\n\t}\n}\n\n// An error the API does not recognise is still a 500: the fix must not turn\n// every failure into a 409.\nfunc TestOracleUnknownErrorStays500(t *testing.T) {\n\te := oracleSetup(t, 10)\n\tboom := errors.New(\"disk on fire\")\n\te.stock.onPut = func(context.Context, store.Stock) error { return boom }\n\tr := e.place(\"o1\", \"c1\", 1)\n\tif r.status != http.StatusInternalServerError {\n\t\tt.Fatalf(\"status = %d, want 500; body %q\", r.status, r.body)\n\t}\n\tif msg := r.errorMessage(t); msg != \"internal error\" {\n\t\tt.Fatalf(\"error = %q, want %q\", msg, \"internal error\")\n\t}\n\tif strings.Contains(r.body, \"disk on fire\") {\n\t\tt.Fatalf(\"internal error detail leaked to the client: %q\", r.body)\n\t}\n\n\te.stock.onPut = nil\n\te.stock.onGet = func(context.Context, domain.SKU) error { return boom }\n\tif r := e.do(http.MethodGet, \"/stock/AB-1234\", \"\"); r.status != http.StatusInternalServerError {\n\t\tt.Fatalf(\"GET /stock with a broken store: %d, want 500\", r.status)\n\t}\n}\n\n// Existing mappings that the change must leave alone.\nfunc TestOracleExistingErrorMappings(t *testing.T) {\n\tcases := []struct {\n\t\tname       string\n\t\tonHand     int\n\t\tmethod     string\n\t\tpath       string\n\t\tbody       string\n\t\twantStatus int\n\t\twantError  string\n\t}{\n\t\t{\"insufficient stock\", 1, http.MethodPost, \"/orders\",\n\t\t\toracleOrderBody(\"o1\", \"c1\", \"GBP\", \"GB\", oracleSKU, 2), http.StatusConflict, \"insufficient stock\"},\n\t\t{\"unknown item\", 10, http.MethodPost, \"/orders\",\n\t\t\toracleOrderBody(\"o1\", \"c1\", \"GBP\", \"GB\", \"ZZ-9999\", 1), http.StatusNotFound, \"not found\"},\n\t\t{\"invalid sku in order\", 10, http.MethodPost, \"/orders\",\n\t\t\toracleOrderBody(\"o1\", \"c1\", \"GBP\", \"GB\", \"nope\", 1), http.StatusBadRequest, \"invalid sku\"},\n\t\t{\"currency mismatch\", 10, http.MethodPost, \"/orders\",\n\t\t\toracleOrderBody(\"o1\", \"c1\", \"EUR\", \"GB\", oracleSKU, 1), http.StatusBadRequest, \"currency mismatch\"},\n\t\t{\"no zone\", 10, http.MethodPost, \"/orders\",\n\t\t\toracleOrderBody(\"o1\", \"c1\", \"GBP\", \"ZZ\", oracleSKU, 1), http.StatusBadRequest, \"we do not ship there\"},\n\t\t{\"no carrier\", 10, http.MethodPost, \"/orders\",\n\t\t\toracleOrderBody(\"o1\", \"c1\", \"GBP\", \"FR\", oracleHazardousSKU, 1), http.StatusConflict, \"no carrier for this parcel\"},\n\t\t{\"empty order\", 10, http.MethodPost, \"/orders\",\n\t\t\t`{\"order_id\":\"o1\",\"customer_id\":\"c1\",\"currency\":\"GBP\",\"country_code\":\"GB\",\"lines\":[]}`,\n\t\t\thttp.StatusBadRequest, \"an order needs at least one line\"},\n\t\t{\"malformed body\", 10, http.MethodPost, \"/orders\", `{\"lines\":`, http.StatusBadRequest, \"malformed body\"},\n\t\t{\"cancel unknown order\", 10, http.MethodPost, \"/orders/missing/cancel\", \"\", http.StatusNotFound, \"not found\"},\n\t\t{\"get unknown item\", 10, http.MethodGet, \"/items/ZZ-9999\", \"\", http.StatusNotFound, \"not found\"},\n\t\t{\"get invalid sku\", 10, http.MethodGet, \"/items/nope\", \"\", http.StatusBadRequest, \"invalid sku\"},\n\t\t{\"stock invalid sku\", 10, http.MethodGet, \"/stock/nope\", \"\", http.StatusBadRequest, \"invalid sku\"},\n\t}\n\tfor _, tc := range cases {\n\t\tt.Run(tc.name, func(t *testing.T) {\n\t\t\te := oracleSetup(t, tc.onHand)\n\t\t\tr := e.do(tc.method, tc.path, tc.body)\n\t\t\tif r.status != tc.wantStatus {\n\t\t\t\tt.Fatalf(\"status = %d, want %d; body %q\", r.status, tc.wantStatus, r.body)\n\t\t\t}\n\t\t\tif msg := r.errorMessage(t); msg != tc.wantError {\n\t\t\t\tt.Fatalf(\"error = %q, want %q\", msg, tc.wantError)\n\t\t\t}\n\t\t\tif ct := r.header.Get(\"Content-Type\"); !strings.HasPrefix(ct, \"application/json\") {\n\t\t\t\tt.Fatalf(\"Content-Type = %q, want application/json\", ct)\n\t\t\t}\n\t\t})\n\t}\n}\n\nfunc TestOracleIllegalTransitionStays409(t *testing.T) {\n\te := oracleSetup(t, 10)\n\tif r := e.place(\"o1\", \"c1\", 1); r.status != http.StatusCreated {\n\t\tt.Fatalf(\"place: %d %q\", r.status, r.body)\n\t}\n\tif r := e.do(http.MethodPost, \"/orders/o1/cancel\", \"\"); r.status != http.StatusNoContent {\n\t\tt.Fatalf(\"first cancel: %d %q\", r.status, r.body)\n\t}\n\tr := e.do(http.MethodPost, \"/orders/o1/cancel\", \"\")\n\tif r.status != http.StatusConflict {\n\t\tt.Fatalf(\"second cancel: %d %q, want 409\", r.status, r.body)\n\t}\n\tif msg := r.errorMessage(t); msg != \"illegal state transition\" {\n\t\tt.Fatalf(\"error = %q, want %q\", msg, \"illegal state transition\")\n\t}\n}\n\nfunc TestOracleHappyPathsUnchanged(t *testing.T) {\n\te := oracleSetup(t, 10)\n\n\tr := e.place(\"o1\", \"c1\", 2)\n\tif r.status != http.StatusCreated {\n\t\tt.Fatalf(\"place: %d %q\", r.status, r.body)\n\t}\n\tvar placed map[string]any\n\tif err := json.Unmarshal([]byte(r.body), &placed); err != nil {\n\t\tt.Fatal(err)\n\t}\n\t// 2 x 10.00 + 4.95 shipping (1kg domestic) = 24.95, + 20% tax 4.99 = 29.94.\n\tfor key, want := range map[string]string{\n\t\t\"subtotal\": \"20.00 GBP\", \"shipping\": \"4.95 GBP\", \"tax\": \"4.99 GBP\", \"total\": \"29.94 GBP\",\n\t} {\n\t\tif got := placed[key]; got != want {\n\t\t\tt.Errorf(\"%s = %v, want %s\", key, got, want)\n\t\t}\n\t}\n\tif _, ok := placed[\"order\"]; !ok {\n\t\tt.Errorf(\"response has no order: %q\", r.body)\n\t}\n\n\tr = e.do(http.MethodGet, \"/stock/AB-1234\", \"\")\n\tif r.status != http.StatusOK {\n\t\tt.Fatalf(\"stock: %d %q\", r.status, r.body)\n\t}\n\tvar stock map[string]any\n\tif err := json.Unmarshal([]byte(r.body), &stock); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif stock[\"available\"] != float64(8) {\n\t\tt.Fatalf(\"available = %v, want 8\", stock[\"available\"])\n\t}\n\n\tr = e.do(http.MethodGet, \"/stock/ZZ-9999\", \"\")\n\tif r.status != http.StatusOK || !strings.Contains(r.body, `\"available\":0`) {\n\t\tt.Fatalf(\"stock for unstocked SKU: %d %q, want 200 with 0 available\", r.status, r.body)\n\t}\n\n\tif r = e.do(http.MethodPost, \"/orders/o1/cancel?reason=changed\", \"\"); r.status != http.StatusNoContent {\n\t\tt.Fatalf(\"cancel: %d %q\", r.status, r.body)\n\t}\n\tst, err := e.mem.GetStock(context.Background(), oracleSKU)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif st.Reserved != 0 {\n\t\tt.Fatalf(\"reserved = %d after cancel, want 0\", st.Reserved)\n\t}\n\n\tif r = e.do(http.MethodGet, \"/healthz\", \"\"); r.status != http.StatusOK || !strings.Contains(r.body, `\"ok\"`) {\n\t\tt.Fatalf(\"healthz: %d %q\", r.status, r.body)\n\t}\n\tif r = e.do(http.MethodGet, \"/items\", \"\"); r.status != http.StatusOK || !strings.Contains(r.body, \"AB-1234\") {\n\t\tt.Fatalf(\"items: %d %q\", r.status, r.body)\n\t}\n\tif r = e.do(http.MethodGet, \"/items/ab-1234\", \"\"); r.status != http.StatusOK || !strings.Contains(r.body, \"Widget\") {\n\t\tt.Fatalf(\"item: %d %q\", r.status, r.body)\n\t}\n}\n"
   },
   "argv": [
    "go",
    "test",
