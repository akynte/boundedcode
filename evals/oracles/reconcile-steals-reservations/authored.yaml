    "internal/worker/oracle_reconcile_test.go": "package worker\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"testing\"\n\t\"time\"\n\n\t\"example.com/warehouse/internal/audit\"\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/inventory\"\n\t\"example.com/warehouse/internal/notify\"\n\t\"example.com/warehouse/internal/orders\"\n\t\"example.com/warehouse/internal/pricing\"\n\t\"example.com/warehouse/internal/shipping\"\n\t\"example.com/warehouse/internal/store\"\n)\n\nconst (\n\toracleSKUA domain.SKU = \"AB-1234\"\n\toracleSKUB domain.SKU = \"CD-5678\"\n)\n\n// oracleWorld wires the service the way cmd/warehoused does: one store, one\n// inventory service and one audit log shared by the order service and the\n// reconciler.\ntype oracleWorld struct {\n\tmem    *store.Memory\n\tinv    *inventory.Service\n\tlog    *audit.MemoryLog\n\torders *orders.Service\n}\n\nfunc oracleNewWorld(t *testing.T) *oracleWorld {\n\tt.Helper()\n\tctx := context.Background()\n\tmem := store.NewMemory()\n\tfor _, sku := range []domain.SKU{oracleSKUA, oracleSKUB} {\n\t\tif err := mem.PutItem(ctx, domain.Item{\n\t\t\tSKU: sku, Name: \"Widget \" + sku.String(), Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(1000, domain.GBP), WeightGram: 500,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 50},\n\t\t}); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif err := mem.PutStock(ctx, store.Stock{SKU: sku, OnHand: 100}); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tinv := inventory.New(mem, mem)\n\tlog := audit.NewMemoryLog()\n\tsvc := orders.New(mem, mem, inv,\n\t\tpricing.New(mem, 2000),\n\t\tshipping.New(mem, shipping.DefaultZones()...),\n\t\tlog,\n\t\tnotify.New(notify.NewRecorder()),\n\t)\n\treturn &oracleWorld{mem: mem, inv: inv, log: log, orders: svc}\n}\n\nfunc (w *oracleWorld) reconciler() *Reconciler {\n\treturn NewReconciler(w.mem, w.mem, w.inv, w.log)\n}\n\nfunc (w *oracleWorld) place(t *testing.T, id domain.OrderID, lines ...orders.RequestLine) {\n\tt.Helper()\n\t_, _, err := w.orders.Place(context.Background(), orders.PlaceRequest{\n\t\tOrderID: id, CustomerID: \"c-\" + string(id), Currency: domain.GBP,\n\t\tCountryCode: \"GB\", Lines: lines,\n\t})\n\tif err != nil {\n\t\tt.Fatalf(\"placing %s: %v\", id, err)\n\t}\n}\n\nfunc (w *oracleWorld) cancel(t *testing.T, id domain.OrderID) {\n\tt.Helper()\n\tif err := w.orders.Cancel(context.Background(), id, \"changed mind\"); err != nil {\n\t\tt.Fatalf(\"cancelling %s: %v\", id, err)\n\t}\n}\n\n// orphan simulates a cancellation whose release never happened (a crash, an\n// import, an older code path): the stored order is moved to cancelled with\n// every other field it had left intact, and the stock is not touched.\nfunc (w *oracleWorld) orphan(t *testing.T, id domain.OrderID) {\n\tt.Helper()\n\tctx := context.Background()\n\to, err := w.mem.GetOrder(ctx, id)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := o.Transition(domain.StateCancelled); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := w.mem.PutOrder(ctx, o); err != nil {\n\t\tt.Fatal(err)\n\t}\n}\n\nfunc (w *oracleWorld) reserved(t *testing.T, sku domain.SKU) int {\n\tt.Helper()\n\tst, err := w.mem.GetStock(context.Background(), sku)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn st.Reserved\n}\n\nfunc oracleLine(sku domain.SKU, qty int) orders.RequestLine {\n\treturn orders.RequestLine{SKU: sku, Quantity: qty}\n}\n\nfunc oracleRun(t *testing.T, r *Reconciler) Report {\n\tt.Helper()\n\trep, err := r.RunOnce(context.Background())\n\tif err != nil {\n\t\tt.Fatalf(\"RunOnce: %v\", err)\n\t}\n\treturn rep\n}\n\nfunc TestOracleReconcileLeavesLiveReservationAfterCleanCancel(t *testing.T) {\n\tw := oracleNewWorld(t)\n\tw.place(t, \"live\", oracleLine(oracleSKUA, 2))\n\tw.place(t, \"gone\", oracleLine(oracleSKUA, 3))\n\tw.cancel(t, \"gone\")\n\tif got := w.reserved(t, oracleSKUA); got != 2 {\n\t\tt.Fatalf(\"reserved after cancel = %d, want 2\", got)\n\t}\n\n\trep := oracleRun(t, w.reconciler())\n\tif got := w.reserved(t, oracleSKUA); got != 2 {\n\t\tt.Fatalf(\"reserved after reconcile = %d, want 2 (the live order's reservation)\", got)\n\t}\n\tif rep.ReservationsFreed != 0 {\n\t\tt.Errorf(\"ReservationsFreed = %d, want 0: nothing was orphaned\", rep.ReservationsFreed)\n\t}\n\tif len(rep.Discrepancies) != 0 {\n\t\tt.Errorf(\"unexpected discrepancies: %v\", rep.Discrepancies)\n\t}\n}\n\nfunc TestOracleReconcileRepeatedPassesDoNotDrainLiveReservations(t *testing.T) {\n\tw := oracleNewWorld(t)\n\tw.place(t, \"live\", oracleLine(oracleSKUA, 4))\n\tfor i := range 5 {\n\t\tid := domain.OrderID(fmt.Sprintf(\"gone-%d\", i))\n\t\tw.place(t, id, oracleLine(oracleSKUA, 1))\n\t\tw.cancel(t, id)\n\t}\n\tif got := w.reserved(t, oracleSKUA); got != 4 {\n\t\tt.Fatalf(\"reserved after cancels = %d, want 4\", got)\n\t}\n\tr := w.reconciler()\n\tfor pass := range 4 {\n\t\trep := oracleRun(t, r)\n\t\tif got := w.reserved(t, oracleSKUA); got != 4 {\n\t\t\tt.Fatalf(\"pass %d: reserved = %d, want 4\", pass, got)\n\t\t}\n\t\tif rep.ReservationsFreed != 0 {\n\t\t\tt.Fatalf(\"pass %d: ReservationsFreed = %d, want 0\", pass, rep.ReservationsFreed)\n\t\t}\n\t}\n}\n\nfunc TestOracleReconcileRestartDoesNotDrainLiveReservations(t *testing.T) {\n\t// The worker is documented as holding no state between passes, so a\n\t// fresh reconciler (a restart) must be just as safe as a long-lived one.\n\tw := oracleNewWorld(t)\n\tw.place(t, \"live\", oracleLine(oracleSKUA, 3))\n\tw.place(t, \"gone\", oracleLine(oracleSKUA, 2))\n\tw.cancel(t, \"gone\")\n\tfor pass := range 3 {\n\t\toracleRun(t, w.reconciler())\n\t\tif got := w.reserved(t, oracleSKUA); got != 3 {\n\t\t\tt.Fatalf(\"restart %d: reserved = %d, want 3\", pass, got)\n\t\t}\n\t}\n}\n\nfunc TestOracleReconcileKeepsReservationsOfPaidAndPackedOrders(t *testing.T) {\n\tctx := context.Background()\n\tw := oracleNewWorld(t)\n\tw.place(t, \"reserved\", oracleLine(oracleSKUA, 1))\n\tw.place(t, \"paid\", oracleLine(oracleSKUA, 2))\n\tw.place(t, \"packed\", oracleLine(oracleSKUA, 4))\n\tif err := w.orders.MarkPaid(ctx, \"paid\"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := w.orders.MarkPaid(ctx, \"packed\"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := w.orders.Pack(ctx, \"packed\"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tw.place(t, \"gone\", oracleLine(oracleSKUA, 5))\n\tw.cancel(t, \"gone\")\n\n\tr := w.reconciler()\n\tfor range 3 {\n\t\toracleRun(t, r)\n\t}\n\tif got := w.reserved(t, oracleSKUA); got != 7 {\n\t\tt.Fatalf(\"reserved = %d, want 7 (reserved+paid+packed orders)\", got)\n\t}\n}\n\nfunc TestOracleReconcileMultiLineOrdersAcrossSKUs(t *testing.T) {\n\tw := oracleNewWorld(t)\n\tw.place(t, \"live\", oracleLine(oracleSKUA, 2), oracleLine(oracleSKUB, 3))\n\tw.place(t, \"gone\", oracleLine(oracleSKUA, 5), oracleLine(oracleSKUB, 1))\n\tw.cancel(t, \"gone\")\n\n\tr := w.reconciler()\n\tfor range 3 {\n\t\toracleRun(t, r)\n\t}\n\tif got := w.reserved(t, oracleSKUA); got != 2 {\n\t\tt.Errorf(\"%s reserved = %d, want 2\", oracleSKUA, got)\n\t}\n\tif got := w.reserved(t, oracleSKUB); got != 3 {\n\t\tt.Errorf(\"%s reserved = %d, want 3\", oracleSKUB, got)\n\t}\n}\n\nfunc TestOracleReconcileRecoversOrphanedReservation(t *testing.T) {\n\tw := oracleNewWorld(t)\n\tw.place(t, \"stuck\", oracleLine(oracleSKUA, 3))\n\tw.orphan(t, \"stuck\")\n\tif got := w.reserved(t, oracleSKUA); got != 3 {\n\t\tt.Fatalf(\"setup: reserved = %d, want 3\", got)\n\t}\n\n\trep := oracleRun(t, w.reconciler())\n\tif got := w.reserved(t, oracleSKUA); got != 0 {\n\t\tt.Fatalf(\"reserved after reconcile = %d, want 0: orphan not recovered\", got)\n\t}\n\tif rep.ReservationsFreed != 3 {\n\t\tt.Errorf(\"ReservationsFreed = %d, want 3\", rep.ReservationsFreed)\n\t}\n}\n\nfunc TestOracleReconcileRecoversOrphanAlongsideLiveOrderOnSameSKU(t *testing.T) {\n\tw := oracleNewWorld(t)\n\tw.place(t, \"live\", oracleLine(oracleSKUA, 2))\n\tw.place(t, \"stuck\", oracleLine(oracleSKUA, 3))\n\tw.place(t, \"clean\", oracleLine(oracleSKUA, 4))\n\tw.orphan(t, \"stuck\")\n\tw.cancel(t, \"clean\")\n\tif got := w.reserved(t, oracleSKUA); got != 5 {\n\t\tt.Fatalf(\"setup: reserved = %d, want 5\", got)\n\t}\n\n\tr := w.reconciler()\n\trep := oracleRun(t, r)\n\tif got := w.reserved(t, oracleSKUA); got != 2 {\n\t\tt.Fatalf(\"after first pass reserved = %d, want 2 (orphan freed, live kept)\", got)\n\t}\n\tif rep.ReservationsFreed != 3 {\n\t\tt.Errorf(\"first pass ReservationsFreed = %d, want 3\", rep.ReservationsFreed)\n\t}\n\n\trep = oracleRun(t, r)\n\tif got := w.reserved(t, oracleSKUA); got != 2 {\n\t\tt.Fatalf(\"after second pass reserved = %d, want 2: orphan freed twice\", got)\n\t}\n\tif rep.ReservationsFreed != 0 {\n\t\tt.Errorf(\"second pass ReservationsFreed = %d, want 0\", rep.ReservationsFreed)\n\t}\n}\n\nfunc TestOracleReconcileOrphanFreedOnlyOnceAcrossRestartsAndNewOrders(t *testing.T) {\n\tw := oracleNewWorld(t)\n\tw.place(t, \"stuck\", oracleLine(oracleSKUA, 3), oracleLine(oracleSKUB, 2))\n\tw.orphan(t, \"stuck\")\n\n\toracleRun(t, w.reconciler())\n\tif a, b := w.reserved(t, oracleSKUA), w.reserved(t, oracleSKUB); a != 0 || b != 0 {\n\t\tt.Fatalf(\"after recovery reserved = %d/%d, want 0/0\", a, b)\n\t}\n\n\t// New business arrives after the orphan was recovered; later passes,\n\t// including ones from a restarted worker, must not charge it for the\n\t// orphan again.\n\tw.place(t, \"fresh\", oracleLine(oracleSKUA, 3), oracleLine(oracleSKUB, 2))\n\tfor range 2 {\n\t\toracleRun(t, w.reconciler())\n\t}\n\tr := w.reconciler()\n\toracleRun(t, r)\n\toracleRun(t, r)\n\tif a, b := w.reserved(t, oracleSKUA), w.reserved(t, oracleSKUB); a != 3 || b != 2 {\n\t\tt.Fatalf(\"fresh order's reservation = %d/%d, want 3/2\", a, b)\n\t}\n}\n\nfunc TestOracleReconcileOrphanRecoveredBeforeLaterCleanCancel(t *testing.T) {\n\tw := oracleNewWorld(t)\n\tw.place(t, \"live\", oracleLine(oracleSKUA, 1))\n\tw.place(t, \"stuck\", oracleLine(oracleSKUA, 2))\n\tw.orphan(t, \"stuck\")\n\toracleRun(t, w.reconciler())\n\n\tw.place(t, \"later\", oracleLine(oracleSKUA, 6))\n\tw.cancel(t, \"later\")\n\tw.place(t, \"live2\", oracleLine(oracleSKUA, 5))\n\tr := w.reconciler()\n\tfor range 3 {\n\t\toracleRun(t, r)\n\t}\n\tif got := w.reserved(t, oracleSKUA); got != 6 {\n\t\tt.Fatalf(\"reserved = %d, want 6 (live 1 + live2 5)\", got)\n\t}\n}\n\nfunc TestOracleReconcileRunLoopDoesNotDrainLiveReservations(t *testing.T) {\n\tw := oracleNewWorld(t)\n\tw.place(t, \"live\", oracleLine(oracleSKUA, 2))\n\tw.place(t, \"gone\", oracleLine(oracleSKUA, 2))\n\tw.cancel(t, \"gone\")\n\n\tctx, cancel := context.WithTimeout(context.Background(), 60*time.Millisecond)\n\tdefer cancel()\n\tif err := w.reconciler().Run(ctx, time.Millisecond); err != context.DeadlineExceeded {\n\t\tt.Fatalf(\"Run returned %v, want context.DeadlineExceeded\", err)\n\t}\n\tif got := w.reserved(t, oracleSKUA); got != 2 {\n\t\tt.Fatalf(\"reserved = %d, want 2\", got)\n\t}\n}\n\nfunc TestOracleReconcileNoCancelledOrdersChangesNothing(t *testing.T) {\n\tw := oracleNewWorld(t)\n\tw.place(t, \"live\", oracleLine(oracleSKUA, 3))\n\trep := oracleRun(t, w.reconciler())\n\tif rep.ReservationsFreed != 0 || len(rep.Discrepancies) != 0 {\n\t\tt.Fatalf(\"report = %+v, want nothing freed and no discrepancies\", rep)\n\t}\n\tif got := w.reserved(t, oracleSKUA); got != 3 {\n\t\tt.Fatalf(\"reserved = %d, want 3\", got)\n\t}\n}\n\nfunc TestOracleReconcileRecordsPassInAudit(t *testing.T) {\n\tw := oracleNewWorld(t)\n\tstart := time.Now().Add(-time.Second)\n\toracleRun(t, w.reconciler())\n\tevents, err := w.log.Since(context.Background(), start)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tfor _, ev := range events {\n\t\tif ev.Actor == \"reconciler\" && ev.Action == \"reconcile.pass\" {\n\t\t\treturn\n\t\t}\n\t}\n\tt.Fatalf(\"no reconcile.pass event recorded; got %+v\", events)\n}\n"
   },
