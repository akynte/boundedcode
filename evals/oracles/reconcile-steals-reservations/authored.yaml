    "internal/store/oracle_memory_test.go": "package store\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"testing\"\n\n\t\"example.com/warehouse/internal/domain\"\n)\n\nfunc TestOraclePutStockRejectsStaleVersion(t *testing.T) {\n\tctx := context.Background()\n\tm := NewMemory()\n\tif err := m.PutStock(ctx, Stock{SKU: \"AB-1234\", OnHand: 10}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\ta, err := m.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tb := a\n\ta.Reserved = 2\n\tif err := m.PutStock(ctx, a); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tb.Reserved = 5\n\tif err := m.PutStock(ctx, b); !errors.Is(err, ErrConflict) {\n\t\tt.Fatalf(\"stale write returned %v, want ErrConflict\", err)\n\t}\n\tgot, err := m.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif got.Reserved != 2 || got.OnHand != 10 {\n\t\tt.Fatalf(\"stock = %+v, want reserved 2 on hand 10\", got)\n\t}\n}\n\nfunc TestOracleGetStockMissingIsNotFound(t *testing.T) {\n\tif _, err := NewMemory().GetStock(context.Background(), \"ZZ-0000\"); !errors.Is(err, ErrNotFound) {\n\t\tt.Fatalf(\"got %v, want ErrNotFound\", err)\n\t}\n}\n\nfunc TestOracleListOrdersByStateFiltersAndSorts(t *testing.T) {\n\tctx := context.Background()\n\tm := NewMemory()\n\tfor _, o := range []domain.Order{\n\t\t{ID: \"o3\", State: domain.StateCancelled},\n\t\t{ID: \"o1\", State: domain.StateCancelled},\n\t\t{ID: \"o2\", State: domain.StateReserved},\n\t\t{ID: \"o4\", State: domain.StatePaid},\n\t} {\n\t\tif err := m.PutOrder(ctx, o); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tgot, err := m.ListOrdersByState(ctx, domain.StateCancelled)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(got) != 2 || got[0].ID != \"o1\" || got[1].ID != \"o3\" {\n\t\tt.Fatalf(\"cancelled = %+v, want o1, o3\", got)\n\t}\n\t// Re-saving an order under a new state moves it between listings.\n\to2, err := m.GetOrder(ctx, \"o2\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\to2.State = domain.StateCancelled\n\tif err := m.PutOrder(ctx, o2); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgot, err = m.ListOrdersByState(ctx, domain.StateCancelled)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(got) != 3 {\n\t\tt.Fatalf(\"cancelled count = %d, want 3\", len(got))\n\t}\n\tres, err := m.ListOrdersByState(ctx, domain.StateReserved)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(res) != 0 {\n\t\tt.Fatalf(\"reserved = %+v, want none\", res)\n\t}\n}\n\nfunc TestOraclePutOrderRoundTripsLines(t *testing.T) {\n\tctx := context.Background()\n\tm := NewMemory()\n\tin := domain.Order{ID: \"o1\", State: domain.StateReserved, Currency: domain.GBP,\n\t\tLines: []domain.OrderLine{{SKU: \"AB-1234\", Quantity: 3, UnitPrice: domain.NewMoney(100, domain.GBP)}}}\n\tif err := m.PutOrder(ctx, in); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tout, err := m.GetOrder(ctx, \"o1\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif out.State != in.State || len(out.Lines) != 1 || out.Lines[0] != in.Lines[0] {\n\t\tt.Fatalf(\"round trip = %+v, want %+v\", out, in)\n\t}\n}\n"
   },
