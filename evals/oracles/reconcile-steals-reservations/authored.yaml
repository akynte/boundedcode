    "internal/orders/oracle_lifecycle_test.go": "package orders\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"testing\"\n\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/inventory\"\n)\n\nfunc oracleReserved(t *testing.T, get func(context.Context, domain.SKU) (int, error)) int {\n\tt.Helper()\n\tn, err := get(context.Background(), \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn n\n}\n\nfunc TestOracleCancelReleasesImmediatelyAndOnlyItsOwnStock(t *testing.T) {\n\tsvc, mem := newService(t)\n\tctx := context.Background()\n\tget := func(ctx context.Context, sku domain.SKU) (int, error) {\n\t\tst, err := mem.GetStock(ctx, sku)\n\t\treturn st.Reserved, err\n\t}\n\n\tlive := request()\n\tlive.OrderID, live.Lines[0].Quantity = \"live\", 3\n\tif _, _, err := svc.Place(ctx, live); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgone := request()\n\tgone.OrderID, gone.Lines[0].Quantity = \"gone\", 4\n\tif _, _, err := svc.Place(ctx, gone); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif got := oracleReserved(t, get); got != 7 {\n\t\tt.Fatalf(\"reserved = %d, want 7\", got)\n\t}\n\tif err := svc.Cancel(ctx, \"gone\", \"no longer needed\"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif got := oracleReserved(t, get); got != 3 {\n\t\tt.Fatalf(\"reserved after cancel = %d, want 3\", got)\n\t}\n\to, err := mem.GetOrder(ctx, \"gone\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif o.State != domain.StateCancelled {\n\t\tt.Fatalf(\"state = %s, want cancelled\", o.State)\n\t}\n}\n\nfunc TestOracleSecondCancelIsRefusedAndReleasesNothing(t *testing.T) {\n\tsvc, mem := newService(t)\n\tctx := context.Background()\n\tget := func(ctx context.Context, sku domain.SKU) (int, error) {\n\t\tst, err := mem.GetStock(ctx, sku)\n\t\treturn st.Reserved, err\n\t}\n\n\tgone := request()\n\tgone.OrderID = \"gone\"\n\tif _, _, err := svc.Place(ctx, gone); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tlive := request()\n\tlive.OrderID, live.Lines[0].Quantity = \"live\", 5\n\tif _, _, err := svc.Place(ctx, live); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.Cancel(ctx, \"gone\", \"first\"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.Cancel(ctx, \"gone\", \"second\"); !errors.Is(err, domain.ErrIllegalTransition) {\n\t\tt.Fatalf(\"second cancel returned %v, want ErrIllegalTransition\", err)\n\t}\n\tif got := oracleReserved(t, get); got != 5 {\n\t\tt.Fatalf(\"reserved = %d, want 5 (live order untouched)\", got)\n\t}\n}\n\nfunc TestOracleCancelAfterPaymentIsRefused(t *testing.T) {\n\tsvc, mem := newService(t)\n\tctx := context.Background()\n\tif _, _, err := svc.Place(ctx, request()); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.MarkPaid(ctx, \"o1\"); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := svc.Cancel(ctx, \"o1\", \"too late\"); !errors.Is(err, domain.ErrIllegalTransition) {\n\t\tt.Fatalf(\"got %v, want ErrIllegalTransition\", err)\n\t}\n\tst, err := mem.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif st.Reserved != 2 {\n\t\tt.Fatalf(\"reserved = %d, want 2\", st.Reserved)\n\t}\n}\n\nfunc TestOraclePlaceRefusesWhenShortAndStoresNothing(t *testing.T) {\n\tsvc, mem := newService(t)\n\tctx := context.Background()\n\treq := request()\n\treq.Lines[0].Quantity = 21\n\tif _, _, err := svc.Place(ctx, req); !errors.Is(err, inventory.ErrInsufficientStock) {\n\t\tt.Fatalf(\"got %v, want ErrInsufficientStock\", err)\n\t}\n\tif _, err := mem.GetOrder(ctx, req.OrderID); err == nil {\n\t\tt.Fatal(\"an order was stored for a refused placement\")\n\t}\n}\n\nfunc TestOracleFullLifecycleAfterOtherCancellations(t *testing.T) {\n\tsvc, mem := newService(t)\n\tctx := context.Background()\n\tfor _, id := range []domain.OrderID{\"c1\", \"c2\", \"c3\"} {\n\t\tr := request()\n\t\tr.OrderID = id\n\t\tif _, _, err := svc.Place(ctx, r); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif err := svc.Cancel(ctx, id, \"x\"); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tr := request()\n\tr.OrderID, r.Lines[0].Quantity = \"keep\", 6\n\tif _, _, err := svc.Place(ctx, r); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tfor _, step := range []func() error{\n\t\tfunc() error { return svc.MarkPaid(ctx, \"keep\") },\n\t\tfunc() error { return svc.Pack(ctx, \"keep\") },\n\t\tfunc() error { return svc.Ship(ctx, \"keep\", \"T1\") },\n\t} {\n\t\tif err := step(); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tst, err := mem.GetStock(ctx, \"AB-1234\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif st.OnHand != 14 || st.Reserved != 0 {\n\t\tt.Fatalf(\"on hand %d reserved %d, want 14 and 0\", st.OnHand, st.Reserved)\n\t}\n}\n"
   },
