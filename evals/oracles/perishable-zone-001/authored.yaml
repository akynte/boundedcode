   "id": "authored-internal-api",
   "files": {
    "internal/api/oracle_perishable_test.go": "package api\n\nimport (\n\t\"context\"\n\t\"encoding/json\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n\t\"strings\"\n\t\"testing\"\n\n\t\"example.com/warehouse/internal/audit\"\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/inventory\"\n\t\"example.com/warehouse/internal/notify\"\n\t\"example.com/warehouse/internal/orders\"\n\t\"example.com/warehouse/internal/pricing\"\n\t\"example.com/warehouse/internal/shipping\"\n\t\"example.com/warehouse/internal/store\"\n)\n\nfunc oracleServer(t *testing.T) http.Handler {\n\tt.Helper()\n\tmem := store.NewMemory()\n\tctx := context.Background()\n\tfor _, it := range []domain.Item{\n\t\t{SKU: \"PR-1001\", Name: \"Chilled cheese\", Category: domain.CategoryPerishable,\n\t\t\tUnitPrice: domain.NewMoney(500, domain.GBP), WeightGram: 400,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 100}},\n\t\t{SKU: \"GN-2001\", Name: \"Widget\", Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(1000, domain.GBP), WeightGram: 700,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 50}},\n\t\t{SKU: \"HZ-3001\", Name: \"Solvent\", Category: domain.CategoryHazardous,\n\t\t\tUnitPrice: domain.NewMoney(800, domain.GBP), WeightGram: 1000,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 200}},\n\t} {\n\t\tif err := mem.PutItem(ctx, it); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif err := mem.PutStock(ctx, store.Stock{SKU: it.SKU, OnHand: 100}); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tinv := inventory.New(mem, mem)\n\tsvc := orders.New(mem, mem, inv,\n\t\tpricing.New(mem, 2000),\n\t\tshipping.New(mem, shipping.DefaultZones()...),\n\t\taudit.NewMemoryLog(),\n\t\tnotify.New(notify.NewRecorder()),\n\t)\n\treturn NewServer(svc, inv, mem).Routes()\n}\n\ntype oracleLine struct {\n\tSKU      string `json:\"sku\"`\n\tQuantity int    `json:\"quantity\"`\n}\n\nfunc oraclePost(t *testing.T, h http.Handler, id, country string, lines ...oracleLine) (int, map[string]any) {\n\tt.Helper()\n\tbody, err := json.Marshal(map[string]any{\n\t\t\"order_id\": id, \"customer_id\": \"c1\", \"currency\": \"GBP\",\n\t\t\"country_code\": country, \"lines\": lines,\n\t})\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treq := httptest.NewRequest(http.MethodPost, \"/orders\", strings.NewReader(string(body)))\n\trec := httptest.NewRecorder()\n\th.ServeHTTP(rec, req)\n\tvar out map[string]any\n\tif err := json.Unmarshal(rec.Body.Bytes(), &out); err != nil {\n\t\tt.Fatalf(\"response is not JSON: %q\", rec.Body.String())\n\t}\n\treturn rec.Code, out\n}\n\nfunc TestOracleAPIRefusesPerishableAbroadClearly(t *testing.T) {\n\tcases := []struct {\n\t\tid, country string\n\t\tlines       []oracleLine\n\t}{\n\t\t{\"o-fr\", \"FR\", []oracleLine{{\"PR-1001\", 1}}},\n\t\t{\"o-jp\", \"JP\", []oracleLine{{\"PR-1001\", 1}}},\n\t\t{\"o-ie-mixed\", \"IE\", []oracleLine{{\"GN-2001\", 2}, {\"pr-1001\", 1}}},\n\t}\n\tfor _, c := range cases {\n\t\th := oracleServer(t)\n\t\tcode, body := oraclePost(t, h, c.id, c.country, c.lines...)\n\t\tif code == http.StatusCreated {\n\t\t\tt.Fatalf(\"%s: perishable order to %s was accepted: %v\", c.id, c.country, body)\n\t\t}\n\t\tif code != http.StatusConflict {\n\t\t\tt.Fatalf(\"%s: status %d body %v; want 409 like the other carrier refusals\", c.id, code, body)\n\t\t}\n\t\tmsg, _ := body[\"error\"].(string)\n\t\tif msg == \"\" || msg == \"internal error\" || msg == \"we do not ship there\" {\n\t\t\tt.Fatalf(\"%s: error message %q does not tell the customer why\", c.id, msg)\n\t\t}\n\t}\n}\n\nfunc TestOracleAPIAcceptsPerishableDomestically(t *testing.T) {\n\th := oracleServer(t)\n\tcode, body := oraclePost(t, h, \"o-gb\", \"GB\", oracleLine{\"PR-1001\", 3})\n\tif code != http.StatusCreated {\n\t\tt.Fatalf(\"status %d body %v, want 201\", code, body)\n\t}\n\tif body[\"shipping\"] != \"5.95 GBP\" {\n\t\tt.Fatalf(\"shipping = %v, want 5.95 GBP\", body[\"shipping\"])\n\t}\n}\n\nfunc TestOracleAPIExistingRefusalsUnchanged(t *testing.T) {\n\th := oracleServer(t)\n\n\tcode, body := oraclePost(t, h, \"o-gen-fr\", \"FR\", oracleLine{\"GN-2001\", 1})\n\tif code != http.StatusCreated || body[\"shipping\"] != \"12.45 GBP\" {\n\t\tt.Fatalf(\"general to FR: status %d body %v, want 201 with shipping 12.45 GBP\", code, body)\n\t}\n\n\tcode, body = oraclePost(t, h, \"o-haz-fr\", \"FR\", oracleLine{\"HZ-3001\", 1})\n\tif code != http.StatusConflict || body[\"error\"] != \"no carrier for this parcel\" {\n\t\tt.Fatalf(\"hazardous to FR: status %d body %v, want 409 no carrier\", code, body)\n\t}\n\n\tcode, body = oraclePost(t, h, \"o-xx\", \"XX\", oracleLine{\"PR-1001\", 1})\n\tif code != http.StatusBadRequest || body[\"error\"] != \"we do not ship there\" {\n\t\tt.Fatalf(\"unknown country: status %d body %v, want 400 we do not ship there\", code, body)\n\t}\n}\n"
   },
   "argv": [
    "go",
    "test",
    "-count=1",
    "-run",
    "^TestOracle",
    "./internal/api"
   ],
   "timeout_seconds": 300
