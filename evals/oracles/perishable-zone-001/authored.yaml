  {
   "id": "authored-internal-orders",
   "files": {
    "internal/orders/oracle_perishable_test.go": "package orders\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"testing\"\n\t\"time\"\n\n\t\"example.com/warehouse/internal/audit\"\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/inventory\"\n\t\"example.com/warehouse/internal/notify\"\n\t\"example.com/warehouse/internal/pricing\"\n\t\"example.com/warehouse/internal/shipping\"\n\t\"example.com/warehouse/internal/store\"\n)\n\nconst (\n\toracleSKUPerishable domain.SKU = \"PR-1001\"\n\toracleSKUGeneral    domain.SKU = \"GN-2001\"\n)\n\nfunc oracleService(t *testing.T) (*Service, *store.Memory, *audit.MemoryLog) {\n\tt.Helper()\n\tmem := store.NewMemory()\n\tctx := context.Background()\n\tfor _, it := range []domain.Item{\n\t\t{SKU: oracleSKUPerishable, Name: \"Chilled cheese\", Category: domain.CategoryPerishable,\n\t\t\tUnitPrice: domain.NewMoney(500, domain.GBP), WeightGram: 400,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 100}},\n\t\t{SKU: oracleSKUGeneral, Name: \"Widget\", Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(1000, domain.GBP), WeightGram: 700,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 50}},\n\t} {\n\t\tif err := mem.PutItem(ctx, it); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif err := mem.PutStock(ctx, store.Stock{SKU: it.SKU, OnHand: 50}); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tlog := audit.NewMemoryLog()\n\tsvc := New(mem, mem, inventory.New(mem, mem),\n\t\tpricing.New(mem, 2000),\n\t\tshipping.New(mem, shipping.DefaultZones()...),\n\t\tlog,\n\t\tnotify.New(notify.NewRecorder()),\n\t)\n\treturn svc, mem, log\n}\n\nfunc oraclePlaceRequest(id, country string, lines ...RequestLine) PlaceRequest {\n\treturn PlaceRequest{OrderID: domain.OrderID(id), CustomerID: \"c1\", Currency: domain.GBP, CountryCode: country, Lines: lines}\n}\n\nfunc oracleHasAction(t *testing.T, log *audit.MemoryLog, action, subject string) bool {\n\tt.Helper()\n\tevs, err := log.Since(context.Background(), time.Time{})\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tfor _, ev := range evs {\n\t\tif ev.Action == action && ev.Subject == subject {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}\n\nfunc TestOraclePlaceRefusesPerishableAbroad(t *testing.T) {\n\tcases := []struct {\n\t\tid, country string\n\t\tlines       []RequestLine\n\t}{\n\t\t{\"o-fr\", \"FR\", []RequestLine{{SKU: oracleSKUPerishable, Quantity: 1}}},\n\t\t{\"o-us\", \"us\", []RequestLine{{SKU: oracleSKUPerishable, Quantity: 2}}},\n\t\t{\"o-de-mixed\", \"DE\", []RequestLine{{SKU: oracleSKUGeneral, Quantity: 1}, {SKU: oracleSKUPerishable, Quantity: 1}}},\n\t}\n\tfor _, c := range cases {\n\t\tsvc, mem, log := oracleService(t)\n\t\tctx := context.Background()\n\t\t_, _, err := svc.Place(ctx, oraclePlaceRequest(c.id, c.country, c.lines...))\n\t\tif err == nil {\n\t\t\tt.Fatalf(\"%s: order of perishable goods to %s was accepted\", c.id, c.country)\n\t\t}\n\t\tif !errors.Is(err, shipping.ErrNoCarrier) {\n\t\t\tt.Fatalf(\"%s: got %v, want an error that errors.Is shipping.ErrNoCarrier\", c.id, err)\n\t\t}\n\t\tif errors.Is(err, shipping.ErrNoZone) {\n\t\t\tt.Fatalf(\"%s: got %v; the destination is served, so it must not be ErrNoZone\", c.id, err)\n\t\t}\n\t\tif _, err := mem.GetOrder(ctx, domain.OrderID(c.id)); !errors.Is(err, store.ErrNotFound) {\n\t\t\tt.Fatalf(\"%s: refused order was stored (GetOrder err = %v)\", c.id, err)\n\t\t}\n\t\tif oracleHasAction(t, log, \"order.placed\", c.id) {\n\t\t\tt.Fatalf(\"%s: refused order was audited as placed\", c.id)\n\t\t}\n\t}\n}\n\nfunc TestOraclePlaceAcceptsPerishableDomestically(t *testing.T) {\n\tsvc, mem, _ := oracleService(t)\n\tctx := context.Background()\n\torder, breakdown, err := svc.Place(ctx, oraclePlaceRequest(\"o-gb\", \"GB\",\n\t\tRequestLine{SKU: oracleSKUPerishable, Quantity: 3}))\n\tif err != nil {\n\t\tt.Fatalf(\"domestic perishable order refused: %v\", err)\n\t}\n\tif order.ShippingZone != \"domestic\" || order.State != domain.StateReserved {\n\t\tt.Fatalf(\"order zone %q state %s, want domestic/reserved\", order.ShippingZone, order.State)\n\t}\n\t// 1200g -> 2kg: 395 + 200\n\tif breakdown.Shipping.Minor != 595 {\n\t\tt.Fatalf(\"shipping = %v, want 5.95 GBP\", breakdown.Shipping)\n\t}\n\t// subtotal 1500 + shipping 595 = 2095, tax 419, total 2514\n\tif breakdown.Total.Minor != 2514 {\n\t\tt.Fatalf(\"total = %v, want 25.14 GBP\", breakdown.Total)\n\t}\n\tif _, err := mem.GetOrder(ctx, \"o-gb\"); err != nil {\n\t\tt.Fatalf(\"domestic order not stored: %v\", err)\n\t}\n}\n\nfunc TestOraclePlaceNonPerishableAbroadUnchanged(t *testing.T) {\n\tsvc, _, _ := oracleService(t)\n\t_, breakdown, err := svc.Place(context.Background(), oraclePlaceRequest(\"o-fr-gen\", \"FR\",\n\t\tRequestLine{SKU: oracleSKUGeneral, Quantity: 2}))\n\tif err != nil {\n\t\tt.Fatalf(\"general goods to FR refused: %v\", err)\n\t}\n\t// 1400g -> 2kg: 995 + 500\n\tif breakdown.Shipping.Minor != 1495 {\n\t\tt.Fatalf(\"shipping = %v, want 14.95 GBP\", breakdown.Shipping)\n\t}\n}\n\nfunc TestOraclePlaceUnknownCountryStillNoZone(t *testing.T) {\n\tsvc, _, _ := oracleService(t)\n\t_, _, err := svc.Place(context.Background(), oraclePlaceRequest(\"o-xx\", \"XX\",\n\t\tRequestLine{SKU: oracleSKUPerishable, Quantity: 1}))\n\tif !errors.Is(err, shipping.ErrNoZone) {\n\t\tt.Fatalf(\"got %v, want shipping.ErrNoZone\", err)\n\t}\n}\n"
   },
   "argv": [
    "go",
    "test",
    "-count=1",
    "-run",
    "^TestOracle",
    "./internal/orders"
   ],
   "timeout_seconds": 300
