   "id": "authored-internal-shipping",
   "files": {
    "internal/shipping/oracle_perishable_test.go": "package shipping\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"testing\"\n\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/store\"\n)\n\nconst (\n\toracleSKUPerishable domain.SKU = \"PR-1001\"\n\toracleSKUGeneral    domain.SKU = \"GN-2001\"\n\toracleSKUHazardous  domain.SKU = \"HZ-3001\"\n\toracleSKUFragile    domain.SKU = \"FR-4001\"\n\toracleSKUOversized  domain.SKU = \"OV-5001\"\n)\n\nfunc oracleCatalogue(t *testing.T) *store.Memory {\n\tt.Helper()\n\tmem := store.NewMemory()\n\tctx := context.Background()\n\titems := []domain.Item{\n\t\t{SKU: oracleSKUPerishable, Name: \"Chilled cheese\", Category: domain.CategoryPerishable,\n\t\t\tUnitPrice: domain.NewMoney(500, domain.GBP), WeightGram: 400,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 100}},\n\t\t{SKU: oracleSKUGeneral, Name: \"Widget\", Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(1000, domain.GBP), WeightGram: 700,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 50}},\n\t\t{SKU: oracleSKUHazardous, Name: \"Solvent\", Category: domain.CategoryHazardous,\n\t\t\tUnitPrice: domain.NewMoney(800, domain.GBP), WeightGram: 1000,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 100, WidthMM: 100, HeightMM: 200}},\n\t\t{SKU: oracleSKUFragile, Name: \"Vase\", Category: domain.CategoryFragile,\n\t\t\tUnitPrice: domain.NewMoney(2500, domain.GBP), WeightGram: 1500,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 200, WidthMM: 200, HeightMM: 300}},\n\t\t{SKU: oracleSKUOversized, Name: \"Sofa\", Category: domain.CategoryOversized,\n\t\t\tUnitPrice: domain.NewMoney(50000, domain.GBP), WeightGram: 40000,\n\t\t\tDimensions: domain.Dimensions{LengthMM: 2000, WidthMM: 900, HeightMM: 800}},\n\t}\n\tfor _, it := range items {\n\t\tif err := mem.PutItem(ctx, it); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\treturn mem\n}\n\nfunc oracleOrder(zone string, lines ...domain.OrderLine) domain.Order {\n\treturn domain.Order{ID: \"oracle-1\", Currency: domain.GBP, ShippingZone: zone, Lines: lines}\n}\n\nfunc oracleLine(sku domain.SKU, qty int, unitMinor int64) domain.OrderLine {\n\treturn domain.OrderLine{SKU: sku, Quantity: qty, UnitPrice: domain.NewMoney(unitMinor, domain.GBP)}\n}\n\nfunc oracleZone(t *testing.T, s *Service, country string) Zone {\n\tt.Helper()\n\tz, err := s.ZoneFor(country)\n\tif err != nil {\n\t\tt.Fatalf(\"ZoneFor(%q): %v\", country, err)\n\t}\n\treturn z\n}\n\n// oracleRefusedAsNoCarrier checks the refusal is one the API boundary already\n// knows how to explain to the customer (409 \"no carrier\"), and not the\n// misleading \"we do not ship there\".\nfunc oracleRefusedAsNoCarrier(t *testing.T, what string, err error) {\n\tt.Helper()\n\tif err == nil {\n\t\tt.Fatalf(\"%s: perishable goods outside the refrigerated domestic network were accepted\", what)\n\t}\n\tif !errors.Is(err, ErrNoCarrier) {\n\t\tt.Fatalf(\"%s: got %v; want an error that errors.Is ErrNoCarrier so the API maps it to a clear refusal rather than a 500\", what, err)\n\t}\n\tif errors.Is(err, ErrNoZone) {\n\t\tt.Fatalf(\"%s: got %v; the destination is served, so this must not be reported as ErrNoZone\", what, err)\n\t}\n}\n\nfunc TestOracleRateRefusesPerishableOutsideDomestic(t *testing.T) {\n\ts := New(store.NewMemory(), DefaultZones()...)\n\tfor _, country := range []string{\"FR\", \"DE\", \"IE\", \"US\", \"JP\", \"AU\"} {\n\t\tz := oracleZone(t, s, country)\n\t\t_, err := s.Rate(z, Parcel{WeightGram: 400, ContainsPerishable: true}, domain.GBP)\n\t\toracleRefusedAsNoCarrier(t, \"Rate to \"+country, err)\n\t}\n}\n\nfunc TestOracleRateAcceptsPerishableDomestically(t *testing.T) {\n\ts := New(store.NewMemory(), DefaultZones()...)\n\tz := oracleZone(t, s, \"GB\")\n\tgot, err := s.Rate(z, Parcel{WeightGram: 1200, ContainsPerishable: true}, domain.GBP)\n\tif err != nil {\n\t\tt.Fatalf(\"domestic perishable refused: %v\", err)\n\t}\n\t// base 395 + 2kg at 100, same as any other domestic parcel\n\tif got.Minor != 595 || got.Currency != domain.GBP {\n\t\tt.Fatalf(\"rate = %v, want 5.95 GBP\", got)\n\t}\n}\n\nfunc TestOracleRateAcceptsPerishableAndSpecialDomestically(t *testing.T) {\n\ts := New(store.NewMemory(), DefaultZones()...)\n\tz := oracleZone(t, s, \"GB\")\n\tgot, err := s.Rate(z, Parcel{WeightGram: 500, ContainsPerishable: true, RequiresSpecial: true}, domain.GBP)\n\tif err != nil {\n\t\tt.Fatalf(\"domestic perishable+special refused: %v\", err)\n\t}\n\tif got.Minor != 495 {\n\t\tt.Fatalf(\"rate = %d, want 495\", got.Minor)\n\t}\n}\n\nfunc TestOracleRatePerishableAndSpecialAbroadStillRefused(t *testing.T) {\n\ts := New(store.NewMemory(), DefaultZones()...)\n\tz := oracleZone(t, s, \"FR\")\n\t_, err := s.Rate(z, Parcel{WeightGram: 500, ContainsPerishable: true, RequiresSpecial: true}, domain.GBP)\n\toracleRefusedAsNoCarrier(t, \"Rate perishable+special to FR\", err)\n}\n\n// Special handling is not refrigeration: a foreign zone whose carriers take\n// hazardous goods still cannot keep chilled goods cold.\nfunc TestOracleSpecialHandlingZoneIsNotRefrigerated(t *testing.T) {\n\tabroad := Zone{Name: \"eu-special\", CountryCodes: []string{\"FR\"}, BaseRateMinor: 995, PerKgMinor: 250, SpecialHandling: true}\n\ts := New(store.NewMemory(), append(DefaultZones()[:1:1], abroad)...)\n\tz := oracleZone(t, s, \"FR\")\n\tif !z.SpecialHandling {\n\t\tt.Fatal(\"test setup: expected the special-handling zone\")\n\t}\n\tif _, err := s.Rate(z, Parcel{WeightGram: 500, RequiresSpecial: true}, domain.GBP); err != nil {\n\t\tt.Fatalf(\"special-handling zone refused a hazardous parcel: %v\", err)\n\t}\n\t_, err := s.Rate(z, Parcel{WeightGram: 500, ContainsPerishable: true}, domain.GBP)\n\toracleRefusedAsNoCarrier(t, \"Rate perishable to special-handling foreign zone\", err)\n}\n\nfunc TestOracleQuoteRefusesPerishableAbroad(t *testing.T) {\n\tmem := oracleCatalogue(t)\n\ts := New(mem, DefaultZones()...)\n\tctx := context.Background()\n\tfor _, zone := range []string{\"eu\", \"world\"} {\n\t\t_, err := s.Quote(ctx, oracleOrder(zone, oracleLine(oracleSKUPerishable, 1, 500)))\n\t\toracleRefusedAsNoCarrier(t, \"Quote perishable to \"+zone, err)\n\t}\n}\n\nfunc TestOracleQuoteRefusesMixedOrderContainingPerishableAbroad(t *testing.T) {\n\tmem := oracleCatalogue(t)\n\ts := New(mem, DefaultZones()...)\n\tctx := context.Background()\n\torders := []domain.Order{\n\t\toracleOrder(\"eu\", oracleLine(oracleSKUGeneral, 3, 1000), oracleLine(oracleSKUPerishable, 1, 500)),\n\t\toracleOrder(\"world\", oracleLine(oracleSKUFragile, 1, 2500), oracleLine(oracleSKUPerishable, 2, 500), oracleLine(oracleSKUGeneral, 1, 1000)),\n\t\toracleOrder(\"eu\", oracleLine(oracleSKUPerishable, 1, 500), oracleLine(oracleSKUHazardous, 1, 800)),\n\t}\n\tfor i, o := range orders {\n\t\t_, err := s.Quote(ctx, o)\n\t\toracleRefusedAsNoCarrier(t, \"mixed order \"+string(rune('A'+i)), err)\n\t}\n}\n\nfunc TestOracleQuoteAcceptsPerishableDomestically(t *testing.T) {\n\tmem := oracleCatalogue(t)\n\ts := New(mem, DefaultZones()...)\n\t// 3 x 400g + 700g = 1900g -> 2kg: 395 + 200\n\tgot, err := s.Quote(context.Background(),\n\t\toracleOrder(\"domestic\", oracleLine(oracleSKUPerishable, 3, 500), oracleLine(oracleSKUGeneral, 1, 1000)))\n\tif err != nil {\n\t\tt.Fatalf(\"domestic perishable quote refused: %v\", err)\n\t}\n\tif got.Minor != 595 || got.Currency != domain.GBP {\n\t\tt.Fatalf(\"quote = %v, want 5.95 GBP\", got)\n\t}\n}\n\n// Existing behaviour the change must not disturb.\n\nfunc TestOracleQuoteNonPerishableAbroadUnchanged(t *testing.T) {\n\tmem := oracleCatalogue(t)\n\ts := New(mem, DefaultZones()...)\n\tctx := context.Background()\n\tcases := []struct {\n\t\tzone  string\n\t\torder domain.Order\n\t\twant  int64\n\t}{\n\t\t// 700g -> 1kg\n\t\t{\"eu\", oracleOrder(\"eu\", oracleLine(oracleSKUGeneral, 1, 1000)), 995 + 250},\n\t\t// 1500g + 1400g = 2900g -> 3kg\n\t\t{\"eu\", oracleOrder(\"eu\", oracleLine(oracleSKUFragile, 1, 2500), oracleLine(oracleSKUGeneral, 2, 1000)), 995 + 3*250},\n\t\t// 2100g -> 3kg\n\t\t{\"world\", oracleOrder(\"world\", oracleLine(oracleSKUGeneral, 3, 1000)), 1995 + 3*600},\n\t\t{\"domestic\", oracleOrder(\"domestic\", oracleLine(oracleSKUHazardous, 2, 800)), 395 + 2*100},\n\t}\n\tfor _, c := range cases {\n\t\tgot, err := s.Quote(ctx, c.order)\n\t\tif err != nil {\n\t\t\tt.Fatalf(\"%s: unexpected refusal: %v\", c.zone, err)\n\t\t}\n\t\tif got.Minor != c.want || got.Currency != domain.GBP {\n\t\t\tt.Fatalf(\"%s: quote = %v, want %d GBP minor\", c.zone, got, c.want)\n\t\t}\n\t}\n}\n\nfunc TestOracleSpecialHandlingAbroadStillRefused(t *testing.T) {\n\tmem := oracleCatalogue(t)\n\ts := New(mem, DefaultZones()...)\n\tctx := context.Background()\n\tfor _, sku := range []domain.SKU{oracleSKUHazardous, oracleSKUOversized} {\n\t\tfor _, zone := range []string{\"eu\", \"world\"} {\n\t\t\t_, err := s.Quote(ctx, oracleOrder(zone, oracleLine(sku, 1, 100)))\n\t\t\tif !errors.Is(err, ErrNoCarrier) {\n\t\t\t\tt.Fatalf(\"%s to %s: got %v, want ErrNoCarrier\", sku, zone, err)\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc TestOracleQuoteUnknownZoneStillNoZone(t *testing.T) {\n\tmem := oracleCatalogue(t)\n\ts := New(mem, DefaultZones()...)\n\t_, err := s.Quote(context.Background(), oracleOrder(\"mars\", oracleLine(oracleSKUPerishable, 1, 500)))\n\tif !errors.Is(err, ErrNoZone) {\n\t\tt.Fatalf(\"got %v, want ErrNoZone\", err)\n\t}\n}\n\nfunc TestOracleQuoteMissingItemStillNotFound(t *testing.T) {\n\tmem := oracleCatalogue(t)\n\ts := New(mem, DefaultZones()...)\n\t_, err := s.Quote(context.Background(), oracleOrder(\"eu\", oracleLine(\"ZZ-9999\", 1, 500)))\n\tif !errors.Is(err, store.ErrNotFound) {\n\t\tt.Fatalf(\"got %v, want store.ErrNotFound\", err)\n\t}\n}\n\nfunc TestOracleParcelForFlagsPerishable(t *testing.T) {\n\tmem := oracleCatalogue(t)\n\ts := New(mem, DefaultZones()...)\n\tctx := context.Background()\n\tp, err := s.ParcelFor(ctx, oracleOrder(\"eu\", oracleLine(oracleSKUGeneral, 1, 1000), oracleLine(oracleSKUPerishable, 2, 500)))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif !p.ContainsPerishable {\n\t\tt.Fatal(\"parcel with a perishable line not flagged ContainsPerishable\")\n\t}\n\tif p.WeightGram != 1500 {\n\t\tt.Fatalf(\"weight = %d, want 1500\", p.WeightGram)\n\t}\n\tif p.DeclaredValue.Minor != 2000 || p.DeclaredValue.Currency != domain.GBP {\n\t\tt.Fatalf(\"declared value = %v, want 20.00 GBP\", p.DeclaredValue)\n\t}\n\tp, err = s.ParcelFor(ctx, oracleOrder(\"eu\", oracleLine(oracleSKUGeneral, 1, 1000), oracleLine(oracleSKUFragile, 1, 2500)))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif p.ContainsPerishable {\n\t\tt.Fatal(\"parcel without perishable lines flagged ContainsPerishable\")\n\t}\n\tif p.RequiresSpecial {\n\t\tt.Fatal(\"general+fragile parcel flagged RequiresSpecial\")\n\t}\n}\n\nfunc TestOracleDefaultZonesUnchanged(t *testing.T) {\n\ts := New(store.NewMemory(), DefaultZones()...)\n\tcases := map[string]struct {\n\t\tzone    string\n\t\tbase    int64\n\t\tperKg   int64\n\t\tspecial bool\n\t}{\n\t\t\"GB\": {\"domestic\", 395, 100, true},\n\t\t\"ie\": {\"eu\", 995, 250, false},\n\t\t\"FR\": {\"eu\", 995, 250, false},\n\t\t\"IT\": {\"eu\", 995, 250, false},\n\t\t\"US\": {\"world\", 1995, 600, false},\n\t\t\"NZ\": {\"world\", 1995, 600, false},\n\t}\n\tfor country, want := range cases {\n\t\tz := oracleZone(t, s, country)\n\t\tif z.Name != want.zone || z.BaseRateMinor != want.base || z.PerKgMinor != want.perKg || z.SpecialHandling != want.special {\n\t\t\tt.Fatalf(\"%s: zone %+v, want %+v\", country, z, want)\n\t\t}\n\t\tbyName, err := s.ZoneByName(want.zone)\n\t\tif err != nil || byName.Name != want.zone {\n\t\t\tt.Fatalf(\"ZoneByName(%q) = %+v, %v\", want.zone, byName, err)\n\t\t}\n\t}\n\tif _, err := s.ZoneFor(\"BR\"); !errors.Is(err, ErrNoZone) {\n\t\tt.Fatalf(\"BR: got %v, want ErrNoZone\", err)\n\t}\n}\n"
