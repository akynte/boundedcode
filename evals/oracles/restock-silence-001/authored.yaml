    "internal/worker/oracle_restock_test.go": "package worker\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"fmt\"\n\t\"sort\"\n\t\"strings\"\n\t\"testing\"\n\t\"time\"\n\n\t\"example.com/warehouse/internal/audit\"\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/inventory\"\n\t\"example.com/warehouse/internal/store\"\n)\n\n// Neither error mentions a SKU, so any SKU in a returned error was put there\n// by the code under test.\nvar (\n\toracleErrAuditDown = errors.New(\"audit sink unavailable\")\n\toracleErrItemsDown = errors.New(\"catalogue unavailable\")\n\toracleErrStockDown = errors.New(\"stock table unavailable\")\n)\n\n// oracleAudit is an audit log that refuses to record chosen subjects.\ntype oracleAudit struct {\n\t*audit.MemoryLog\n\tfailSubjects map[string]bool\n\tfailAll      bool\n}\n\nfunc oracleNewAudit() *oracleAudit {\n\treturn &oracleAudit{MemoryLog: audit.NewMemoryLog(), failSubjects: map[string]bool{}}\n}\n\nfunc (o *oracleAudit) Record(ctx context.Context, ev audit.Event) error {\n\tif o.failAll || o.failSubjects[ev.Subject] {\n\t\treturn oracleErrAuditDown\n\t}\n\treturn o.MemoryLog.Record(ctx, ev)\n}\n\n// oracleItems fails item lookups for chosen SKUs.\ntype oracleItems struct {\n\t*store.Memory\n\tfail map[domain.SKU]error\n}\n\nfunc (o *oracleItems) GetItem(ctx context.Context, sku domain.SKU) (domain.Item, error) {\n\tif err, ok := o.fail[sku]; ok {\n\t\treturn domain.Item{}, err\n\t}\n\treturn o.Memory.GetItem(ctx, sku)\n}\n\n// oracleStock can fail ListStock.\ntype oracleStock struct {\n\t*store.Memory\n\tlistErr error\n}\n\nfunc (o *oracleStock) ListStock(ctx context.Context) ([]store.Stock, error) {\n\tif o.listErr != nil {\n\t\treturn nil, o.listErr\n\t}\n\treturn o.Memory.ListStock(ctx)\n}\n\ntype oracleRow struct {\n\tsku          domain.SKU\n\tonHand       int\n\tdiscontinued bool\n}\n\nfunc oracleSeed(t *testing.T, rows ...oracleRow) *store.Memory {\n\tt.Helper()\n\tmem := store.NewMemory()\n\tctx := context.Background()\n\tfor _, r := range rows {\n\t\titem := domain.Item{\n\t\t\tSKU: r.sku, Name: \"Part \" + string(r.sku), Category: domain.CategoryGeneral,\n\t\t\tUnitPrice: domain.NewMoney(500, domain.GBP), WeightGram: 100,\n\t\t\tDiscontinued: r.discontinued,\n\t\t}\n\t\tif err := mem.PutItem(ctx, item); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif err := mem.PutStock(ctx, store.Stock{SKU: r.sku, OnHand: r.onHand}); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\treturn mem\n}\n\n// oracleNeeded returns the subjects of recorded restock.needed events, sorted.\nfunc oracleNeeded(t *testing.T, log audit.Log) []string {\n\tt.Helper()\n\tevents, err := log.Since(context.Background(), time.Time{})\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tvar out []string\n\tfor _, ev := range events {\n\t\tif ev.Action == \"restock.needed\" {\n\t\t\tout = append(out, ev.Subject)\n\t\t}\n\t}\n\tsort.Strings(out)\n\treturn out\n}\n\nfunc oracleHas(list []string, want string) bool {\n\tfor _, s := range list {\n\t\tif s == want {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}\n\n// Existing behaviour: one restock.needed event per SKU below threshold, with\n// the documented shape, and the count returned.\nfunc TestOracleRestockRecordsEachNeededSKU(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0002\", onHand: 3},\n\t\toracleRow{sku: \"AA-0003\", onHand: 20},\n\t\toracleRow{sku: \"AA-0004\", onHand: 5},\n\t)\n\tlog := audit.NewMemoryLog()\n\tw := NewRestockWatcher(inventory.New(mem, mem), log, 5)\n\n\tn, err := w.RunOnce(context.Background())\n\tif err != nil {\n\t\tt.Fatalf(\"RunOnce: unexpected error %v\", err)\n\t}\n\tif n != 2 {\n\t\tt.Fatalf(\"RunOnce = %d, want 2\", n)\n\t}\n\n\tevents, err := log.Since(context.Background(), time.Time{})\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tseen := map[string]int{}\n\tfor _, ev := range events {\n\t\tif ev.Action != \"restock.needed\" {\n\t\t\tcontinue\n\t\t}\n\t\tseen[ev.Subject]++\n\t\tif ev.Actor != \"restock\" {\n\t\t\tt.Errorf(\"event for %s has actor %q, want \\\"restock\\\"\", ev.Subject, ev.Actor)\n\t\t}\n\t\tif got := ev.Detail[\"threshold\"]; got != \"5\" {\n\t\t\tt.Errorf(\"event for %s has threshold %q, want \\\"5\\\"\", ev.Subject, got)\n\t\t}\n\t}\n\twant := map[string]int{\"AA-0001\": 1, \"AA-0002\": 1}\n\tif fmt.Sprint(seen) != fmt.Sprint(want) {\n\t\tt.Fatalf(\"restock.needed events by subject = %v, want %v\", seen, want)\n\t}\n}\n\nfunc TestOracleRestockNothingNeeded(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 50},\n\t\toracleRow{sku: \"AA-0002\", onHand: 0, discontinued: true},\n\t)\n\tlog := audit.NewMemoryLog()\n\tw := NewRestockWatcher(inventory.New(mem, mem), log, 5)\n\n\tn, err := w.RunOnce(context.Background())\n\tif err != nil {\n\t\tt.Fatalf(\"RunOnce: unexpected error %v\", err)\n\t}\n\tif n != 0 {\n\t\tt.Fatalf(\"RunOnce = %d, want 0\", n)\n\t}\n\tif got := oracleNeeded(t, log); len(got) != 0 {\n\t\tt.Fatalf(\"restock.needed recorded for %v, want none\", got)\n\t}\n}\n\nfunc TestOracleRestockStockListFailure(t *testing.T) {\n\tmem := oracleSeed(t, oracleRow{sku: \"AA-0001\", onHand: 1})\n\tinv := inventory.New(&oracleStock{Memory: mem, listErr: oracleErrStockDown}, mem)\n\tw := NewRestockWatcher(inv, audit.NewMemoryLog(), 5)\n\n\tif n, err := w.RunOnce(context.Background()); err == nil {\n\t\tt.Fatalf(\"RunOnce = %d, nil error although stock could not be listed\", n)\n\t}\n}\n\n// The change: an alert the audit log refused is not an alert anyone received,\n// so the pass must not report success.\nfunc TestOracleRestockAuditFailureIsReported(t *testing.T) {\n\tmem := oracleSeed(t, oracleRow{sku: \"AA-0001\", onHand: 1})\n\tlog := oracleNewAudit()\n\tlog.failAll = true\n\tw := NewRestockWatcher(inventory.New(mem, mem), log, 5)\n\n\tn, err := w.RunOnce(context.Background())\n\tif err == nil {\n\t\tt.Fatalf(\"RunOnce = %d, nil error although no alert could be recorded\", n)\n\t}\n}\n\nfunc TestOracleRestockPartialAuditFailureIsReported(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0002\", onHand: 2},\n\t\toracleRow{sku: \"AA-0003\", onHand: 3},\n\t)\n\tlog := oracleNewAudit()\n\tlog.failSubjects[\"AA-0002\"] = true\n\tw := NewRestockWatcher(inventory.New(mem, mem), log, 5)\n\n\tn, err := w.RunOnce(context.Background())\n\tif err == nil {\n\t\tt.Fatalf(\"RunOnce = %d, nil error although the alert for AA-0002 was not recorded\", n)\n\t}\n}\n\n// One refused alert must not stop the others being raised; before the change\n// they all were attempted.\nfunc TestOracleRestockAuditFailureDoesNotSuppressOtherAlerts(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0002\", onHand: 2},\n\t\toracleRow{sku: \"AA-0003\", onHand: 3},\n\t)\n\tlog := oracleNewAudit()\n\tlog.failSubjects[\"AA-0001\"] = true\n\tw := NewRestockWatcher(inventory.New(mem, mem), log, 5)\n\n\t_, _ = w.RunOnce(context.Background())\n\tgot := oracleNeeded(t, log.MemoryLog)\n\tfor _, sku := range []string{\"AA-0002\", \"AA-0003\"} {\n\t\tif !oracleHas(got, sku) {\n\t\t\tt.Errorf(\"no restock.needed recorded for %s after the alert for AA-0001 failed; recorded %v\", sku, got)\n\t\t}\n\t}\n}\n\n// The error ends up in the service log; it has to say which SKU's alert was\n// lost, or we are back to not knowing.\nfunc TestOracleRestockAuditFailureNamesSKU(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0002\", onHand: 2},\n\t)\n\tlog := oracleNewAudit()\n\tlog.failSubjects[\"AA-0002\"] = true\n\tw := NewRestockWatcher(inventory.New(mem, mem), log, 5)\n\n\t_, err := w.RunOnce(context.Background())\n\tif err == nil {\n\t\tt.Fatal(\"RunOnce: nil error although the alert for AA-0002 was not recorded\")\n\t}\n\tif !strings.Contains(err.Error(), \"AA-0002\") {\n\t\tt.Fatalf(\"error %q does not name AA-0002, whose alert was lost\", err)\n\t}\n}\n\n// The change: a SKU whose catalogue entry cannot be read might need\n// reordering; the pass must not report success as though it did not.\nfunc TestOracleRestockItemLookupFailureIsReported(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0002\", onHand: 0},\n\t)\n\titems := &oracleItems{Memory: mem, fail: map[domain.SKU]error{\"AA-0002\": oracleErrItemsDown}}\n\tw := NewRestockWatcher(inventory.New(mem, items), audit.NewMemoryLog(), 5)\n\n\tn, err := w.RunOnce(context.Background())\n\tif err == nil {\n\t\tt.Fatalf(\"RunOnce = %d, nil error although AA-0002 could not be checked\", n)\n\t}\n}\n\nfunc TestOracleRestockItemLookupFailureOnlySKUIsReported(t *testing.T) {\n\tmem := oracleSeed(t, oracleRow{sku: \"AA-0002\", onHand: 0})\n\titems := &oracleItems{Memory: mem, fail: map[domain.SKU]error{\"AA-0002\": oracleErrItemsDown}}\n\tw := NewRestockWatcher(inventory.New(mem, items), audit.NewMemoryLog(), 5)\n\n\tn, err := w.RunOnce(context.Background())\n\tif err == nil {\n\t\tt.Fatalf(\"RunOnce = %d, nil error; \\\"nothing to reorder\\\" reported when AA-0002 could not be checked\", n)\n\t}\n}\n\nfunc TestOracleRestockItemLookupFailureNamesSKU(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0002\", onHand: 0},\n\t)\n\titems := &oracleItems{Memory: mem, fail: map[domain.SKU]error{\"AA-0002\": oracleErrItemsDown}}\n\tw := NewRestockWatcher(inventory.New(mem, items), audit.NewMemoryLog(), 5)\n\n\t_, err := w.RunOnce(context.Background())\n\tif err == nil {\n\t\tt.Fatal(\"RunOnce: nil error although AA-0002 could not be checked\")\n\t}\n\tif !strings.Contains(err.Error(), \"AA-0002\") {\n\t\tt.Fatalf(\"error %q does not name AA-0002, which could not be checked\", err)\n\t}\n}\n\n// One unreadable catalogue entry must not stop the SKUs we can decide about\n// from being alerted; before the change they were.\nfunc TestOracleRestockItemLookupFailureDoesNotSuppressOtherAlerts(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0002\", onHand: 0},\n\t\toracleRow{sku: \"AA-0003\", onHand: 4},\n\t)\n\titems := &oracleItems{Memory: mem, fail: map[domain.SKU]error{\"AA-0002\": oracleErrItemsDown}}\n\tlog := audit.NewMemoryLog()\n\tw := NewRestockWatcher(inventory.New(mem, items), log, 5)\n\n\t_, _ = w.RunOnce(context.Background())\n\tgot := oracleNeeded(t, log)\n\tfor _, sku := range []string{\"AA-0001\", \"AA-0003\"} {\n\t\tif !oracleHas(got, sku) {\n\t\t\tt.Errorf(\"no restock.needed recorded for %s after AA-0002 could not be checked; recorded %v\", sku, got)\n\t\t}\n\t}\n}\n\n// Discontinued stays a deliberate \"no\", not an unknown.\nfunc TestOracleRestockDiscontinuedIsNotAFailure(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 0, discontinued: true},\n\t\toracleRow{sku: \"AA-0002\", onHand: 1},\n\t)\n\tlog := audit.NewMemoryLog()\n\tw := NewRestockWatcher(inventory.New(mem, mem), log, 5)\n\n\tn, err := w.RunOnce(context.Background())\n\tif err != nil {\n\t\tt.Fatalf(\"RunOnce: unexpected error %v\", err)\n\t}\n\tif n != 1 {\n\t\tt.Fatalf(\"RunOnce = %d, want 1\", n)\n\t}\n\tif got := oracleNeeded(t, log); fmt.Sprint(got) != \"[AA-0002]\" {\n\t\tt.Fatalf(\"restock.needed recorded for %v, want [AA-0002]\", got)\n\t}\n}\n\n// A catalogue failure for a SKU that is comfortably stocked does not leave\n// anything undecided.\nfunc TestOracleRestockLookupFailureAboveThresholdIsNotAFailure(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0002\", onHand: 40},\n\t)\n\titems := &oracleItems{Memory: mem, fail: map[domain.SKU]error{\"AA-0002\": oracleErrItemsDown}}\n\tlog := audit.NewMemoryLog()\n\tw := NewRestockWatcher(inventory.New(mem, items), log, 5)\n\n\tn, err := w.RunOnce(context.Background())\n\tif err != nil {\n\t\tt.Fatalf(\"RunOnce: unexpected error %v\", err)\n\t}\n\tif n != 1 {\n\t\tt.Fatalf(\"RunOnce = %d, want 1\", n)\n\t}\n}\n"
   },
