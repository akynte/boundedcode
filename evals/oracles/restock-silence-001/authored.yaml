    "internal/inventory/oracle_reorder_test.go": "package inventory\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"sort\"\n\t\"strings\"\n\t\"testing\"\n\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/store\"\n)\n\n// oracleErrItemsDown is a transient catalogue failure. Its text deliberately\n// does not mention any SKU.\nvar oracleErrItemsDown = errors.New(\"catalogue unavailable\")\n\nvar oracleErrStockDown = errors.New(\"stock table unavailable\")\n\n// oracleItems wraps the memory store and fails item lookups for chosen SKUs.\ntype oracleItems struct {\n\t*store.Memory\n\tfail map[domain.SKU]error\n}\n\nfunc (o *oracleItems) GetItem(ctx context.Context, sku domain.SKU) (domain.Item, error) {\n\tif err, ok := o.fail[sku]; ok {\n\t\treturn domain.Item{}, err\n\t}\n\treturn o.Memory.GetItem(ctx, sku)\n}\n\n// oracleStock wraps the memory store and can fail ListStock.\ntype oracleStock struct {\n\t*store.Memory\n\tlistErr error\n}\n\nfunc (o *oracleStock) ListStock(ctx context.Context) ([]store.Stock, error) {\n\tif o.listErr != nil {\n\t\treturn nil, o.listErr\n\t}\n\treturn o.Memory.ListStock(ctx)\n}\n\ntype oracleRow struct {\n\tsku          domain.SKU\n\tonHand       int\n\treserved     int\n\tdiscontinued bool\n\tnoItem       bool\n}\n\nfunc oracleSeed(t *testing.T, rows ...oracleRow) *store.Memory {\n\tt.Helper()\n\tmem := store.NewMemory()\n\tctx := context.Background()\n\tfor _, r := range rows {\n\t\tif !r.noItem {\n\t\t\titem := domain.Item{\n\t\t\t\tSKU: r.sku, Name: \"Part \" + string(r.sku), Category: domain.CategoryGeneral,\n\t\t\t\tUnitPrice: domain.NewMoney(500, domain.GBP), WeightGram: 100,\n\t\t\t\tDiscontinued: r.discontinued,\n\t\t\t}\n\t\t\tif err := mem.PutItem(ctx, item); err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t}\n\t\tif err := mem.PutStock(ctx, store.Stock{SKU: r.sku, OnHand: r.onHand, Reserved: r.reserved}); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\treturn mem\n}\n\nfunc oracleSorted(skus []domain.SKU) []domain.SKU {\n\tout := append([]domain.SKU(nil), skus...)\n\tsort.Slice(out, func(a, b int) bool { return out[a] < out[b] })\n\treturn out\n}\n\nfunc oracleEqual(a, b []domain.SKU) bool {\n\ta, b = oracleSorted(a), oracleSorted(b)\n\tif len(a) != len(b) {\n\t\treturn false\n\t}\n\tfor i := range a {\n\t\tif a[i] != b[i] {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n\nfunc oracleContains(skus []domain.SKU, want domain.SKU) bool {\n\tfor _, s := range skus {\n\t\tif s == want {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}\n\n// Existing behaviour: below-threshold, orderable SKUs are listed; SKUs at or\n// above the threshold and discontinued SKUs are not, and none of that is an\n// error.\nfunc TestOracleReorderReportHealthyCatalogue(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 2},                     // below\n\t\toracleRow{sku: \"AA-0002\", onHand: 5},                     // exactly at threshold\n\t\toracleRow{sku: \"AA-0003\", onHand: 50},                    // well above\n\t\toracleRow{sku: \"AA-0004\", onHand: 9, reserved: 7},        // available 2: below\n\t\toracleRow{sku: \"AA-0005\", onHand: 1, discontinued: true}, // below but never reordered\n\t\toracleRow{sku: \"AA-0006\", onHand: 0},                     // empty\n\t)\n\tsvc := New(mem, mem)\n\n\tgot, err := svc.ReorderReport(context.Background(), 5)\n\tif err != nil {\n\t\tt.Fatalf(\"ReorderReport: unexpected error %v\", err)\n\t}\n\twant := []domain.SKU{\"AA-0001\", \"AA-0004\", \"AA-0006\"}\n\tif !oracleEqual(got, want) {\n\t\tt.Fatalf(\"ReorderReport = %v, want %v\", oracleSorted(got), want)\n\t}\n}\n\nfunc TestOracleReorderReportNothingBelowThreshold(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 10},\n\t\toracleRow{sku: \"AA-0002\", onHand: 1, discontinued: true},\n\t)\n\tsvc := New(mem, mem)\n\n\tgot, err := svc.ReorderReport(context.Background(), 5)\n\tif err != nil {\n\t\tt.Fatalf(\"ReorderReport: unexpected error %v\", err)\n\t}\n\tif len(got) != 0 {\n\t\tt.Fatalf(\"ReorderReport = %v, want none\", got)\n\t}\n}\n\n// Existing behaviour: a failure to list stock is an error.\nfunc TestOracleReorderReportListStockFailure(t *testing.T) {\n\tmem := oracleSeed(t, oracleRow{sku: \"AA-0001\", onHand: 1})\n\tsvc := New(&oracleStock{Memory: mem, listErr: oracleErrStockDown}, mem)\n\n\tgot, err := svc.ReorderReport(context.Background(), 5)\n\tif err == nil {\n\t\tt.Fatalf(\"ReorderReport returned %v with nil error although stock could not be listed\", got)\n\t}\n}\n\n// The change: when the catalogue cannot be read for a below-threshold SKU, we\n// cannot tell whether it needs reordering, and the report must not pass that\n// off as a complete answer.\nfunc TestOracleReorderReportItemLookupFailureIsAnError(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0002\", onHand: 2},\n\t)\n\titems := &oracleItems{Memory: mem, fail: map[domain.SKU]error{\"AA-0002\": oracleErrItemsDown}}\n\tsvc := New(mem, items)\n\n\tgot, err := svc.ReorderReport(context.Background(), 5)\n\tif err == nil {\n\t\tt.Fatalf(\"ReorderReport = %v with nil error, although AA-0002 could not be checked\", got)\n\t}\n}\n\nfunc TestOracleReorderReportItemLookupFailureOnlySKU(t *testing.T) {\n\tmem := oracleSeed(t, oracleRow{sku: \"AA-0001\", onHand: 0})\n\titems := &oracleItems{Memory: mem, fail: map[domain.SKU]error{\"AA-0001\": oracleErrItemsDown}}\n\tsvc := New(mem, items)\n\n\tgot, err := svc.ReorderReport(context.Background(), 5)\n\tif err == nil {\n\t\tt.Fatalf(\"ReorderReport = %v with nil error; an empty report must not mean \\\"could not check\\\"\", got)\n\t}\n}\n\n// The error should say which SKU could not be checked, so the log shows it.\nfunc TestOracleReorderReportItemLookupErrorNamesSKU(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0002\", onHand: 2},\n\t)\n\titems := &oracleItems{Memory: mem, fail: map[domain.SKU]error{\"AA-0002\": oracleErrItemsDown}}\n\tsvc := New(mem, items)\n\n\t_, err := svc.ReorderReport(context.Background(), 5)\n\tif err == nil {\n\t\tt.Fatal(\"ReorderReport: nil error although AA-0002 could not be checked\")\n\t}\n\tif !strings.Contains(err.Error(), \"AA-0002\") {\n\t\tt.Fatalf(\"error %q does not name the SKU that could not be checked\", err)\n\t}\n}\n\n// A stock row whose catalogue entry is missing is not known to be\n// discontinued, so it must not silently vanish from the report: either it is\n// flagged, or the report says it could not decide.\nfunc TestOracleReorderReportMissingItemNotSilentlyDropped(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0009\", onHand: 0, noItem: true},\n\t)\n\tsvc := New(mem, mem)\n\n\tgot, err := svc.ReorderReport(context.Background(), 5)\n\tif err == nil && !oracleContains(got, \"AA-0009\") {\n\t\tt.Fatalf(\"ReorderReport = %v, nil error: AA-0009 has no catalogue entry and was silently dropped\", got)\n\t}\n}\n\n// A SKU at or above the threshold does not need reordering whatever the\n// catalogue says, so a catalogue failure for it is not a reason to fail.\nfunc TestOracleReorderReportLookupFailureAboveThresholdIrrelevant(t *testing.T) {\n\tmem := oracleSeed(t,\n\t\toracleRow{sku: \"AA-0001\", onHand: 1},\n\t\toracleRow{sku: \"AA-0002\", onHand: 40},\n\t)\n\titems := &oracleItems{Memory: mem, fail: map[domain.SKU]error{\"AA-0002\": oracleErrItemsDown}}\n\tsvc := New(mem, items)\n\n\tgot, err := svc.ReorderReport(context.Background(), 5)\n\tif err != nil {\n\t\tt.Fatalf(\"ReorderReport: unexpected error %v for a SKU that is above threshold\", err)\n\t}\n\tif !oracleEqual(got, []domain.SKU{\"AA-0001\"}) {\n\t\tt.Fatalf(\"ReorderReport = %v, want [AA-0001]\", got)\n\t}\n}\n\n// Discontinued items remain a deliberate \"no\", not an unknown.\nfunc TestOracleReorderReportDiscontinuedIsNotAnError(t *testing.T) {\n\tmem := oracleSeed(t, oracleRow{sku: \"AA-0001\", onHand: 0, discontinued: true})\n\tsvc := New(mem, mem)\n\n\tgot, err := svc.ReorderReport(context.Background(), 5)\n\tif err != nil {\n\t\tt.Fatalf(\"ReorderReport: unexpected error %v for a discontinued SKU\", err)\n\t}\n\tif len(got) != 0 {\n\t\tt.Fatalf(\"ReorderReport = %v, want discontinued SKU excluded\", got)\n\t}\n}\n"
   },
   "argv": [
    "go",
    "test",
    "-count=1",
    "-run",
    "^TestOracle",
    "./internal/inventory"
