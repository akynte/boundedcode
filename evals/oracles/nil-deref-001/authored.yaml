   "id": "authored-internal-handler",
   "files": {
    "internal/handler/oracle_user_test.go": "package handler\n\nimport (\n\t\"net/http\"\n\t\"net/http/httptest\"\n\t\"strings\"\n\t\"testing\"\n\n\t\"example.com/shop/internal/service\"\n)\n\n// oracleServe routes GET /users/{id}/email to UserHandler.Email and converts a\n// panic into a test failure so the remaining tests still run.\nfunc oracleServe(t *testing.T, path string, users ...*service.User) *httptest.ResponseRecorder {\n\tt.Helper()\n\tstore := service.NewMemoryStore()\n\tfor _, u := range users {\n\t\tstore.Add(u)\n\t}\n\th := New(service.NewUserService(store))\n\n\tmux := http.NewServeMux()\n\tmux.HandleFunc(\"GET /users/{id}/email\", h.Email)\n\n\trec := httptest.NewRecorder()\n\treq := httptest.NewRequest(http.MethodGet, path, nil)\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\tt.Fatalf(\"GET %s panicked: %v\", path, r)\n\t\t}\n\t}()\n\tmux.ServeHTTP(rec, req)\n\treturn rec\n}\n\nfunc TestOracleHandlerEmailMissingUserIs404(t *testing.T) {\n\trec := oracleServe(t, \"/users/missing/email\", &service.User{ID: \"u1\", Email: \"a@example.com\"})\n\n\tif rec.Code != http.StatusNotFound {\n\t\tt.Fatalf(\"status = %d, want %d\", rec.Code, http.StatusNotFound)\n\t}\n\tif body := rec.Body.String(); !strings.Contains(body, service.ErrNotFound.Error()) {\n\t\tt.Fatalf(\"body = %q, want it to contain %q\", body, service.ErrNotFound.Error())\n\t}\n\tif strings.Contains(rec.Body.String(), \"a@example.com\") {\n\t\tt.Fatalf(\"body %q leaks another user's email\", rec.Body.String())\n\t}\n}\n\nfunc TestOracleHandlerEmailFoundIs200(t *testing.T) {\n\trec := oracleServe(t, \"/users/u1/email\", &service.User{ID: \"u1\", Email: \"a@example.com\"})\n\n\tif rec.Code != http.StatusOK {\n\t\tt.Fatalf(\"status = %d, want %d\", rec.Code, http.StatusOK)\n\t}\n\tif got := rec.Body.String(); got != \"a@example.com\" {\n\t\tt.Fatalf(\"body = %q, want %q\", got, \"a@example.com\")\n\t}\n}\n"
   },
   "argv": [
    "go",
    "test",
    "-count=1",
    "-run",
    "^TestOracle",
    "./internal/handler"
