   "id": "authored-internal-pricing",
   "files": {
    "internal/pricing/oracle_nonnegative_test.go": "package pricing\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"fmt\"\n\t\"math/rand\"\n\t\"testing\"\n\n\t\"example.com/warehouse/internal/domain\"\n\t\"example.com/warehouse/internal/store\"\n)\n\n// oracleFixedRule always offers the same amount, regardless of the order.\ntype oracleFixedRule struct {\n\tname   string\n\tamount domain.Money\n}\n\nfunc (r oracleFixedRule) Name() string { return r.name }\n\nfunc (r oracleFixedRule) Discount(context.Context, domain.Order, domain.Money) (domain.Money, error) {\n\treturn r.amount, nil\n}\n\n// oracleFailingRule always fails.\ntype oracleFailingRule struct{ err error }\n\nfunc (r oracleFailingRule) Name() string { return \"failing\" }\n\nfunc (r oracleFailingRule) Discount(context.Context, domain.Order, domain.Money) (domain.Money, error) {\n\treturn domain.Money{}, r.err\n}\n\nfunc oracleOrder(customer string, units int, unitMinor int64) domain.Order {\n\treturn domain.Order{\n\t\tID: \"o-oracle\", CustomerID: customer, Currency: domain.GBP,\n\t\tLines: []domain.OrderLine{{\n\t\t\tSKU: \"AB-1234\", Quantity: units, UnitPrice: domain.NewMoney(unitMinor, domain.GBP),\n\t\t}},\n\t}\n}\n\nfunc oracleGBP(minor int64) domain.Money { return domain.NewMoney(minor, domain.GBP) }\n\nfunc oracleLoyalty(customer string, minor int64) LoyaltyDiscount {\n\treturn LoyaltyDiscount{Members: map[string]bool{customer: true}, Amount: oracleGBP(minor)}\n}\n\nfunc oracleTaxOf(amount int64, rate TaxRate) int64 {\n\treturn (amount*int64(rate) + 5000) / 10000\n}\n\n// oracleCheckInvariants asserts the properties every breakdown must have:\n// nothing negative to pay, every listed discount real and non-negative, the\n// listed discounts never exceeding the goods, tax computed on what is actually\n// charged, and the lines adding up to the total.\nfunc oracleCheckInvariants(t *testing.T, b Breakdown, rate TaxRate, cur domain.Currency) {\n\tt.Helper()\n\tif b.Total.Minor < 0 {\n\t\tt.Errorf(\"total = %d, must never be negative (breakdown %+v)\", b.Total.Minor, b)\n\t}\n\tif b.Total.Currency != cur {\n\t\tt.Errorf(\"total currency = %q, want %q\", b.Total.Currency, cur)\n\t}\n\tif b.Tax.Minor < 0 {\n\t\tt.Errorf(\"tax = %d, must never be negative\", b.Tax.Minor)\n\t}\n\tvar taken int64\n\tfor _, d := range b.Discounts {\n\t\tif d.Amount.Minor < 0 {\n\t\t\tt.Errorf(\"discount %q = %d, must not be negative\", d.Rule, d.Amount.Minor)\n\t\t}\n\t\tif d.Amount.Currency != cur {\n\t\t\tt.Errorf(\"discount %q currency = %q, want %q\", d.Rule, d.Amount.Currency, cur)\n\t\t}\n\t\ttaken += d.Amount.Minor\n\t}\n\tif taken > b.Subtotal.Minor {\n\t\tt.Errorf(\"discounts total %d exceed subtotal %d\", taken, b.Subtotal.Minor)\n\t}\n\tcharged := b.Subtotal.Minor - taken + b.Shipping.Minor\n\tif want := oracleTaxOf(charged, rate); b.Tax.Minor != want {\n\t\tt.Errorf(\"tax = %d, want %d (rate %d on %d)\", b.Tax.Minor, want, rate, charged)\n\t}\n\tif got, want := b.Total.Minor, charged+b.Tax.Minor; got != want {\n\t\tt.Errorf(\"breakdown does not add up: subtotal %d - discounts %d + shipping %d + tax %d = %d, but total is %d\",\n\t\t\tb.Subtotal.Minor, taken, b.Shipping.Minor, b.Tax.Minor, want, got)\n\t}\n}\n\n// oracleDiscountsByRule returns the listed amount per rule; a rule that\n// contributed nothing may be either absent or listed at zero.\nfunc oracleDiscountsByRule(t *testing.T, b Breakdown) map[string]int64 {\n\tt.Helper()\n\tout := map[string]int64{}\n\tfor _, d := range b.Discounts {\n\t\tif _, dup := out[d.Rule]; dup {\n\t\t\tt.Fatalf(\"rule %q listed twice in %+v\", d.Rule, b.Discounts)\n\t\t}\n\t\tout[d.Rule] = d.Amount.Minor\n\t}\n\treturn out\n}\n\n// The reported incident: bulk and loyalty stack on a small order.\nfunc TestOracleBulkThenLoyaltyNeverGoesNegative(t *testing.T) {\n\tconst cust = \"c-loyal\"\n\t// 10 units at 100 = 1000; bulk takes 100; loyalty offers 1000.\n\tc := New(store.NewMemory(), 2000,\n\t\tBulkDiscount{MinUnits: 10, PercentOffBase: 10},\n\t\toracleLoyalty(cust, 1000),\n\t)\n\tb, err := c.Price(context.Background(), oracleOrder(cust, 10, 100), oracleGBP(0))\n\tif err != nil {\n\t\tt.Fatalf(\"Price returned error: %v\", err)\n\t}\n\toracleCheckInvariants(t, b, 2000, domain.GBP)\n\tif b.Total.Minor != 0 {\n\t\tt.Errorf(\"total = %d, want 0\", b.Total.Minor)\n\t}\n\tgot := oracleDiscountsByRule(t, b)\n\tif got[\"bulk\"] != 100 {\n\t\tt.Errorf(\"bulk discount = %d, want 100\", got[\"bulk\"])\n\t}\n\tif got[\"loyalty\"] != 900 {\n\t\tt.Errorf(\"loyalty discount = %d, want 900 (only what was left)\", got[\"loyalty\"])\n\t}\n\tif b.Tax.Minor != 0 {\n\t\tt.Errorf(\"tax = %d, want 0\", b.Tax.Minor)\n\t}\n}\n\nfunc TestOracleLoyaltyThenBulkNeverGoesNegative(t *testing.T) {\n\tconst cust = \"c-loyal\"\n\tc := New(store.NewMemory(), 2000,\n\t\toracleLoyalty(cust, 1000),\n\t\tBulkDiscount{MinUnits: 10, PercentOffBase: 10},\n\t)\n\tb, err := c.Price(context.Background(), oracleOrder(cust, 10, 100), oracleGBP(0))\n\tif err != nil {\n\t\tt.Fatalf(\"Price returned error: %v\", err)\n\t}\n\toracleCheckInvariants(t, b, 2000, domain.GBP)\n\tif b.Total.Minor != 0 {\n\t\tt.Errorf(\"total = %d, want 0\", b.Total.Minor)\n\t}\n\tgot := oracleDiscountsByRule(t, b)\n\tif got[\"loyalty\"] != 1000 {\n\t\tt.Errorf(\"loyalty discount = %d, want 1000\", got[\"loyalty\"])\n\t}\n\tif got[\"bulk\"] != 0 {\n\t\tt.Errorf(\"bulk discount = %d, want 0 (nothing left to take off)\", got[\"bulk\"])\n\t}\n}\n\nfunc TestOracleSingleRuleLargerThanSubtotalIsCapped(t *testing.T) {\n\tc := New(store.NewMemory(), 2000, oracleFixedRule{name: \"voucher\", amount: oracleGBP(5000)})\n\tb, err := c.Price(context.Background(), oracleOrder(\"c1\", 1, 1000), oracleGBP(0))\n\tif err != nil {\n\t\tt.Fatalf(\"Price returned error: %v\", err)\n\t}\n\toracleCheckInvariants(t, b, 2000, domain.GBP)\n\tif b.Total.Minor != 0 {\n\t\tt.Errorf(\"total = %d, want 0\", b.Total.Minor)\n\t}\n\tif b.Total.Currency != domain.GBP {\n\t\tt.Errorf(\"total currency = %q, want GBP\", b.Total.Currency)\n\t}\n\tif len(b.Discounts) != 1 || b.Discounts[0].Rule != \"voucher\" || b.Discounts[0].Amount.Minor != 1000 {\n\t\tt.Errorf(\"discounts = %+v, want one voucher line of 1000\", b.Discounts)\n\t}\n}\n\nfunc TestOracleLaterRulesGetOnlyWhatIsLeft(t *testing.T) {\n\tc := New(store.NewMemory(), 0,\n\t\toracleFixedRule{name: \"first\", amount: oracleGBP(600)},\n\t\toracleFixedRule{name: \"second\", amount: oracleGBP(600)},\n\t\toracleFixedRule{name: \"third\", amount: oracleGBP(600)},\n\t)\n\tb, err := c.Price(context.Background(), oracleOrder(\"c1\", 1, 1000), oracleGBP(0))\n\tif err != nil {\n\t\tt.Fatalf(\"Price returned error: %v\", err)\n\t}\n\toracleCheckInvariants(t, b, 0, domain.GBP)\n\tgot := oracleDiscountsByRule(t, b)\n\tif got[\"first\"] != 600 || got[\"second\"] != 400 || got[\"third\"] != 0 {\n\t\tt.Errorf(\"discounts = %v, want first 600, second 400, third 0\", got)\n\t}\n\tif b.Total.Minor != 0 {\n\t\tt.Errorf(\"total = %d, want 0\", b.Total.Minor)\n\t}\n\t// Whatever order lines appear in, it must be the rule order.\n\tvar names []string\n\tfor _, d := range b.Discounts {\n\t\tnames = append(names, d.Rule)\n\t}\n\tif len(names) < 2 || names[0] != \"first\" || names[1] != \"second\" {\n\t\tt.Errorf(\"discount order = %v, want first, second\", names)\n\t}\n}\n\n// Shipping and tax on shipping are still owed when the goods are fully\n// discounted, and the breakdown must still add up.\nfunc TestOracleOverDiscountWithShippingStillAddsUp(t *testing.T) {\n\tconst cust = \"c-loyal\"\n\tc := New(store.NewMemory(), 2000,\n\t\tBulkDiscount{MinUnits: 10, PercentOffBase: 10},\n\t\toracleLoyalty(cust, 1000),\n\t)\n\tb, err := c.Price(context.Background(), oracleOrder(cust, 10, 100), oracleGBP(500))\n\tif err != nil {\n\t\tt.Fatalf(\"Price returned error: %v\", err)\n\t}\n\toracleCheckInvariants(t, b, 2000, domain.GBP)\n\tif b.Shipping.Minor != 500 {\n\t\tt.Errorf(\"shipping = %d, want 500\", b.Shipping.Minor)\n\t}\n\tgot := oracleDiscountsByRule(t, b)\n\tif got[\"bulk\"] != 100 || got[\"loyalty\"] != 900 {\n\t\tt.Errorf(\"discounts = %v, want bulk 100, loyalty 900\", got)\n\t}\n\t// Goods are free; 500 shipping + 100 tax.\n\tif b.Total.Minor != 600 {\n\t\tt.Errorf(\"total = %d, want 600\", b.Total.Minor)\n\t}\n}\n\nfunc TestOracleVoucherLargerThanSubtotalWithShipping(t *testing.T) {\n\tc := New(store.NewMemory(), 2000, oracleFixedRule{name: \"voucher\", amount: oracleGBP(10_000)})\n\tb, err := c.Price(context.Background(), oracleOrder(\"c1\", 2, 250), oracleGBP(399))\n\tif err != nil {\n\t\tt.Fatalf(\"Price returned error: %v\", err)\n\t}\n\toracleCheckInvariants(t, b, 2000, domain.GBP)\n\tif len(b.Discounts) != 1 || b.Discounts[0].Amount.Minor != 500 {\n\t\tt.Errorf(\"discounts = %+v, want one line of 500\", b.Discounts)\n\t}\n\t// 399 shipping, tax 79.8 -> 80.\n\tif b.Total.Minor != 479 {\n\t\tt.Errorf(\"total = %d, want 479\", b.Total.Minor)\n\t}\n}\n\nfunc TestOracleDiscountExactlySubtotal(t *testing.T) {\n\tconst cust = \"c-loyal\"\n\tc := New(store.NewMemory(), 2000, oracleLoyalty(cust, 1000))\n\tb, err := c.Price(context.Background(), oracleOrder(cust, 1, 1000), oracleGBP(250))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleCheckInvariants(t, b, 2000, domain.GBP)\n\tif len(b.Discounts) != 1 || b.Discounts[0].Amount.Minor != 1000 {\n\t\tt.Errorf(\"discounts = %+v, want one of 1000\", b.Discounts)\n\t}\n\tif b.Total.Minor != 300 {\n\t\tt.Errorf(\"total = %d, want 300\", b.Total.Minor)\n\t}\n}\n\n// Many rule combinations: whatever the rules offer, the breakdown must be\n// non-negative and self-consistent, and no rule may be credited with more\n// than it offered.\nfunc TestOracleRandomCombinationsKeepInvariants(t *testing.T) {\n\trng := rand.New(rand.NewSource(20260923))\n\tconst cust = \"c-loyal\"\n\tfor i := 0; i < 500; i++ {\n\t\tunits := 1 + rng.Intn(20)\n\t\tunit := int64(1 + rng.Intn(2000))\n\t\torder := oracleOrder(cust, units, unit)\n\t\tsubtotal := unit * int64(units)\n\t\tshipping := int64(rng.Intn(1500))\n\t\trate := TaxRate(rng.Intn(2500))\n\n\t\tvar rules []Rule\n\t\toffered := map[string]int64{}\n\t\tfor j, n := 0, rng.Intn(5); j < n; j++ {\n\t\t\tswitch rng.Intn(3) {\n\t\t\tcase 0:\n\t\t\t\tpct := rng.Intn(101)\n\t\t\t\tr := BulkDiscount{MinUnits: rng.Intn(15), PercentOffBase: pct}\n\t\t\t\tname := r.Name()\n\t\t\t\tif _, seen := offered[name]; seen {\n\t\t\t\t\tcontinue\n\t\t\t\t}\n\t\t\t\tamt, _ := r.Discount(context.Background(), order, oracleGBP(subtotal))\n\t\t\t\toffered[name] = amt.Minor\n\t\t\t\trules = append(rules, r)\n\t\t\tcase 1:\n\t\t\t\tr := oracleLoyalty(cust, int64(rng.Intn(3000)))\n\t\t\t\tname := r.Name()\n\t\t\t\tif _, seen := offered[name]; seen {\n\t\t\t\t\tcontinue\n\t\t\t\t}\n\t\t\t\tamt, _ := r.Discount(context.Background(), order, oracleGBP(subtotal))\n\t\t\t\toffered[name] = amt.Minor\n\t\t\t\trules = append(rules, r)\n\t\t\tdefault:\n\t\t\t\tname := fmt.Sprintf(\"fixed-%d\", j)\n\t\t\t\tamt := int64(rng.Intn(int(subtotal) + 2000))\n\t\t\t\toffered[name] = amt\n\t\t\t\trules = append(rules, oracleFixedRule{name: name, amount: oracleGBP(amt)})\n\t\t\t}\n\t\t}\n\n\t\tc := New(store.NewMemory(), rate, rules...)\n\t\tb, err := c.Price(context.Background(), order, oracleGBP(shipping))\n\t\tif err != nil {\n\t\t\tt.Fatalf(\"case %d: Price returned error: %v\", i, err)\n\t\t}\n\t\tok := t.Run(fmt.Sprintf(\"case%d\", i), func(t *testing.T) {\n\t\t\toracleCheckInvariants(t, b, rate, domain.GBP)\n\t\t\tif b.Subtotal.Minor != subtotal {\n\t\t\t\tt.Errorf(\"subtotal = %d, want %d\", b.Subtotal.Minor, subtotal)\n\t\t\t}\n\t\t\tif b.Shipping.Minor != shipping {\n\t\t\t\tt.Errorf(\"shipping = %d, want %d\", b.Shipping.Minor, shipping)\n\t\t\t}\n\t\t\tgot := oracleDiscountsByRule(t, b)\n\t\t\tvar totalOffered int64\n\t\t\tfor name, amt := range got {\n\t\t\t\tif amt > offered[name] {\n\t\t\t\t\tt.Errorf(\"rule %q credited %d, but only offered %d\", name, amt, offered[name])\n\t\t\t\t}\n\t\t\t}\n\t\t\tfor _, amt := range offered {\n\t\t\t\ttotalOffered += amt\n\t\t\t}\n\t\t\tvar taken int64\n\t\t\tfor _, amt := range got {\n\t\t\t\ttaken += amt\n\t\t\t}\n\t\t\t// Take everything offered, up to the whole subtotal.\n\t\t\twant := totalOffered\n\t\t\tif want > subtotal {\n\t\t\t\twant = subtotal\n\t\t\t}\n\t\t\tif taken != want {\n\t\t\t\tt.Errorf(\"discounts taken = %d, want %d (offered %d on subtotal %d)\", taken, want, totalOffered, subtotal)\n\t\t\t}\n\t\t})\n\t\tif !ok {\n\t\t\tt.Logf(\"case %d: units=%d unit=%d shipping=%d rate=%d offered=%v breakdown=%+v\",\n\t\t\t\ti, units, unit, shipping, rate, offered, b)\n\t\t\treturn\n\t\t}\n\t}\n}\n\n// --- Existing behaviour the change must not disturb ---\n\n// When discounts fit within the subtotal nothing is capped, and a percentage\n// rule is still taken off the base subtotal, not what earlier rules left.\nfunc TestOracleDiscountsWithinSubtotalUnchanged(t *testing.T) {\n\tconst cust = \"c-loyal\"\n\tc := New(store.NewMemory(), 2000,\n\t\toracleLoyalty(cust, 200),\n\t\tBulkDiscount{MinUnits: 10, PercentOffBase: 10},\n\t)\n\t// 10 units at 200 = 2000.\n\tb, err := c.Price(context.Background(), oracleOrder(cust, 10, 200), oracleGBP(500))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\toracleCheckInvariants(t, b, 2000, domain.GBP)\n\tif len(b.Discounts) != 2 ||\n\t\tb.Discounts[0].Rule != \"loyalty\" || b.Discounts[0].Amount.Minor != 200 ||\n\t\tb.Discounts[1].Rule != \"bulk\" || b.Discounts[1].Amount.Minor != 200 {\n\t\tt.Fatalf(\"discounts = %+v, want loyalty 200 then bulk 200\", b.Discounts)\n\t}\n\t// 2000 - 400 + 500 = 2100; tax 420; total 2520.\n\tif b.Subtotal.Minor != 2000 || b.Tax.Minor != 420 || b.Total.Minor != 2520 {\n\t\tt.Errorf(\"subtotal/tax/total = %d/%d/%d, want 2000/420/2520\", b.Subtotal.Minor, b.Tax.Minor, b.Total.Minor)\n\t}\n}\n\nfunc TestOracleNoRulesNoDiscounts(t *testing.T) {\n\tc := New(store.NewMemory(), 2000)\n\tb, err := c.Price(context.Background(), oracleOrder(\"c1\", 3, 333), oracleGBP(0))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(b.Discounts) != 0 {\n\t\tt.Errorf(\"discounts = %+v, want none\", b.Discounts)\n\t}\n\t// 999, tax 199.8 -> 200 (half up), total 1199.\n\tif b.Tax.Minor != 200 || b.Total.Minor != 1199 {\n\t\tt.Errorf(\"tax/total = %d/%d, want 200/1199\", b.Tax.Minor, b.Total.Minor)\n\t}\n\tif b.Total.Currency != domain.GBP {\n\t\tt.Errorf(\"total currency = %q, want GBP\", b.Total.Currency)\n\t}\n}\n\nfunc TestOracleTaxRoundsHalfUp(t *testing.T) {\n\tc := New(store.NewMemory(), 1000)\n\t// 5 at 10% = 0.5 -> 1.\n\tb, err := c.Price(context.Background(), oracleOrder(\"c1\", 1, 5), oracleGBP(0))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif b.Tax.Minor != 1 || b.Total.Minor != 6 {\n\t\tt.Errorf(\"tax/total = %d/%d, want 1/6\", b.Tax.Minor, b.Total.Minor)\n\t}\n\t// 4 at 10% = 0.4 -> 0.\n\tb, err = c.Price(context.Background(), oracleOrder(\"c1\", 1, 4), oracleGBP(0))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif b.Tax.Minor != 0 || b.Total.Minor != 4 {\n\t\tt.Errorf(\"tax/total = %d/%d, want 0/4\", b.Tax.Minor, b.Total.Minor)\n\t}\n}\n\nfunc TestOracleZeroDiscountsAreNotListed(t *testing.T) {\n\tc := New(store.NewMemory(), 0,\n\t\toracleLoyalty(\"someone-else\", 500),\n\t\tBulkDiscount{MinUnits: 100, PercentOffBase: 10},\n\t)\n\tb, err := c.Price(context.Background(), oracleOrder(\"c1\", 2, 1000), oracleGBP(0))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(b.Discounts) != 0 {\n\t\tt.Errorf(\"discounts = %+v, want none\", b.Discounts)\n\t}\n\tif b.Total.Minor != 2000 {\n\t\tt.Errorf(\"total = %d, want 2000\", b.Total.Minor)\n\t}\n}\n\nfunc TestOracleLoyaltyRuleItself(t *testing.T) {\n\tctx := context.Background()\n\tconst cust = \"c-loyal\"\n\tr := oracleLoyalty(cust, 300)\n\tif r.Name() != \"loyalty\" {\n\t\tt.Errorf(\"name = %q, want loyalty\", r.Name())\n\t}\n\tgot, err := r.Discount(ctx, oracleOrder(cust, 1, 1000), oracleGBP(1000))\n\tif err != nil || got.Minor != 300 || got.Currency != domain.GBP {\n\t\tt.Errorf(\"member discount = %+v, %v; want 300 GBP\", got, err)\n\t}\n\tgot, err = r.Discount(ctx, oracleOrder(\"stranger\", 1, 1000), oracleGBP(1000))\n\tif err != nil || got.Minor != 0 {\n\t\tt.Errorf(\"non-member discount = %+v, %v; want 0\", got, err)\n\t}\n\tgot, err = r.Discount(ctx, oracleOrder(cust, 1, 100), oracleGBP(100))\n\tif err != nil || got.Minor != 100 {\n\t\tt.Errorf(\"capped discount = %+v, %v; want 100\", got, err)\n\t}\n\teur := LoyaltyDiscount{Members: map[string]bool{cust: true}, Amount: domain.NewMoney(300, domain.EUR)}\n\tgot, err = eur.Discount(ctx, oracleOrder(cust, 1, 1000), oracleGBP(1000))\n\tif err != nil || got.Minor != 0 {\n\t\tt.Errorf(\"wrong-currency discount = %+v, %v; want 0\", got, err)\n\t}\n}\n\nfunc TestOracleBulkRuleItself(t *testing.T) {\n\tctx := context.Background()\n\tr := BulkDiscount{MinUnits: 5, PercentOffBase: 15}\n\tif r.Name() != \"bulk\" {\n\t\tt.Errorf(\"name = %q, want bulk\", r.Name())\n\t}\n\tgot, err := r.Discount(ctx, oracleOrder(\"c1\", 4, 100), oracleGBP(400))\n\tif err != nil || got.Minor != 0 {\n\t\tt.Errorf(\"under threshold = %+v, %v; want 0\", got, err)\n\t}\n\tgot, err = r.Discount(ctx, oracleOrder(\"c1\", 5, 101), oracleGBP(505))\n\tif err != nil || got.Minor != 75 || got.Currency != domain.GBP {\n\t\tt.Errorf(\"at threshold = %+v, %v; want 75 GBP\", got, err)\n\t}\n}\n\nfunc TestOracleRuleErrorPropagates(t *testing.T) {\n\tsentinel := errors.New(\"oracle: rule broke\")\n\tc := New(store.NewMemory(), 2000, oracleFailingRule{err: sentinel})\n\t_, err := c.Price(context.Background(), oracleOrder(\"c1\", 1, 1000), oracleGBP(0))\n\tif !errors.Is(err, sentinel) {\n\t\tt.Fatalf(\"err = %v, want wrapping %v\", err, sentinel)\n\t}\n}\n\nfunc TestOracleMixedCurrencyOrderStillRejected(t *testing.T) {\n\tc := New(store.NewMemory(), 2000)\n\to := domain.Order{ID: \"o\", CustomerID: \"c1\", Currency: domain.GBP, Lines: []domain.OrderLine{\n\t\t{SKU: \"AB-1234\", Quantity: 1, UnitPrice: domain.NewMoney(100, domain.EUR)},\n\t}}\n\tif _, err := c.Price(context.Background(), o, oracleGBP(0)); !errors.Is(err, domain.ErrCurrencyMismatch) {\n\t\tt.Fatalf(\"err = %v, want ErrCurrencyMismatch\", err)\n\t}\n}\n\nfunc TestOracleShippingInOtherCurrencyStillRejected(t *testing.T) {\n\tc := New(store.NewMemory(), 2000)\n\t_, err := c.Price(context.Background(), oracleOrder(\"c1\", 1, 1000), domain.NewMoney(500, domain.EUR))\n\tif !errors.Is(err, domain.ErrCurrencyMismatch) {\n\t\tt.Fatalf(\"err = %v, want ErrCurrencyMismatch\", err)\n\t}\n}\n"
   },
