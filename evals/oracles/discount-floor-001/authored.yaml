    "internal/domain/oracle_money_test.go": "package domain\n\nimport (\n\t\"errors\"\n\t\"testing\"\n)\n\n// Money arithmetic is plain arithmetic: a floor at zero belongs in pricing,\n// not in the type everything else computes with (refunds, stock value, etc.).\nfunc TestOracleMoneySubCanGoNegative(t *testing.T) {\n\tgot, err := NewMoney(100, GBP).Sub(NewMoney(250, GBP))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif got.Minor != -150 || got.Currency != GBP {\n\t\tt.Fatalf(\"got %+v, want -150 GBP\", got)\n\t}\n}\n\nfunc TestOracleMoneySubRefusesMixedCurrency(t *testing.T) {\n\tif _, err := NewMoney(100, GBP).Sub(NewMoney(50, USD)); !errors.Is(err, ErrCurrencyMismatch) {\n\t\tt.Fatalf(\"got %v, want ErrCurrencyMismatch\", err)\n\t}\n}\n\nfunc TestOracleMoneyAddAndTimes(t *testing.T) {\n\tgot, err := NewMoney(-40, EUR).Add(NewMoney(100, EUR))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif got.Minor != 60 || got.Currency != EUR {\n\t\tt.Fatalf(\"add = %+v, want 60 EUR\", got)\n\t}\n\tif got := NewMoney(125, USD).Times(3); got.Minor != 375 || got.Currency != USD {\n\t\tt.Fatalf(\"times = %+v, want 375 USD\", got)\n\t}\n}\n\nfunc TestOracleMoneyString(t *testing.T) {\n\tcases := map[Money]string{\n\t\tNewMoney(0, GBP):      \"0.00 GBP\",\n\t\tNewMoney(5, GBP):      \"0.05 GBP\",\n\t\tNewMoney(1234, EUR):   \"12.34 EUR\",\n\t\tNewMoney(-150, GBP):   \"-1.50 GBP\",\n\t\tNewMoney(-5, USD):     \"-0.05 USD\",\n\t\tNewMoney(100000, GBP): \"1000.00 GBP\",\n\t}\n\tfor m, want := range cases {\n\t\tif got := m.String(); got != want {\n\t\t\tt.Errorf(\"%+v.String() = %q, want %q\", m, got, want)\n\t\t}\n\t}\n}\n\nfunc TestOracleMoneyIsZeroAndValid(t *testing.T) {\n\tif !NewMoney(0, GBP).IsZero() {\n\t\tt.Error(\"0 GBP should be zero\")\n\t}\n\tif NewMoney(-1, GBP).IsZero() || NewMoney(1, GBP).IsZero() {\n\t\tt.Error(\"non-zero amounts reported as zero\")\n\t}\n\tif (Money{}).Valid() {\n\t\tt.Error(\"zero-value Money must not be valid\")\n\t}\n\tif !NewMoney(0, USD).Valid() {\n\t\tt.Error(\"0 USD should be valid\")\n\t}\n}\n"
   },
