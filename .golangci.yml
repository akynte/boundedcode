version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - unconvert
  settings:
    gocritic:
      disabled-checks: [ifElseChain, singleCaseSwitch]
  exclusions:
    presets: [std-error-handling]
formatters:
  enable: [gofmt]
