name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (pinned binary, no third-party action)
        run: scripts/install-gitleaks.sh "$RUNNER_TEMP/bin" && "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner .
