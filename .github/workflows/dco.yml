name: dco
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: check Signed-off-by on every commit
        env:
          # Pull requests: the PR's commits. Pushes to main: the pushed commits
          # (an all-zero "before", e.g. the first push, checks the whole history).
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE" "$HEAD"
