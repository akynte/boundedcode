name: Wrong verification result (false positive or false negative)
description: BoundedCode called a change verified that was wrong, or refused to verify a change that was right.
labels: [verification-accuracy]
body:
  - type: markdown
    attributes:
      value: |
        Verification results are BoundedCode's central claim, so these reports matter most. [What the results mean](https://github.com/akynte/boundedcode/blob/main/docs/usage/verification.md).
        **If the agent could weaken or bypass the gate** (edit its own checks, skip stages, fake evidence), that is a security problem: report it privately ([SECURITY.md](https://github.com/akynte/boundedcode/blob/main/SECURITY.md)).
        Remove proprietary code. A public repository and commit makes a report reproducible.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - False positive (TASK_VERIFIED or tests_green, but the change is wrong)
        - False negative (UNVERIFIED or blocked, but the change is right)
    validations:
      required: true
  - type: input
    id: result
    attributes:
      label: Result BoundedCode reported
      description: The final status line, for example `verified=task_verified` or `checks green but UNVERIFIED (...)`.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the result is wrong
      description: The independent evidence. For a false positive, a failing test, command or scenario on the agent's branch. For a false negative, why the change is correct and what the gate refused (the failing stage or the evidence reason).
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository and base commit
      description: A public repository URL and commit, if possible.
  - type: textarea
    id: request
    attributes:
      label: Task request
      description: The request text the task was created with.
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: The change
      description: Output of `boundedcode task diff TASK`, or a link to it.
      render: diff
  - type: textarea
    id: events
    attributes:
      label: Verification events
      description: The verification part of `boundedcode task events TASK` (verify.result and verify.evidence events).
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Verification configuration
      description: The repository's `.boundedcode/verification.yaml`, or "preset" if there is none.
      render: yaml
  - type: input
    id: version
    attributes:
      label: BoundedCode version
      description: Output of `boundedcode version`.
    validations:
      required: true
