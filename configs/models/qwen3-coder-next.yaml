# Qwen3-Coder-Next: sparse MoE, ~80B total / ~3B active, non-thinking.
# License: Apache-2.0. The Q4_K_M GGUF (~48 GB) does not fit next to a
# typical desktop in 64 GB RAM, so the reference profile uses unsloth's
# UD-IQ3_XXS (~28.5 GB) — a 3-bit quant, which handicaps quality.
name: qwen3-coder-next
display_name: Qwen3-Coder-Next (UD-IQ3_XXS GGUF)
file: Qwen3-Coder-Next-UD-IQ3_XXS.gguf
source:
  repo: unsloth/Qwen3-Coder-Next-GGUF
  file: Qwen3-Coder-Next-UD-IQ3_XXS.gguf
  revision: ce09c67b53bc8739eef83fe67b2f5d293c270632
  base_model: Qwen/Qwen3-Coder-Next
  license: apache-2.0
architecture:
  moe: true
  total_params_b: 80
  active_params_b: 3
# Server flags: replace with `bench infra --model qwen3-coder-next --moe-max 48 --apply` results.
server:
  ctx_size: 65536
  gpu_layers: 999
  n_cpu_moe: 40
  flash_attn: "on"
  cache_type_k: q8_0
  cache_type_v: q8_0
  batch_size: 2048
  ubatch_size: 2048
  threads: 8
  parallel: 1
  jinja: true
  # Cap thinking per response; see model.ServerFlags.ReasoningBudget.
  reasoning_budget: 4096
  reasoning_budget_message: "\n\nI have reasoned enough. I will now act on my best plan.\n"
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 40
