# Pinned environment for Serena, an optional external MCP process used for
# LSP-backed symbol navigation (ADR-0008). This project only pins and locks;
# it contains no code. Serena is installed unmodified from PyPI.
#
# The pin is deliberate: Serena v1.7.0 (tag v1.7.0, commit 949a27ef) is MIT.
# Serena's main branch relicensed the application to GPL-3.0-or-later for
# v2. Changing this version requires a manual license and compatibility
# review (docs/licensing/policy.md); CI enforces that the license matrix and
# notices change together with this file (scripts/serenaguard).
#
# Installed by `boundedcode serena setup` (uv sync --frozen). For development:
#   uv sync --frozen --project configs/serena
[project]
name = "bc-serena-env"
version = "0.1.0"
description = "Locked environment for Serena v1.7.0 (MIT), used by boundedcode as an external process"
license = "Apache-2.0"
requires-python = ">=3.11, <3.15"
dependencies = [
    "serena-agent==1.7.0",
    # Serena's dashboard module imports PIL at load time but only gets it
    # through pystray, which is excluded below.
    "pillow",
]

[tool.uv]
package = false
# pystray (LGPL-3.0, and python-xlib, LGPL-2.0+, which it pulls in on Linux)
# drives Serena's system-tray icon. Serena imports it lazily, only from the
# dashboard/GUI code, which boundedcode always disables. Exclude it so the
# environment contains no LGPL code (as done for the adapter's
# lmnr-claude-code-proxy). Pillow, which pystray pulled in, is listed
# directly. See docs/licensing/upstream-license-matrix.md.
override-dependencies = ["pystray; sys_platform == 'never'"]
