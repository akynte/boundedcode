# Draft from bcode lab hypothesize: review the hypothesis, the tasks (the held-out
# ones decide it) and the arms before running it with bcode lab run.
arms:
    - name: baseline
      role: baseline
    - name: rerun-note
      role: candidate
      description: 'Note when a build or test is run again with nothing changed since its last run. Write the patch with `bcode lab worktree rerun-note`: internal/direct: remember the last result of each verification command and the change counter; on an unchanged rerun, say so.'
      patch: rerun-note.patch
      predicts:
        fixes:
            - multi-feature-discount
            - session-resume-constraints
            - session-x-tools
hypothesis: |-
    Note when a build or test is run again with nothing changed since its last run. This improves model_calls_per_run (lower is better) on held-out tasks without a regression in any language.
    Evidence: unnecessary_retries in 21 of 1523 eligible runs (6 tasks; attempts-failed ×17, rerun-unchanged ×4); fails 50% with, 8% without; 27 calls wasted; explains 17 failed runs
id: rerun-note
pattern: unnecessary_retries
primary:
    better: lower
    metric: model_calls_per_run
suite: direct
tasks:
    dirs:
        - benchmarks/direct
trials: 2
