id: event-field-rename
category: cross-service-discovery
fixture: payment-platform
repos: [payment-service, ledger-service]
# The request names only the producer; succeeding requires discovering the
# consumer of topic payments.charged in ledger-service (Phase 9 evaluation).
request: >-
  In payment-service, rename the JSON field of the PaymentCharged event from
  "amount_cents" to "amount_minor" (event schema v2; the Go field name may stay).
  Keep tests passing.
criteria:
  - published PaymentCharged events use the JSON key amount_minor
  - go test ./... passes
hidden:
  - repo: payment-service
    path: internal/events/hidden_accept_test.go
    content: |
      package events

      import (
      	"encoding/json"
      	"testing"
      )

      func TestHiddenEventSchemaV2(t *testing.T) {
      	p := &MemoryProducer{}
      	if err := (&Publisher{Producer: p}).PaymentCharged(PaymentCharged{PaymentID: "p", AccountID: "a", AmountCents: 7, Currency: "EUR"}); err != nil {
      		t.Fatal(err)
      	}
      	var m map[string]any
      	_ = json.Unmarshal(p.Sent[0].Value, &m)
      	if m["amount_minor"] != float64(7) || m["amount_cents"] != nil {
      		t.Fatalf("event payload = %s", p.Sent[0].Value)
      	}
      }
  - repo: ledger-service
    path: internal/consumer/hidden_accept_test.go
    content: |
      package consumer

      import (
      	"testing"

      	"example.com/ledger-service/internal/ledger"
      )

      // The ledger must keep posting correct amounts for v2 events.
      func TestHiddenConsumesSchemaV2(t *testing.T) {
      	l := &ledger.Ledger{}
      	c := &Consumer{Ledger: l}
      	msg := &ConsumerMessage{Topic: TopicPaymentCharged, Value: []byte(`{"payment_id":"p1","account_id":"a1","amount_minor":500,"currency":"EUR"}`)}
      	if err := c.HandlePaymentCharged(msg); err != nil {
      		t.Fatal(err)
      	}
      	if got := l.Balance("a1"); got != 500 {
      		t.Fatalf("balance = %d, want 500 (consumer still reads the old field?)", got)
      	}
      }
checks:
  - repo: payment-service
    run: [go, test, ./...]
  - repo: ledger-service
    run: [go, test, ./...]
timeout: 40m
