id: cross-service-idempotency
category: cross-service
fixture: payment-platform
repos: [payment-service, ledger-service]
request: >-
  Make payment processing idempotent across services.
  (1) payment-service: POST /v1/payments must honour an `Idempotency-Key` request header.
  A repeated request with the same key must return the original payment (same id) with
  status 200 or 201 and must NOT publish a second PaymentCharged event. Requests without
  the header behave as today.
  (2) ledger-service: HandlePaymentCharged must be idempotent per payment_id: processing
  the same event twice posts only once. Add tests in both services.
criteria:
  - same Idempotency-Key returns the same payment id and publishes exactly one event
  - duplicate PaymentCharged events (same payment_id) are posted once
  - go test ./... passes in both services
hidden:
  - repo: payment-service
    path: internal/api/hidden_accept_test.go
    content: |
      package api

      import (
      	"encoding/json"
      	"net/http/httptest"
      	"strings"
      	"sync"
      	"testing"
      )

      func TestHiddenIdempotencyKey(t *testing.T) {
      	mux, prod := newTestServer()
      	ids := map[string]bool{}
      	for i := 0; i < 3; i++ {
      		req := httptest.NewRequest("POST", "/v1/payments", strings.NewReader(`{"account_id":"a","amount_cents":10,"currency":"EUR"}`))
      		req.Header.Set("Idempotency-Key", "k-1")
      		rec := httptest.NewRecorder()
      		mux.ServeHTTP(rec, req)
      		if rec.Code != 200 && rec.Code != 201 {
      			t.Fatalf("status %d", rec.Code)
      		}
      		var p struct{ ID string }
      		_ = json.Unmarshal(rec.Body.Bytes(), &p)
      		ids[p.ID] = true
      	}
      	if len(ids) != 1 || len(prod.Sent) != 1 {
      		t.Fatalf("ids=%v events=%d", ids, len(prod.Sent))
      	}
      	rec := httptest.NewRecorder()
      	mux.ServeHTTP(rec, httptest.NewRequest("POST", "/v1/payments", strings.NewReader(`{"account_id":"a","amount_cents":10,"currency":"EUR"}`)))
      	if len(prod.Sent) != 2 {
      		t.Fatalf("request without key should publish: events=%d", len(prod.Sent))
      	}
      }

      // Concurrent retries with the same key (a real client timeout/retry race)
      // must still produce exactly one payment and one event.
      func TestHiddenIdempotencyKeyConcurrent(t *testing.T) {
      	mux, prod := newTestServer()
      	var wg sync.WaitGroup
      	var mu sync.Mutex
      	ids := map[string]bool{}
      	for i := 0; i < 32; i++ {
      		wg.Add(1)
      		go func() {
      			defer wg.Done()
      			req := httptest.NewRequest("POST", "/v1/payments", strings.NewReader(`{"account_id":"a","amount_cents":10,"currency":"EUR"}`))
      			req.Header.Set("Idempotency-Key", "k-race")
      			rec := httptest.NewRecorder()
      			mux.ServeHTTP(rec, req)
      			var p struct{ ID string }
      			_ = json.Unmarshal(rec.Body.Bytes(), &p)
      			mu.Lock()
      			ids[p.ID] = true
      			mu.Unlock()
      		}()
      	}
      	wg.Wait()
      	if len(ids) != 1 || len(prod.Sent) != 1 {
      		t.Fatalf("concurrent same-key requests: ids=%d events=%d", len(ids), len(prod.Sent))
      	}
      }
  - repo: ledger-service
    path: internal/consumer/hidden_accept_test.go
    content: |
      package consumer

      import (
      	"testing"

      	"example.com/ledger-service/internal/ledger"
      )

      func TestHiddenDuplicateEvent(t *testing.T) {
      	l := &ledger.Ledger{}
      	c := &Consumer{Ledger: l}
      	msg := &ConsumerMessage{Topic: TopicPaymentCharged, Value: []byte(`{"payment_id":"p1","account_id":"a","amount_cents":500,"currency":"EUR"}`)}
      	for i := 0; i < 3; i++ {
      		if err := c.HandlePaymentCharged(msg); err != nil {
      			t.Fatalf("attempt %d: %v", i, err)
      		}
      	}
      	if l.Balance("a") != 500 || len(l.Entries()) != 2 {
      		t.Fatalf("balance=%d entries=%d", l.Balance("a"), len(l.Entries()))
      	}
      }
checks:
  - repo: payment-service
    run: [go, test, -race, -count=3, ./...]
  - repo: ledger-service
    run: [go, test, ./...]
timeout: 60m
