syntax = "proto3";
package payments.v1;

// PaymentService is exposed over HTTP/JSON by payment-service.
service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (Payment);
}

message CreatePaymentRequest {
  string account_id = 1;
  int64 amount_cents = 2;
  string currency = 3;
  string idempotency_key = 4;
}

message Payment {
  string id = 1;
  string account_id = 2;
  int64 amount_cents = 3;
  string currency = 4;
  string status = 5;
}

// PaymentCharged is published to Kafka topic "payments.charged".
message PaymentCharged {
  string payment_id = 1;
  string account_id = 2;
  int64 amount_cents = 3;
  string currency = 4;
}
