# Repository verification config for this benchmark task, committed into the
# task's base commit (ENVIRONMENT_ONLY setup). It is the default Go preset,
# minus checks that already fail on the untouched base in the offline
# sandbox with Go 1.27 (measured before any agent run):
#   go test: 55 tests in caddytest/integration and modules/caddyhttp/reverseproxy that start
#            a Caddy server fail at base (config-loader panic under Go 1.27, unwritable HOME)
#            + 6 more in reverseproxy/caddytls (panic, and caddytest/*.key and leafcert.pem hidden by
#            BoundedCode's secret masking in the sandbox)
version: 1
stages:
  - name: gofmt
    run: ["sh", "-c", "out=$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/') 2>&1); [ -z \"$out\" ] || { echo \"files need gofmt:\"; echo \"$out\"; exit 1; }"]
    requires: [go.mod]
  - name: go-build
    run: [go, build, ./...]
    requires: [go.mod]
  - name: go-vet
    run: [go, vet, "{packages}"]
    requires: [go.mod]
  - name: go-test
    run: [go, test, -count=1, -skip, "^(TestACMEServerAllowPolicy|TestACMEServerDenyPolicy|TestACMEServerDirectory|TestACMEServerWithDefaults|TestACMEServerWithMismatchedChallenges|TestAutoHTTPRedirectsInsertedBeforeUserDefinedCatchAll|TestAutoHTTPRedirectsInsertedBeforeUserDefinedCatchAllWithNoExplicitHTTPSite|TestAutoHTTPRedirectsWithHTTPListenerFirstInAddresses|TestAutoHTTPtoHTTPSRedirectsExplicitPortDifferentFromHTTPSPort|TestAutoHTTPtoHTTPSRedirectsExplicitPortSameAsHTTPSPort|TestAutoHTTPtoHTTPSRedirectsImplicitPort|TestBrowse|TestDefaultSNI|TestDefaultSNIWithNamedHostAndExplicitIP|TestDefaultSNIWithPortMappingOnly|TestDialWithPlaceholderUnix|TestH2ToH1ChunkedResponse|TestH2ToH2CStream|TestHandleErrorRange|TestHandleErrorRangeAndCodes|TestHandleErrorSimpleCodes|TestHandleErrorSort|TestHTTPRedirectWrapperWithLargeUpload|TestHttpRequestLocalPortPlaceholder|TestIntermediateLifetimeLessThanRoot|TestLargeHttpRequest|TestLeafCertLifetimeLessThanIntermediate|TestLeafCertLoaders|TestMap|TestMapAsJSON|TestMapRespondWithDefault|TestNonExistingSearch|TestPartialReplacement|TestQueryHashPolicy|TestReadCookie|TestRedirect|TestRenameAndOtherOps|TestReplaceAllOps|TestReplaceOps|TestReplaceWithKeyPlaceholder|TestReplaceWithReplacementPlaceholder|TestReplIndex|TestRespond|TestRespondWithJSON|TestReverseProxyHealthCheck|TestReverseProxyHealthCheckUnixSocket|TestReverseProxyHealthCheckUnixSocketWithoutPort|TestReverseProxyWithPlaceholderDialAddress|TestReverseProxyWithPlaceholderTCPDialAddress|TestSetThenAddQueryParams|TestSetThenDeleteParams|TestSRVReverseProxy|TestUriOps|TestUriOpsBlock|TestUriReplace|TestCookieHashPolicy|TestCookieHashPolicyWithSecureRequest|TestCookieHashPolicyWithFirstFallback|TestLeafFileLoader|TestLeafFolderLoader|TestLeafPEMLoader)$", "{packages}"]
    requires: [go.mod]
    timeout: 20m
  - name: golangci-lint
    run: [golangci-lint, run, ./...]
    scope: full
    optional: true
    requires: [go.mod]
