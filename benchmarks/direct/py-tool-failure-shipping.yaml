hidden:
  - repo: py-orders
    path: tests/test_hidden_bands.py
    content: |
      import unittest

      from orders.shipping import shipping_cost


      class HiddenBands(unittest.TestCase):
          def test_limits_are_inclusive(self):
              self.assertEqual(shipping_cost(1), 499)
              self.assertEqual(shipping_cost(5), 899)
              self.assertEqual(shipping_cost(20), 1999)

          def test_inside_bands(self):
              self.assertEqual(shipping_cost(1.5), 899)
              self.assertEqual(shipping_cost(19.9), 1999)
