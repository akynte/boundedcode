id: poly-generated-client
category: feature
language: multi
languages: [go, typescript]
fixture: poly-shop
repos: [shop]
request: >-
  Add discount_cents, a required integer, to the Order the API returns: the
  server's Order holds it and returns it, api/openapi.json declares it, and the
  generated web client includes it. Keep every test passing.
hidden:
  - repo: shop
    path: server/hidden_test.go
    content: |
      package server

      import (
      	"encoding/json"
      	"net/http/httptest"
      	"testing"
      )

      func TestHiddenDiscount(t *testing.T) {
      	s := Store{"o1": {ID: "o1", TotalCents: 900, DiscountCents: 100}}
      	rec := httptest.NewRecorder()
      	s.Handler().ServeHTTP(rec, httptest.NewRequest("GET", "/orders/o1", nil))
      	var got map[string]any
      	if err := json.Unmarshal(rec.Body.Bytes(), &got); err != nil || got["discount_cents"] != float64(100) {
      		t.Fatalf("%v %s", err, rec.Body.String())
      	}
      }
  - repo: shop
    path: web/test/hidden.test.ts
    content: |
      import test from 'node:test';
      import assert from 'node:assert';
      import { ORDER_FIELDS } from '../src/client.gen.ts';

      test('generated client has discount_cents', () => {
        assert.ok(ORDER_FIELDS.includes('discount_cents'));
      });
checks:
  - repo: shop
    run: [sh, -c, "node tools/gen-client.mjs --check && (cd server && go test ./...) && cd web && node --test"]
timeout: 20m
group: polyglot
capability: generated-client
split: heldout
provenance:
  kind: synthetic
  authored: 2026-10-30
reference:
  - repo: shop
    file: api/openapi.json
    new: "{\n  \"openapi\": \"3.0.3\",\n  \"info\": {\n    \"title\": \"shop\",\n    \"version\": \"1.0.0\"\n  },\n  \"paths\": {\n    \"/orders/{id}\": {\n      \"get\": {\n        \"operationId\": \"getOrder\",\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"the order\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/Order\"\n                }\n              }\n            }\n          }\n        }\n      }\n    }\n  },\n  \"components\": {\n    \"schemas\": {\n      \"Item\": {\n        \"type\": \"object\",\n        \"required\": [\n          \"sku\",\n          \"qty\"\n        ],\n        \"properties\": {\n          \"sku\": {\n            \"type\": \"string\"\n          },\n          \"qty\": {\n            \"type\": \"integer\"\n          }\n        }\n      },\n      \"Order\": {\n        \"type\": \"object\",\n        \"required\": [\n          \"id\",\n          \"items\",\n          \"total_cents\",\n          \"discount_cents\"\n        ],\n        \"properties\": {\n          \"id\": {\n            \"type\": \"string\"\n          },\n          \"items\": {\n            \"type\": \"array\",\n            \"items\": {\n              \"$ref\": \"#/components/schemas/Item\"\n            }\n          },\n          \"total_cents\": {\n            \"type\": \"integer\"\n          },\n          \"discount_cents\": {\n            \"type\": \"integer\"\n          }\n        }\n      }\n    }\n  }\n}\n"
  - repo: shop
    file: server/orders.go
    new: "// Package server is the shop's HTTP API.\npackage server\n\nimport (\n\t\"encoding/json\"\n\t\"net/http\"\n\t\"strings\"\n)\n\n// Item is one line of an order.\ntype Item struct {\n\tSKU string `json:\"sku\"`\n\tQty int    `json:\"qty\"`\n}\n\n// Order is an order as the API returns it (api/openapi.json).\ntype Order struct {\n\tID            string `json:\"id\"`\n\tItems         []Item `json:\"items\"`\n\tTotalCents    int    `json:\"total_cents\"`\n\tDiscountCents int    `json:\"discount_cents\"`\n}\n\n// Store holds the orders.\ntype Store map[string]Order\n\n// Handler serves GET /orders/{id}.\nfunc (s Store) Handler() http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tid := strings.TrimPrefix(r.URL.Path, \"/orders/\")\n\t\to, ok := s[id]\n\t\tif r.Method != http.MethodGet || !ok {\n\t\t\thttp.NotFound(w, r)\n\t\t\treturn\n\t\t}\n\t\tw.Header().Set(\"Content-Type\", \"application/json\")\n\t\t_ = json.NewEncoder(w).Encode(o)\n\t})\n}\n"
  - repo: shop
    file: web/src/client.gen.ts
    new: "// Code generated by tools/gen-client.mjs from api/openapi.json. DO NOT EDIT.\n\nexport interface Item {\n  sku: string;\n  qty: number;\n}\n\nexport const ITEM_FIELDS = [\"sku\",\"qty\"] as const;\n\nexport interface Order {\n  id: string;\n  items: Item[];\n  total_cents: number;\n  discount_cents: number;\n}\n\nexport const ORDER_FIELDS = [\"id\",\"items\",\"total_cents\",\"discount_cents\"] as const;\n\nexport async function getOrder(base: string, id: string): Promise<Order> {\n  const res = await fetch(`${base}/orders/${encodeURIComponent(id)}`, { method: 'GET' });\n  if (!res.ok) throw new Error(`getOrder: HTTP ${res.status}`);\n  return (await res.json()) as Order;\n}\n"
