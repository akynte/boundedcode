id: poly-rename-qty
category: refactor
language: multi
languages: [go, typescript]
fixture: poly-shop
repos: [shop]
request: >-
  Rename the order item field qty to quantity everywhere it crosses the wire:
  the server's JSON, api/openapi.json, the generated web client and the web
  code that reads it. Keep every test passing.
hidden:
  - repo: shop
    path: server/hidden_test.go
    content: |
      package server

      import (
      	"net/http/httptest"
      	"strings"
      	"testing"
      )

      func TestHiddenQuantity(t *testing.T) {
      	s := Store{"o1": {ID: "o1", Items: []Item{{SKU: "A", Quantity: 3}}}}
      	rec := httptest.NewRecorder()
      	s.Handler().ServeHTTP(rec, httptest.NewRequest("GET", "/orders/o1", nil))
      	if b := rec.Body.String(); !strings.Contains(b, `"quantity":3`) || strings.Contains(b, `"qty"`) {
      		t.Fatal(b)
      	}
      }
  - repo: shop
    path: web/test/hidden.test.ts
    content: |
      import test from 'node:test';
      import assert from 'node:assert';
      import { itemCount, parseOrder } from '../src/order.ts';

      test('quantity on the wire', () => {
        const o = parseOrder('{"id":"o1","items":[{"sku":"A","quantity":2},{"sku":"B","quantity":5}],"total_cents":1}');
        assert.strictEqual(itemCount(o), 7);
      });
checks:
  - repo: shop
    run: [sh, -c, "node tools/gen-client.mjs --check && ! grep -rnw --exclude='*_test.go' qty api server web/src && (cd server && go test ./...) && cd web && node --test"]
may_change: ["web/test/*", "server/*_test.go"]
timeout: 20m
group: polyglot
capability: frontend-backend
split: dev
provenance:
  kind: synthetic
  authored: 2026-10-30
reference:
  - repo: shop
    file: api/openapi.json
    new: "{\n  \"openapi\": \"3.0.3\",\n  \"info\": {\n    \"title\": \"shop\",\n    \"version\": \"1.0.0\"\n  },\n  \"paths\": {\n    \"/orders/{id}\": {\n      \"get\": {\n        \"operationId\": \"getOrder\",\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"the order\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/Order\"\n                }\n              }\n            }\n          }\n        }\n      }\n    }\n  },\n  \"components\": {\n    \"schemas\": {\n      \"Item\": {\n        \"type\": \"object\",\n        \"required\": [\n          \"sku\",\n          \"quantity\"\n        ],\n        \"properties\": {\n          \"sku\": {\n            \"type\": \"string\"\n          },\n          \"quantity\": {\n            \"type\": \"integer\"\n          }\n        }\n      },\n      \"Order\": {\n        \"type\": \"object\",\n        \"required\": [\n          \"id\",\n          \"items\",\n          \"total_cents\"\n        ],\n        \"properties\": {\n          \"id\": {\n            \"type\": \"string\"\n          },\n          \"items\": {\n            \"type\": \"array\",\n            \"items\": {\n              \"$ref\": \"#/components/schemas/Item\"\n            }\n          },\n          \"total_cents\": {\n            \"type\": \"integer\"\n          }\n        }\n      }\n    }\n  }\n}\n"
  - repo: shop
    file: web/src/client.gen.ts
    new: "// Code generated by tools/gen-client.mjs from api/openapi.json. DO NOT EDIT.\n\nexport interface Item {\n  sku: string;\n  quantity: number;\n}\n\nexport const ITEM_FIELDS = [\"sku\",\"quantity\"] as const;\n\nexport interface Order {\n  id: string;\n  items: Item[];\n  total_cents: number;\n}\n\nexport const ORDER_FIELDS = [\"id\",\"items\",\"total_cents\"] as const;\n\nexport async function getOrder(base: string, id: string): Promise<Order> {\n  const res = await fetch(`${base}/orders/${encodeURIComponent(id)}`, { method: 'GET' });\n  if (!res.ok) throw new Error(`getOrder: HTTP ${res.status}`);\n  return (await res.json()) as Order;\n}\n"
  - repo: shop
    file: server/orders.go
    new: "// Package server is the shop's HTTP API.\npackage server\n\nimport (\n\t\"encoding/json\"\n\t\"net/http\"\n\t\"strings\"\n)\n\n// Item is one line of an order.\ntype Item struct {\n\tSKU      string `json:\"sku\"`\n\tQuantity int    `json:\"quantity\"`\n}\n\n// Order is an order as the API returns it (api/openapi.json).\ntype Order struct {\n\tID         string `json:\"id\"`\n\tItems      []Item `json:\"items\"`\n\tTotalCents int    `json:\"total_cents\"`\n}\n\n// Store holds the orders.\ntype Store map[string]Order\n\n// Handler serves GET /orders/{id}.\nfunc (s Store) Handler() http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tid := strings.TrimPrefix(r.URL.Path, \"/orders/\")\n\t\to, ok := s[id]\n\t\tif r.Method != http.MethodGet || !ok {\n\t\t\thttp.NotFound(w, r)\n\t\t\treturn\n\t\t}\n\t\tw.Header().Set(\"Content-Type\", \"application/json\")\n\t\t_ = json.NewEncoder(w).Encode(o)\n\t})\n}\n"
  - repo: shop
    file: server/orders_test.go
    new: "package server\n\nimport (\n\t\"net/http/httptest\"\n\t\"strings\"\n\t\"testing\"\n)\n\nfunc TestGetOrder(t *testing.T) {\n\ts := Store{\"o1\": {ID: \"o1\", Items: []Item{{SKU: \"A\", Quantity: 2}}, TotalCents: 500}}\n\trec := httptest.NewRecorder()\n\ts.Handler().ServeHTTP(rec, httptest.NewRequest(\"GET\", \"/orders/o1\", nil))\n\tif rec.Code != 200 || !strings.Contains(rec.Body.String(), `\"total_cents\":500`) {\n\t\tt.Fatalf(\"%d %s\", rec.Code, rec.Body.String())\n\t}\n}\n"
  - repo: shop
    file: web/src/order.ts
    new: "import type { Order } from './client.gen.ts';\n\n// itemCount is the number of units in an order.\nexport function itemCount(o: Order): number {\n  return o.items.reduce((n, it) => n + it.quantity, 0);\n}\n\n// formatTotal shows the order's total, e.g. \"\u20ac12.34\".\nexport function formatTotal(o: Order): string {\n  return '\u20ac' + (o.total_cents / 100).toFixed(2);\n}\n\n// parseOrder reads an order from the server's JSON.\nexport function parseOrder(json: string): Order {\n  const o = JSON.parse(json);\n  return { id: o.id, items: o.items.map((it: { sku: string; quantity: number }) => ({ sku: it.sku, quantity: it.quantity })), total_cents: o.total_cents };\n}\n"
  - repo: shop
    file: web/test/order.test.ts
    new: "import test from 'node:test';\nimport assert from 'node:assert';\nimport { formatTotal, itemCount, parseOrder } from '../src/order.ts';\n\nconst json = '{\"id\":\"o1\",\"items\":[{\"sku\":\"A\",\"quantity\":2},{\"sku\":\"B\",\"quantity\":1}],\"total_cents\":1234}';\n\ntest('parse and count', () => {\n  const o = parseOrder(json);\n  assert.strictEqual(itemCount(o), 3);\n});\n\ntest('format', () => {\n  assert.strictEqual(formatTotal(parseOrder(json)), '\u20ac12.34');\n});\n\nimport { orderErrors } from '../src/validate.ts';\n\ntest('schema checks', () => {\n  assert.deepStrictEqual(orderErrors({ id: 'o1', items: [], total_cents: 1 }), []);\n  assert.deepStrictEqual(orderErrors({ id: 'o1', items: [], total_cents: '1' }), ['total_cents is not integer']);\n});\n"
