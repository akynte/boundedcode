id: session-ledger
category: session
# A short working session in one conversation: diagnose, fix, add a test,
# then a question about what was done. The planted defect has two parts:
# the account comparison is inverted, and debits are counted for every
# account. Inverting the whole condition passes the visible tests but
# leaves debits out of the balance, which the test asked for in the third
# turn (a credit and a debit on one account) exposes; the hidden test
# fails unless both parts are fixed.
fixture: payment-platform
repos: [ledger-service]
setup:
  - repo: ledger-service
    file: internal/ledger/ledger.go
    old: "if e.AccountID == accountID {"
    new: "if e.AccountID != accountID || e.AmountCents < 0 {"
  - repo: ledger-service
    file: internal/ledger/ledger_test.go
    new: |
      package ledger

      import "testing"

      func TestBalance(t *testing.T) {
      	l := &Ledger{}
      	if err := l.Post(Entry{AccountID: "a", AmountCents: 100, Currency: "EUR"}, Entry{AccountID: "b", AmountCents: -100, Currency: "EUR"}); err != nil {
      		t.Fatal(err)
      	}
      	if got := l.Balance("a"); got != 100 {
      		t.Fatalf("balance(a) = %d, want 100", got)
      	}
      }
request: >-
  Run the tests in ledger-service and tell me which test fails and why. Do not
  change anything yet.
turns:
  - request: Fix the root cause in the production code and run the tests again.
  - request: >-
      Now add a unit test in a new file internal/ledger/balance_test.go: post a
      credit of 300 and a debit of 100 to the same account (each balanced
      against another account) and check the balance is 200. Run the tests.
  - request: >-
      What exactly was wrong in the production code, and how many separate
      mistakes did the condition contain?
    expect:
      - "Balance|ledger\\.go"
      - "!=|invert|negat|opposite"
      - "debit|negative|AmountCents|< ?0"
hidden:
  - repo: ledger-service
    path: internal/ledger/hidden_session_test.go
    content: |
      package ledger

      import "testing"

      func TestHiddenBalanceIgnoresOtherAccounts(t *testing.T) {
      	l := &Ledger{}
      	if err := l.Post(Entry{AccountID: "x", AmountCents: 5, Currency: "USD"}, Entry{AccountID: "y", AmountCents: -5, Currency: "USD"}); err != nil {
      		t.Fatal(err)
      	}
      	if err := l.Post(Entry{AccountID: "x", AmountCents: -2, Currency: "USD"}, Entry{AccountID: "z", AmountCents: 2, Currency: "USD"}); err != nil {
      		t.Fatal(err)
      	}
      	if l.Balance("x") != 3 || l.Balance("y") != -5 || l.Balance("z") != 2 || l.Balance("w") != 0 {
      		t.Fatalf("x=%d y=%d z=%d w=%d", l.Balance("x"), l.Balance("y"), l.Balance("z"), l.Balance("w"))
      	}
      }
checks:
  - repo: ledger-service
    run: [go, test, ./...]
  - repo: ledger-service
    run: [sh, -c, "grep -q 'func Test' internal/ledger/balance_test.go && grep -q 'Balance(' internal/ledger/balance_test.go"]
timeout: 25m
