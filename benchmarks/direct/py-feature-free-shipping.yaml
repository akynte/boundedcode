id: py-feature-free-shipping
category: feature
language: python
fixture: langs
repos: [py-orders]
setup:
  - repo: py-orders
    file: orders/shipping.py
    old: "        if weight_kg < band[\"max_kg\"]:\n"
    new: "        if weight_kg <= band[\"max_kg\"]:\n"
request: >-
  In the orders project, shipping becomes free for orders whose subtotal
  (before any discount) is at least 50.00: add a subtotal_cents parameter to
  shipping_cost (default 0, so existing callers keep their behaviour), make
  checkout_total pass the subtotal, and add tests. Run the tests (generate the
  rates first with python3 tools/gen_rates.py).
hidden:
  - repo: py-orders
    path: tests/test_hidden_free.py
    content: |
      import unittest

      from orders.checkout import checkout_total
      from orders.shipping import shipping_cost


      class HiddenFree(unittest.TestCase):
          def test_threshold(self):
              self.assertEqual(shipping_cost(3, 5000), 0)
              self.assertEqual(shipping_cost(3, 4999), 899)
              self.assertEqual(shipping_cost(3), 899)

          def test_checkout_uses_the_subtotal_before_discount(self):
              items = [{"price_cents": 5000, "qty": 1}]
              self.assertEqual(checkout_total(items, "WELCOME10", 3), 4500)
              self.assertEqual(checkout_total([{"price_cents": 1000, "qty": 1}], None, 3), 1899)
checks:
  - repo: py-orders
    run: [sh, -c, "python3 tools/gen_rates.py >/dev/null && python3 -m unittest discover -s tests"]
timeout: 15m
group: everyday
capability: feature
split: heldout
provenance:
  kind: synthetic
  authored: 2026-10-30
reference:
  - repo: py-orders
    file: orders/shipping.py
    new: "\"\"\"Shipping costs.\"\"\"\n\nimport json\nimport os\n\nRATES = os.path.join(os.path.dirname(__file__), \"..\", \"data\", \"rates.json\")\n\n\ndef _rates():\n    with open(RATES) as f:\n        return json.load(f)\n\n\nFREE_FROM_CENTS = 5000\n\n\ndef shipping_cost(weight_kg, subtotal_cents=0):\n    \"\"\"Shipping in cents for a parcel of weight_kg: the price of the first\n    band (in rates.json, bands sorted by max_kg) whose max_kg is at least\n    the weight; parcels over every band pay the last band's price plus\n    surcharge_per_kg for each started kilogram above it.\"\"\"\n    if subtotal_cents >= FREE_FROM_CENTS:\n        return 0\n    r = _rates()\n    for band in r[\"bands\"]:\n        if weight_kg <= band[\"max_kg\"]:\n            return band[\"cents\"]\n    last = r[\"bands\"][-1]\n    extra = weight_kg - last[\"max_kg\"]\n    return last[\"cents\"] + int(extra) * r[\"surcharge_per_kg\"]\n"
  - repo: py-orders
    file: orders/checkout.py
    new: "\"\"\"Checkout totals.\"\"\"\n\nfrom orders.pricing import apply_discount\nfrom orders.shipping import shipping_cost\n\n\ndef checkout_total(items, code=None, weight_kg=0.0):\n    \"\"\"The amount to charge: the items' prices with the discount, plus\n    shipping for weight_kg.\"\"\"\n    subtotal = sum(i[\"price_cents\"] * i[\"qty\"] for i in items)\n    return apply_discount(subtotal, code) + shipping_cost(weight_kg, subtotal)\n"
