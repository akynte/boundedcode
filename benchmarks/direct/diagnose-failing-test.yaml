id: diagnose-failing-test
language: go
category: diagnose
fixture: payment-platform
repos: [ledger-service]
setup:
  - repo: ledger-service
    file: internal/ledger/ledger.go
    old: "if e.AccountID == accountID {"
    new: "if e.AccountID != accountID || e.Currency == \"\" {"
  - repo: ledger-service
    file: internal/ledger/ledger_test.go
    new: |
      package ledger

      import "testing"

      func TestBalance(t *testing.T) {
      	l := &Ledger{}
      	if err := l.Post(Entry{AccountID: "a", AmountCents: 100, Currency: "EUR"}, Entry{AccountID: "b", AmountCents: -100, Currency: "EUR"}); err != nil {
      		t.Fatal(err)
      	}
      	if got := l.Balance("a"); got != 100 {
      		t.Fatalf("balance(a) = %d, want 100", got)
      	}
      }
request: >-
  Run the tests in ledger-service and tell me which test fails and what the
  root cause in the production code is. Do not change anything yet.
expect:
  - TestBalance
  - "Balance"
  - "!=|negat|invert|wrong account|compar|condition"
checks:
  - repo: ledger-service
    run: [sh, -c, "git diff --quiet HEAD -- . && test -z \"$(git status --porcelain --untracked-files=all)\""]
timeout: 15m
