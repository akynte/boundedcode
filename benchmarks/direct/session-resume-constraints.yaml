id: session-resume-constraints
language: go
category: session
# Constraints stated once at the start must hold to the end, across a
# question that grows the history and a resume from the session file (as
# after a restart). The planted defect has two parts (see session-ledger).
fixture: payment-platform
repos: [ledger-service]
setup:
  - repo: ledger-service
    file: internal/ledger/ledger.go
    old: "if e.AccountID == accountID {"
    new: "if e.AccountID != accountID || e.AmountCents < 0 {"
  - repo: ledger-service
    file: internal/ledger/ledger_test.go
    new: |
      package ledger

      import "testing"

      func TestBalance(t *testing.T) {
      	l := &Ledger{}
      	if err := l.Post(Entry{AccountID: "a", AmountCents: 100, Currency: "EUR"}, Entry{AccountID: "b", AmountCents: -100, Currency: "EUR"}); err != nil {
      		t.Fatal(err)
      	}
      	if got := l.Balance("a"); got != 100 {
      		t.Fatalf("balance(a) = %d, want 100", got)
      	}
      }
request: >-
  Two rules for this whole session: do not modify or delete any existing test
  file, and keep the exported API of package ledger exactly as it is. First,
  run the tests in ledger-service and tell me what fails and why. Do not change
  anything yet.
expect:
  - "Balance|ledger\\.go"
turns:
  - request: >-
      Before fixing it: how does the consumer package use the ledger? Name the
      functions involved.
  - request: "Continue now: fix the root cause and run the tests."
    resume: true
  - request: >-
      Add a regression test for what you fixed in a new file
      internal/ledger/regression_test.go (a credit and a debit on the same
      account), run the tests, and tell me which rules I gave you at the start.
    expect:
      - "test|Test"
      - "API|exported"
hidden:
  - repo: ledger-service
    path: internal/ledger/hidden_api_test.go
    content: |
      package ledger

      import "testing"

      // The exported API, as it was.
      var (
      	_ func(*Ledger, ...Entry) error = (*Ledger).Post
      	_ func(*Ledger, string) int64   = (*Ledger).Balance
      	_ func(*Ledger) []Entry         = (*Ledger).Entries
      	_                               = ErrUnbalanced
      )

      func TestHiddenBalanceBothSides(t *testing.T) {
      	l := &Ledger{}
      	_ = l.Post(Entry{AccountID: "x", AmountCents: 5, Currency: "USD"}, Entry{AccountID: "y", AmountCents: -5, Currency: "USD"})
      	_ = l.Post(Entry{AccountID: "x", AmountCents: -2, Currency: "USD"}, Entry{AccountID: "z", AmountCents: 2, Currency: "USD"})
      	if l.Balance("x") != 3 || l.Balance("y") != -5 || l.Balance("z") != 2 {
      		t.Fatalf("x=%d y=%d z=%d", l.Balance("x"), l.Balance("y"), l.Balance("z"))
      	}
      }
checks:
  - repo: ledger-service
    run: [go, test, ./...]
  - repo: ledger-service
    run: [sh, -c, "git diff --exit-code HEAD -- internal/ledger/ledger_test.go internal/consumer/consumer_test.go && test -f internal/ledger/regression_test.go"]
timeout: 30m
