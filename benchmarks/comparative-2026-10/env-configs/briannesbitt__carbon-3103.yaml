# Environment-only verification config for this evaluation task (deviations.md D1),
# committed into the task's base. BoundedCode's preset for this repository
# (env-configs/preset/), minus what fails or times out on the untouched base in
# the offline sandbox (measured before any frozen run, 2026-10-09):
#   php-test: CarbonPeriod CreateTest::testStartAndEndFallback (expects 2024 dates; the
#   clock reads 2026) and TestingAidsTest::testCreateFromPartialFormat (2 errors) fail on
#   the base; excluded with a PHPUnit filter.
version: 1
stages:
- name: php-test
  run:
  - sh
  - -c
  - 'command -v php >/dev/null 2>&1 || { echo "php is not installed in the sandbox image; rebuild it with `boundedcode sandbox build`"; exit 1; }; set --; [ -f phpunit.xml ] || [ -f phpunit.xml.dist ] || [ -f phpunit.dist.xml ] || { [ -d tests ] && set -- tests; }; if [ -f vendor/bin/phpunit ]; then php vendor/bin/phpunit --filter ''/^(?!.*(testStartAndEndFallback|testCreateFromPartialFormat)).*$/'' "$@"; exit $?; fi; if [ -f vendor/bin/pest ]; then php vendor/bin/pest; exit $?; fi; if grep -qsE ''"(phpunit/phpunit|pestphp/pest)"'' composer.json; then echo "vendor/ missing: install the project''s dependencies in the repository checkout (composer install) so verification can run them"; exit 1; fi; echo "no test runner"; exit 127'
  timeout: 20m0s
  requires:
  - composer.json
  tests: true
