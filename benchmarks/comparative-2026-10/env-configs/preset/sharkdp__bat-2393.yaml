version: 1
stages:
    - name: cargo-build
      run:
        - sh
        - -c
        - 'command -v cargo >/dev/null 2>&1 || { echo "cargo is not installed in the sandbox image; rebuild it"; exit 1; }; if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then rustup which cargo >/dev/null 2>&1 || { d=$(rustup default 2>/dev/null | cut -d'' '' -f1); echo "note: the toolchain the project pins is not installed; using $d"; export RUSTUP_TOOLCHAIN=$d; }; fi; cargo build --workspace'
      scope: ""
      timeout: 20m0s
      optional: false
      requires:
        - Cargo.toml
      tests: false
    - name: cargo-test
      run:
        - sh
        - -c
        - 'command -v cargo >/dev/null 2>&1 || { echo "cargo is not installed in the sandbox image; rebuild it"; exit 1; }; if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then rustup which cargo >/dev/null 2>&1 || { d=$(rustup default 2>/dev/null | cut -d'' '' -f1); echo "note: the toolchain the project pins is not installed; using $d"; export RUSTUP_TOOLCHAIN=$d; }; fi; cargo test --workspace --no-fail-fast'
      scope: ""
      timeout: 30m0s
      optional: false
      requires:
        - Cargo.toml
      tests: true
    - name: terraform-fmt
      run:
        - sh
        - -c
        - command -v terraform >/dev/null || exit 127; terraform fmt -check -recursive -diff
      scope: ""
      timeout: 0s
      optional: true
      requires: []
      tests: false
max_changed_files: 0
deny_paths: []
